<div class="interactive-widget" id="sap-widget">
<style>
    #sap-widget {
        width: 100%;
        font-family: var(--font-family, system-ui, sans-serif);
    }

    #sap-widget canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        border: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
    }

    #sap-widget .sap-controls {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #sap-widget .sap-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #sap-widget .sap-label {
        font-size: 0.78rem;
        font-weight: 600;
        width: 60px;
        flex-shrink: 0;
        color: var(--text-secondary, #9090a8);
    }

    #sap-widget .sap-label.x-label { color: #60a5fa; }
    #sap-widget .sap-label.y-label { color: #4ade80; }

    #sap-widget input[type=range] {
        flex: 1;
        height: 5px;
        cursor: pointer;
    }

    #sap-widget input[type=range].x-slider { accent-color: #60a5fa; }
    #sap-widget input[type=range].y-slider { accent-color: #4ade80; }

    #sap-widget input[type=range]:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    #sap-widget .sap-val {
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        width: 46px;
        text-align: right;
        flex-shrink: 0;
        color: var(--text-primary, #e8e8f0);
    }

    #sap-widget .sap-toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
        background: rgba(255,255,255,0.02);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition: background 150ms, border-color 150ms;
    }

    #sap-widget .sap-toggle-row:hover {
        background: rgba(107,37,221,0.08);
        border-color: rgba(107,37,221,0.25);
    }

    #sap-widget .sap-toggle-row.active {
        background: rgba(107,37,221,0.12);
        border-color: var(--accent-primary, #6B25DD);
    }

    #sap-widget .sap-chain-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        opacity: 0.5;
        transition: opacity 150ms;
    }

    #sap-widget .sap-toggle-row.active .sap-chain-icon {
        opacity: 1;
    }

    #sap-widget .sap-toggle-label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-primary, #e8e8f0);
    }

    #sap-widget .sap-toggle-state {
        margin-left: auto;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
        background: rgba(107,37,221,0.0);
        color: var(--text-secondary, #9090a8);
        transition: background 150ms, color 150ms;
    }

    #sap-widget .sap-toggle-row.active .sap-toggle-state {
        background: rgba(107,37,221,0.2);
        color: #c4a0ff;
    }

    #sap-widget .sap-bottom-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #sap-widget .sap-reset-btn {
        padding: 5px 14px;
        border-radius: 50px;
        border: 1px solid rgba(255,255,255,0.1);
        background: var(--bg-tertiary, #1a1a25);
        color: var(--text-secondary, #9090a8);
        font-family: inherit;
        font-size: 0.75rem;
        cursor: pointer;
        transition: border-color 150ms, color 150ms;
        flex-shrink: 0;
    }

    #sap-widget .sap-reset-btn:hover {
        border-color: rgba(255,255,255,0.25);
        color: var(--text-primary, #e8e8f0);
    }

    #sap-widget .sap-info {
        flex: 1;
        padding: 7px 12px;
        border-radius: 6px;
        background: rgba(107,37,221,0.06);
        border-left: 3px solid var(--accent-primary, #6B25DD);
        font-size: 0.78rem;
        line-height: 1.45;
        color: var(--text-secondary, #9090a8);
        font-variant-numeric: tabular-nums;
    }
</style>

<canvas id="sap-canvas" width="600" height="380"></canvas>

<div class="sap-controls">
    <!-- X Scale -->
    <div class="sap-row">
        <span class="sap-label x-label">X Scale</span>
        <input type="range" class="x-slider" id="sap-x-slider" min="0" max="300" step="1" value="100">
        <span class="sap-val" id="sap-x-val">100%</span>
    </div>

    <!-- Y Scale -->
    <div class="sap-row">
        <span class="sap-label y-label">Y Scale</span>
        <input type="range" class="y-slider" id="sap-y-slider" min="0" max="300" step="1" value="100">
        <span class="sap-val" id="sap-y-val">100%</span>
    </div>

    <!-- Maintain Proportions toggle -->
    <div class="sap-toggle-row active" id="sap-maintain-row">
        <svg class="sap-chain-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.5 11.5a3.5 3.5 0 0 0 5 0l2-2a3.536 3.536 0 0 0-5-5L9.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11.5 8.5a3.5 3.5 0 0 0-5 0l-2 2a3.536 3.536 0 0 0 5 5l1-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sap-toggle-label">Maintain Proportions</span>
        <span class="sap-toggle-state" id="sap-maintain-state">On</span>
    </div>

    <!-- Reset + info -->
    <div class="sap-bottom-row">
        <button class="sap-reset-btn" id="sap-reset-btn">Reset</button>
        <div class="sap-info" id="sap-info">100% × 100% — original size</div>
    </div>
</div>

<script>
(function() {
    var canvas = document.getElementById('sap-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');

    var xSlider      = document.getElementById('sap-x-slider');
    var ySlider      = document.getElementById('sap-y-slider');
    var xVal         = document.getElementById('sap-x-val');
    var yVal         = document.getElementById('sap-y-val');
    var maintainRow  = document.getElementById('sap-maintain-row');
    var maintainState= document.getElementById('sap-maintain-state');
    var resetBtn     = document.getElementById('sap-reset-btn');
    var infoEl       = document.getElementById('sap-info');

    var W = 600, H = 380;
    // Base cue size at 100% scale
    var BASE_W = 200, BASE_H = 130;
    // Anchor = canvas centre
    var AX = W / 2, AY = H / 2;

    var scaleX = 1.0;
    var scaleY = 1.0;
    var linked = true;

    // ── draw ────────────────────────────────────────────────────────────
    function draw() {
        ctx.clearRect(0, 0, W, H);
        drawBg();
        drawGrid();
        drawCue();
        drawAnchor();
        drawDimLabels();
    }

    function drawBg() {
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0a0a1a');
        grad.addColorStop(1, '#111126');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }

    function drawGrid() {
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        var step = 40;
        ctx.beginPath();
        for (var x = 0; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
        for (var y = 0; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();
    }

    function drawCue() {
        var cw = BASE_W * scaleX;
        var ch = BASE_H * scaleY;
        var cx = AX - cw / 2;
        var cy = AY - ch / 2;

        // Ghost outline of original 100% size
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(AX - BASE_W/2, AY - BASE_H/2, BASE_W, BASE_H);
        ctx.setLineDash([]);
        ctx.restore();

        // Only draw if has non-zero size
        if (cw < 1 || ch < 1) return;

        // Cue fill — gradient to suggest media content
        ctx.save();
        var fillGrad = ctx.createLinearGradient(cx, cy, cx + cw, cy + ch);
        fillGrad.addColorStop(0,   'rgba(107,37,221,0.35)');
        fillGrad.addColorStop(0.5, 'rgba(80,20,180,0.25)');
        fillGrad.addColorStop(1,   'rgba(50,10,140,0.35)');
        ctx.fillStyle = fillGrad;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(cx, cy, cw, ch, Math.min(6, cw*0.05, ch*0.05))
                      : ctx.rect(cx, cy, cw, ch);
        ctx.fill();

        // Subtle inner grid texture
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        var gstep = 30;
        for (var gx = cx + gstep; gx < cx + cw; gx += gstep) {
            ctx.moveTo(gx, cy); ctx.lineTo(gx, cy + ch);
        }
        for (var gy = cy + gstep; gy < cy + ch; gy += gstep) {
            ctx.moveTo(cx, gy); ctx.lineTo(cx + cw, gy);
        }
        ctx.stroke();

        // Cue border
        ctx.strokeStyle = 'rgba(107,37,221,0.75)';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = 'rgba(107,37,221,0.4)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(cx, cy, cw, ch, Math.min(6, cw*0.05, ch*0.05))
                      : ctx.rect(cx, cy, cw, ch);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // "CUE" label inside
        var fontSize = Math.max(9, Math.min(16, cw * 0.08));
        if (cw > 30 && ch > 18) {
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.font = 'bold ' + fontSize + 'px var(--font-family, system-ui)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CUE', AX, AY);
        }

        ctx.restore();
    }

    function drawAnchor() {
        var r = 5;
        var arm = 11;

        ctx.save();
        // crosshair arms
        ctx.strokeStyle = 'rgba(245,200,66,0.85)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(AX - arm, AY); ctx.lineTo(AX + arm, AY);
        ctx.moveTo(AX, AY - arm); ctx.lineTo(AX, AY + arm);
        ctx.stroke();

        // centre dot
        ctx.shadowColor = '#f5c842';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(AX, AY, r, 0, Math.PI * 2);
        ctx.fillStyle = '#f5c842';
        ctx.fill();
        ctx.shadowBlur = 0;

        // "ANCHOR" label
        ctx.font = '10px var(--font-family, system-ui)';
        ctx.fillStyle = 'rgba(245,200,66,0.7)';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('ANCHOR', AX + arm + 4, AY);

        ctx.restore();
    }

    function drawDimLabels() {
        var cw = BASE_W * scaleX;
        var ch = BASE_H * scaleY;
        var cx = AX - cw / 2;
        var cy = AY - ch / 2;

        ctx.save();
        ctx.font = 'bold 11px var(--font-family, system-ui)';
        ctx.textBaseline = 'middle';

        // X badge — above cue, centred horizontally
        var xPct = Math.round(scaleX * 100);
        var xLabel = xPct + '%';
        var xBgW = ctx.measureText(xLabel).width + 12;
        var xBgH = 18;
        var xBgX = AX - xBgW / 2;
        var xBgY = cy - 26;

        // clamp so it stays on canvas
        xBgY = Math.max(4, xBgY);

        ctx.fillStyle = 'rgba(96,165,250,0.18)';
        ctx.strokeStyle = 'rgba(96,165,250,0.5)';
        ctx.lineWidth = 1;
        roundRect(ctx, xBgX, xBgY, xBgW, xBgH, 4);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#60a5fa';
        ctx.textAlign = 'center';
        ctx.fillText(xLabel, AX, xBgY + xBgH / 2);

        // Y badge — left of cue, centred vertically
        var yPct = Math.round(scaleY * 100);
        var yLabel = yPct + '%';
        var yBgW = ctx.measureText(yLabel).width + 12;
        var yBgH = 18;
        var yBgX = cx - yBgW - 8;
        var yBgY = AY - yBgH / 2;

        yBgX = Math.max(4, yBgX);

        ctx.fillStyle = 'rgba(74,222,128,0.18)';
        ctx.strokeStyle = 'rgba(74,222,128,0.5)';
        roundRect(ctx, yBgX, yBgY, yBgW, yBgH, 4);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4ade80';
        ctx.textAlign = 'center';
        ctx.fillText(yLabel, yBgX + yBgW / 2, yBgY + yBgH / 2);

        ctx.restore();
    }

    // Polyfill for roundRect
    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        if (c.roundRect) {
            c.roundRect(x, y, w, h, r);
        } else {
            c.moveTo(x + r, y);
            c.lineTo(x + w - r, y);
            c.quadraticCurveTo(x + w, y, x + w, y + r);
            c.lineTo(x + w, y + h - r);
            c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            c.lineTo(x + r, y + h);
            c.quadraticCurveTo(x, y + h, x, y + h - r);
            c.lineTo(x, y + r);
            c.quadraticCurveTo(x, y, x + r, y);
            c.closePath();
        }
    }

    // ── info text ────────────────────────────────────────────────────────
    function updateInfo() {
        var xp = Math.round(scaleX * 100);
        var yp = Math.round(scaleY * 100);
        var msg;
        if (xp === 100 && yp === 100) {
            msg = xp + '% \u00d7 ' + yp + '% \u2014 original size';
        } else if (xp === yp) {
            msg = xp + '% \u00d7 ' + yp + '% \u2014 uniform scale' + (xp > 100 ? ', enlarged' : ', reduced');
        } else if (xp === 0 || yp === 0) {
            msg = xp + '% \u00d7 ' + yp + '% \u2014 collapsed';
        } else {
            msg = xp + '% \u00d7 ' + yp + '% \u2014 anamorphic stretch';
        }
        infoEl.textContent = msg;
    }

    // ── controls ─────────────────────────────────────────────────────────
    xSlider.addEventListener('input', function() {
        scaleX = xSlider.value / 100;
        if (linked) {
            scaleY = scaleX;
            ySlider.value = xSlider.value;
            yVal.textContent = Math.round(scaleY * 100) + '%';
        }
        xVal.textContent = Math.round(scaleX * 100) + '%';
        updateInfo();
        draw();
    });

    ySlider.addEventListener('input', function() {
        if (linked) return;
        scaleY = ySlider.value / 100;
        yVal.textContent = Math.round(scaleY * 100) + '%';
        updateInfo();
        draw();
    });

    maintainRow.addEventListener('click', function() {
        linked = !linked;
        maintainRow.classList.toggle('active', linked);
        maintainState.textContent = linked ? 'On' : 'Off';
        ySlider.disabled = linked;
        if (linked) {
            // snap Y to X
            scaleY = scaleX;
            ySlider.value = xSlider.value;
            yVal.textContent = Math.round(scaleY * 100) + '%';
            updateInfo();
            draw();
        }
    });

    resetBtn.addEventListener('click', function() {
        scaleX = 1; scaleY = 1;
        xSlider.value = 100; ySlider.value = 100;
        xVal.textContent = '100%'; yVal.textContent = '100%';
        linked = true;
        maintainRow.classList.add('active');
        maintainState.textContent = 'On';
        ySlider.disabled = true;
        updateInfo();
        draw();
    });

    // ── init ─────────────────────────────────────────────────────────────
    ySlider.disabled = true; // starts linked
    updateInfo();
    draw();
})();
</script>
</div>
