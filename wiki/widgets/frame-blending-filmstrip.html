<div class="interactive-widget" id="frame-blending-filmstrip-widget">
    <style>
        #frame-blending-filmstrip-widget {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #frame-blending-filmstrip-widget .fbfs-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        #frame-blending-filmstrip-widget .fbfs-toolbar label {
            font-size: 0.88rem;
        }

        #frame-blending-filmstrip-widget .fbfs-toolbar select {
            margin-left: 6px;
            border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.2));
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            color: var(--text-primary, #e7e5e4);
            border-radius: 7px;
            padding: 6px 10px;
            font-size: 0.86rem;
            min-width: 240px;
        }

        #frame-blending-filmstrip-widget .fbfs-toolbar select:focus {
            outline: 2px solid rgba(147, 197, 253, 0.55);
            outline-offset: 1px;
        }

        #frame-blending-filmstrip-widget .fbfs-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        #frame-blending-filmstrip-widget .fbfs-btn {
            border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.2));
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary, #e7e5e4);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.82rem;
            cursor: pointer;
        }

        #frame-blending-filmstrip-widget .fbfs-btn:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        #frame-blending-filmstrip-widget .fbfs-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #frame-blending-filmstrip-widget .fbfs-info {
            font-size: 0.86rem;
            color: var(--text-secondary, #a8a29e);
        }

        #frame-blending-filmstrip-widget .fbfs-stage {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        #frame-blending-filmstrip-widget .fbfs-panel {
            border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.2));
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
            position: relative;
        }

        #frame-blending-filmstrip-widget .fbfs-panel h4 {
            margin: 0;
            padding: 8px 10px;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary, #a8a29e);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #frame-blending-filmstrip-widget .fbfs-panel-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #frame-blending-filmstrip-widget .fbfs-panel-toggle {
            margin-left: auto;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.72rem;
            padding: 4px 8px;
        }

        #frame-blending-filmstrip-widget .fbfs-panel.is-reference h4 {
            color: #fca5a5;
        }

        #frame-blending-filmstrip-widget .fbfs-panel.is-blended h4 {
            color: #93c5fd;
        }

        #frame-blending-filmstrip-widget video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #000;
            object-fit: cover;
        }

        #frame-blending-filmstrip-widget .fbfs-panel.is-disabled video {
            opacity: 0.2;
            filter: grayscale(1);
        }

        #frame-blending-filmstrip-widget .fbfs-disabled-badge {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            color: #f1f5f9;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            pointer-events: none;
        }

        #frame-blending-filmstrip-widget .fbfs-panel.is-disabled .fbfs-disabled-badge {
            display: flex;
        }

        #frame-blending-filmstrip-widget .fbfs-scrub {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        #frame-blending-filmstrip-widget .fbfs-scrub input[type="range"] {
            width: 100%;
        }

        #frame-blending-filmstrip-widget .fbfs-time {
            font-size: 0.76rem;
            color: var(--text-muted, #78716c);
            font-variant-numeric: tabular-nums;
            min-width: 96px;
            text-align: right;
        }

        @media (max-width: 900px) {
            #frame-blending-filmstrip-widget .fbfs-stage {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <div class="fbfs-toolbar">
        <label>
            Scenario:
            <select id="fbfs-scenario">
                <option value="24in60">24fps film in 60fps show</option>
                <option value="25in60">25fps PAL in 60fps show</option>
                <option value="30in60">30fps in 60fps show</option>
                <option value="half">Half-speed (0.5x) in 60fps show</option>
                <option value="quarter">Quarter-speed (0.25x) in 60fps show</option>
            </select>
        </label>

        <label>
            Source Clip:
            <select id="fbfs-source">
                <option value="set1">Monaco</option>
                <option value="set2">Panning Shot</option>
            </select>
        </label>

        <div class="fbfs-buttons">
            <button id="fbfs-play" class="fbfs-btn" type="button" aria-label="Play">&#9654;</button>
            <button id="fbfs-step-back" class="fbfs-btn" type="button">-1 frame</button>
            <button id="fbfs-step-forward" class="fbfs-btn" type="button">+1 frame</button>
            <button id="fbfs-reset" class="fbfs-btn" type="button">Reset</button>
        </div>
    </div>

    <div class="fbfs-info" id="fbfs-scenario-info"></div>

        <div class="fbfs-stage">
            <div class="fbfs-panel is-reference">
                <h4>
                    <span class="fbfs-panel-title">Without Frame Blending</span>
                    <button id="fbfs-toggle-no" class="fbfs-btn fbfs-panel-toggle" type="button">Mute</button>
                </h4>
                <video id="fbfs-no-blend" preload="metadata" muted playsinline loop></video>
                <div class="fbfs-disabled-badge">Without Frame Blending Muted</div>
            </div>

            <div class="fbfs-panel is-blended">
                <h4>
                    <span class="fbfs-panel-title">With Frame Blending</span>
                    <button id="fbfs-toggle-blend" class="fbfs-btn fbfs-panel-toggle" type="button">Mute</button>
                </h4>
                <video id="fbfs-blend" preload="metadata" muted playsinline loop></video>
                <div class="fbfs-disabled-badge">With Frame Blending Muted</div>
            </div>
        </div>

    <div class="fbfs-scrub">
        <input id="fbfs-scrub" type="range" min="0" max="1000" step="1" value="0">
        <div class="fbfs-time">Frame <span id="fbfs-time-current">0</span> / <span id="fbfs-time-total">0</span></div>
    </div>

    <div class="widget-explainer" id="fbfs-explainer"></div>
</div>

<script>
    (function () {
        var ASSET_BASE = '[[RELATIVE_PATH]]widgets/frame-blending/';
        var scenarioEl = document.getElementById('fbfs-scenario');
        var sourceEl = document.getElementById('fbfs-source');
        var playEl = document.getElementById('fbfs-play');
        var stepBackEl = document.getElementById('fbfs-step-back');
        var stepForwardEl = document.getElementById('fbfs-step-forward');
        var resetEl = document.getElementById('fbfs-reset');
        var toggleNoEl = document.getElementById('fbfs-toggle-no');
        var toggleBlendEl = document.getElementById('fbfs-toggle-blend');
        var scrubEl = document.getElementById('fbfs-scrub');
        var infoEl = document.getElementById('fbfs-scenario-info');
        var explainEl = document.getElementById('fbfs-explainer');
        var timeCurrentEl = document.getElementById('fbfs-time-current');
        var timeTotalEl = document.getElementById('fbfs-time-total');
        var noBlendVideo = document.getElementById('fbfs-no-blend');
        var blendVideo = document.getElementById('fbfs-blend');
        var noPanelEl = noBlendVideo ? noBlendVideo.closest('.fbfs-panel') : null;
        var blendPanelEl = blendVideo ? blendVideo.closest('.fbfs-panel') : null;

        if (!scenarioEl || !sourceEl || !playEl || !stepBackEl || !stepForwardEl || !resetEl || !toggleNoEl || !toggleBlendEl || !scrubEl || !infoEl || !explainEl || !timeCurrentEl || !timeTotalEl || !noBlendVideo || !blendVideo || !noPanelEl || !blendPanelEl) return;

        var scenarios = {
            '24in60': {
                sourceFps: 24,
                outputFps: 60,
                label: '24fps source -> 60fps output (2.5:1 cadence)',
                body: 'Without blending this creates a 3:2 hold pattern. With blending, in-between frames reduce visible cadence jumps.',
                assets: {
                    set1: { noBlend: 'fbfs-24in60-no-blend.mp4', blend: 'fbfs-24in60-blend.mp4' },
                    set2: { noBlend: 'fbfs-alt2-24in60-no-blend.mp4', blend: 'fbfs-alt2-24in60-blend.mp4' }
                }
            },
            '25in60': {
                sourceFps: 25,
                outputFps: 60,
                label: '25fps source -> 60fps output (2.4:1 cadence)',
                body: 'The 25->60 conversion produces uneven frame holds. Blending softens this mismatch by mixing adjacent source moments.',
                assets: {
                    set1: { noBlend: 'fbfs-25in60-no-blend.mp4', blend: 'fbfs-25in60-blend.mp4' },
                    set2: { noBlend: 'fbfs-alt2-25in60-no-blend.mp4', blend: 'fbfs-alt2-25in60-blend.mp4' }
                }
            },
            '30in60': {
                sourceFps: 30,
                outputFps: 60,
                label: '30fps source -> 60fps output (2:1 cadence)',
                body: 'Without blending each source frame is repeated twice. With blending, 60fps output includes smoother in-between transition frames.',
                assets: {
                    set1: { noBlend: 'fbfs-30in60-no-blend.mp4', blend: 'fbfs-30in60-blend.mp4' },
                    set2: { noBlend: 'fbfs-alt2-30in60-no-blend.mp4', blend: 'fbfs-alt2-30in60-blend.mp4' }
                }
            },
            'half': {
                sourceFps: 60,
                outputFps: 60,
                speed: 0.5,
                label: '60fps source at 0.5x speed -> effective 30fps motion in 60fps output',
                body: 'At half speed, no-blend output steps every other frame. Blending fills those gaps for smoother slow motion.',
                assets: {
                    set1: { noBlend: 'fbfs-half-no-blend.mp4', blend: 'fbfs-half-blend.mp4' },
                    set2: { noBlend: 'fbfs-alt2-half-no-blend.mp4', blend: 'fbfs-alt2-half-blend.mp4' }
                }
            },
            'quarter': {
                sourceFps: 60,
                outputFps: 60,
                speed: 0.25,
                label: '60fps source at 0.25x speed -> effective 15fps motion in 60fps output',
                body: 'At quarter speed, no-blend output holds each source frame for four outputs. Blending creates the strongest smoothness gain.',
                assets: {
                    set1: { noBlend: 'fbfs-quarter-no-blend.mp4', blend: 'fbfs-quarter-blend.mp4' },
                    set2: { noBlend: 'fbfs-alt2-quarter-no-blend.mp4', blend: 'fbfs-alt2-quarter-blend.mp4' }
                }
            }
        };

        var duration = 0;
        var isPlaying = false;
        var isScrubbing = false;
        var metaReady = { no: false, blend: false };
        var videoEnabled = { no: true, blend: true };
        var syncHandle = null;
        var PLAY_ICON = '&#9654;';
        var PAUSE_ICON = '&#10074;&#10074;';

        function currentOutputFps() {
            var scenario = scenarios[scenarioEl.value];
            return scenario ? scenario.outputFps : 60;
        }

        function getActiveVideo() {
            if (videoEnabled.no) return noBlendVideo;
            if (videoEnabled.blend) return blendVideo;
            return null;
        }

        function getEnabledVideos() {
            var list = [];
            if (videoEnabled.no) list.push(noBlendVideo);
            if (videoEnabled.blend) list.push(blendVideo);
            return list;
        }

        function refreshToggleButtons() {
            toggleNoEl.textContent = videoEnabled.no ? 'Mute' : 'Unmute';
            toggleBlendEl.textContent = videoEnabled.blend ? 'Mute' : 'Unmute';
            noPanelEl.classList.toggle('is-disabled', !videoEnabled.no);
            blendPanelEl.classList.toggle('is-disabled', !videoEnabled.blend);
        }

        function effectiveSourceFps(scenario) {
            return scenario.sourceFps * (scenario.speed || 1);
        }

        function clampTime(value) {
            if (!duration) return 0;
            return Math.max(0, Math.min(duration, value));
        }

        function setBothTimes(value) {
            var t = clampTime(value);
            noBlendVideo.currentTime = t;
            blendVideo.currentTime = t;
            updateTimeReadout(t);
            updateExplainer();
        }

        function toFrameNumber(seconds, totalFrames) {
            if (!isFinite(seconds) || totalFrames <= 0) return 0;
            var index = Math.floor(seconds * currentOutputFps()) + 1;
            return Math.max(1, Math.min(totalFrames, index));
        }

        function syncLoop() {
            if (!isPlaying) return;

            var activeVideo = getActiveVideo();
            if (!activeVideo) {
                pause();
                return;
            }

            if (videoEnabled.no && videoEnabled.blend) {
                var drift = Math.abs(noBlendVideo.currentTime - blendVideo.currentTime);
                if (drift > 0.025) {
                    blendVideo.currentTime = noBlendVideo.currentTime;
                }
            }

            updateTimeReadout(activeVideo.currentTime);
            updateExplainer();
            syncHandle = requestAnimationFrame(syncLoop);
        }

        function startSyncLoop() {
            if (syncHandle) cancelAnimationFrame(syncHandle);
            syncHandle = requestAnimationFrame(syncLoop);
        }

        function stopSyncLoop() {
            if (syncHandle) cancelAnimationFrame(syncHandle);
            syncHandle = null;
        }

        function play() {
            if (!duration) return;
            var enabledVideos = getEnabledVideos();
            if (!enabledVideos.length) {
                pause();
                return;
            }

            Promise.all(enabledVideos.map(function (video) { return video.play(); })).then(function () {
                isPlaying = true;
                playEl.innerHTML = PAUSE_ICON;
                playEl.setAttribute('aria-label', 'Pause');
                startSyncLoop();
            }).catch(function () {
                isPlaying = false;
                playEl.innerHTML = PLAY_ICON;
                playEl.setAttribute('aria-label', 'Play');
            });
        }

        function pause() {
            isPlaying = false;
            noBlendVideo.pause();
            blendVideo.pause();
            playEl.innerHTML = PLAY_ICON;
            playEl.setAttribute('aria-label', 'Play');
            stopSyncLoop();
        }

        function togglePlay() {
            if (isPlaying) {
                pause();
                return;
            }
            play();
        }

        function updateTimeReadout(currentTime) {
            var t = clampTime(currentTime || 0);
            var pct = duration > 0 ? t / duration : 0;
            if (!isScrubbing) {
                scrubEl.value = String(Math.round(pct * 1000));
            }
            var fps = currentOutputFps();
            var totalFrames = duration > 0 ? Math.max(1, Math.round(duration * fps)) : 0;
            var currentFrame = toFrameNumber(t, totalFrames);
            timeCurrentEl.textContent = String(currentFrame);
            timeTotalEl.textContent = String(totalFrames);
        }

        function updateExplainer() {
            var scenario = scenarios[scenarioEl.value];
            if (!scenario || !duration) {
                explainEl.textContent = 'Loading scenario videos...';
                return;
            }

            var outputFps = scenario.outputFps;
            var sourceFps = effectiveSourceFps(scenario);
            var cadence = (outputFps / sourceFps).toFixed(2);

            explainEl.innerHTML = '<strong>General difference:</strong> The left video holds/repeats source frames to match the output frame rate, which can create visible stepping or cadence judder. The right video blends neighboring source frames, producing smoother motion at the cost of slightly softer motion detail.' +
                ' <strong>Scenario cadence:</strong> ~' + cadence + ' output frames per source frame. ' + scenario.body;
        }

        function toggleVideo(which) {
            if (which === 'no') {
                videoEnabled.no = !videoEnabled.no;
                if (!videoEnabled.no) noBlendVideo.pause();
            } else {
                videoEnabled.blend = !videoEnabled.blend;
                if (!videoEnabled.blend) blendVideo.pause();
            }

            refreshToggleButtons();

            if (isPlaying) {
                if (!videoEnabled.no && !videoEnabled.blend) {
                    pause();
                    return;
                }
                play();
            }
        }

        function maybeReady() {
            if (!metaReady.no || !metaReady.blend) return;

            duration = Math.min(noBlendVideo.duration || 0, blendVideo.duration || 0);
            if (!isFinite(duration) || duration <= 0) {
                explainEl.textContent = 'Could not load scenario video duration.';
                return;
            }

            setBothTimes(0);
            infoEl.textContent = scenarios[scenarioEl.value].label;
            playEl.disabled = false;
            stepBackEl.disabled = false;
            stepForwardEl.disabled = false;
            resetEl.disabled = false;
            scrubEl.disabled = false;
            toggleNoEl.disabled = false;
            toggleBlendEl.disabled = false;
        }

        function loadScenario() {
            var scenario = scenarios[scenarioEl.value];
            if (!scenario) return;
            var sourceKey = sourceEl.value;
            var assets = scenario.assets[sourceKey] || scenario.assets.set1;

            pause();
            duration = 0;
            metaReady.no = false;
            metaReady.blend = false;

            playEl.disabled = true;
            stepBackEl.disabled = true;
            stepForwardEl.disabled = true;
            resetEl.disabled = true;
            scrubEl.disabled = true;
            toggleNoEl.disabled = true;
            toggleBlendEl.disabled = true;

            infoEl.textContent = scenario.label;
            explainEl.textContent = 'Loading videos...';
            timeCurrentEl.textContent = '0';
            timeTotalEl.textContent = '0';
            scrubEl.value = '0';

            noBlendVideo.src = ASSET_BASE + assets.noBlend;
            blendVideo.src = ASSET_BASE + assets.blend;
            noBlendVideo.load();
            blendVideo.load();
        }

        function stepFrames(direction) {
            if (!duration) return;
            pause();
            var activeVideo = getActiveVideo() || noBlendVideo;
            setBothTimes(activeVideo.currentTime + direction * (1 / 60));
        }

        playEl.addEventListener('click', togglePlay);

        stepBackEl.addEventListener('click', function () {
            stepFrames(-1);
        });

        stepForwardEl.addEventListener('click', function () {
            stepFrames(1);
        });

        resetEl.addEventListener('click', function () {
            pause();
            setBothTimes(0);
        });

        toggleNoEl.addEventListener('click', function () {
            toggleVideo('no');
        });

        toggleBlendEl.addEventListener('click', function () {
            toggleVideo('blend');
        });

        scrubEl.addEventListener('input', function () {
            if (!duration) return;
            isScrubbing = true;
            pause();
            var target = (Number(scrubEl.value) / 1000) * duration;
            setBothTimes(target);
        });

        scrubEl.addEventListener('change', function () {
            isScrubbing = false;
        });

        scenarioEl.addEventListener('change', loadScenario);
        sourceEl.addEventListener('change', loadScenario);

        noBlendVideo.addEventListener('loadedmetadata', function () {
            metaReady.no = true;
            maybeReady();
        });

        blendVideo.addEventListener('loadedmetadata', function () {
            metaReady.blend = true;
            maybeReady();
        });

        noBlendVideo.addEventListener('timeupdate', function () {
            if (!isPlaying || isScrubbing) return;
            var activeVideo = getActiveVideo();
            if (!activeVideo) return;
            updateTimeReadout(activeVideo.currentTime);
            updateExplainer();
        });

        blendVideo.addEventListener('timeupdate', function () {
            if (!isPlaying || isScrubbing) return;
            var activeVideo = getActiveVideo();
            if (!activeVideo) return;
            updateTimeReadout(activeVideo.currentTime);
            updateExplainer();
        });

        noBlendVideo.addEventListener('ended', pause);
        blendVideo.addEventListener('ended', pause);

        refreshToggleButtons();
        loadScenario();
    })();
</script>
