<div class="interactive-widget" id="asset-pipeline-widget">
    <canvas id="asset-pipeline-canvas" width="900" height="420"></canvas>

    <div class="widget-controls">
        <div class="controls-left">
            <button id="apf-play-btn" class="widget-btn primary">
                &#9654; Simulate
            </button>
            <button id="apf-reset-btn" class="widget-btn">
                Reset
            </button>
        </div>
        <div class="controls-right">
            <span class="state-label">State:</span>
            <span id="apf-state-badge" class="state-badge">Idle</span>
        </div>
    </div>

    <div class="widget-explainer">
        Click <strong>Simulate</strong> to watch a file travel through the four pipeline stages:
        <strong>Upload</strong>,
        <strong>Optimization</strong>, <strong>Storage</strong>, and <strong>Distribution</strong>. Hover over any stage
        for details.
    </div>
</div>

<style>
    /* Scoped styles for the widget to match Wiki theme */
    #asset-pipeline-widget {
        background: var(--bg-glass);
        border: 1px solid var(--border-subtle);
        border-radius: var(--border-radius-lg);
        padding: 24px;
        margin: 24px 0;
        box-shadow: 0 4px 6px var(--shadow-color);
        font-family: var(--font-family);
    }

    #asset-pipeline-canvas {
        width: 100%;
        height: auto;
        display: block;
        cursor: default;
        touch-action: none;
        background: rgba(0, 0, 0, 0.2);
        border-radius: var(--border-radius);
        margin-bottom: 20px;
        border: 1px solid var(--border-subtle);
    }

    .widget-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 16px;
    }

    .controls-left,
    .controls-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .widget-btn {
        padding: 8px 20px;
        border-radius: var(--border-radius);
        background: var(--input-bg);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        cursor: pointer;
        font-family: var(--font-family);
        font-size: 0.9rem;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .widget-btn:hover {
        background: var(--input-bg-hover);
        border-color: var(--accent-primary);
        transform: translateY(-1px);
    }

    .widget-btn:active {
        transform: translateY(0);
    }

    .widget-btn.primary {
        background: rgba(107, 37, 221, 0.2);
        border-color: var(--accent-primary);
        color: #fff;
    }

    .widget-btn.primary:hover {
        background: rgba(107, 37, 221, 0.3);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .state-label {
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .state-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        min-width: 80px;
        text-align: center;
        background: var(--input-bg);
        color: var(--text-muted);
        border: 1px solid var(--border-subtle);
        transition: all 0.3s ease;
    }

    .widget-explainer {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.6;
        padding-top: 16px;
        border-top: 1px solid var(--border-subtle);
    }

    .widget-explainer strong {
        color: var(--text-primary);
        font-weight: 600;
    }
</style>

<script>
    (function () {
        const canvas = document.getElementById('asset-pipeline-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // Get styles from CSS variables for consistency
        const computedStyle = getComputedStyle(document.body);
        const getVar = (name) => computedStyle.getPropertyValue(name).trim();

        const themeFonts = getVar('--font-family');
        const themeBg = getVar('--bg-primary'); // Fallback

        // High-DPI scaling
        const dpr = window.devicePixelRatio || 1;
        const W = canvas.width;
        const H = canvas.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.scale(dpr, dpr);

        const playBtn = document.getElementById('apf-play-btn');
        const resetBtn = document.getElementById('apf-reset-btn');
        const stateBadge = document.getElementById('apf-state-badge');

        // --- Stage definitions ---
        const stages = [
            {
                id: 'upload',
                label: 'Upload',
                icon: '\u2B06',
                color: '#60a5fa', // Blue
                desc: 'Source file is copied into\nthe Asset Manager',
                detail: 'State: Uploading\nFiles are organized automatically\nProgress is tracked in real time'
            },
            {
                id: 'optimize',
                label: 'Optimization',
                icon: '\u2699',
                color: '#a78bfa', // Purple
                desc: 'Converted to a GPU-optimized\nformat (HAP) for playback',
                detail: 'State: Optimizing\nConverts media for fast GPU playback\nDuplicate content is detected and reused'
            },
            {
                id: 'storage',
                label: 'Storage',
                icon: '\uD83D\uDCBE',
                color: '#34d399', // Green
                desc: 'Original and optimized files\nare saved to the asset database',
                detail: 'Asset database is updated safely\nOriginal source file is preserved\nShared data is deduplicated to save space'
            },
            {
                id: 'distribute',
                label: 'Distribution',
                icon: '\uD83C\uDF10',
                color: '#fb923c', // Orange
                desc: 'Optimized files are sent\nto all Display Computers',
                detail: 'Files transfer to each Display Computer\nMultiple transfers run in parallel\nThe show must be online to distribute'
            }
        ];

        // Layout constants
        const stageW = 160;
        const stageH = 120;
        const stageY = 140;
        const stageGap = 40;
        const totalStagesW = stages.length * stageW + (stages.length - 1) * stageGap;
        const startX = (W - totalStagesW) / 2;

        // Animation state
        let animPhase = -1;
        let animProgress = 0;
        let animRAF = null;
        let animStartTime = 0;
        let isRunning = false;
        let hoverStage = -1;

        // Runner nodes
        const runners = [
            { label: 'Runner 1', x: 0, y: 0 },
            { label: 'Runner 2', x: 0, y: 0 },
            { label: 'Runner 3', x: 0, y: 0 }
        ];

        function getStageRect(i) {
            const x = startX + i * (stageW + stageGap);
            return { x, y: stageY, w: stageW, h: stageH };
        }

        // --- Drawing ---

        function draw() {
            ctx.clearRect(0, 0, W, H); // Clear transparency
            // No background fill -> transparent to show CSS background

            // Grid (lighter)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const step = 30;
            for (let x = 0; x < W; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let y = 0; y < H; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }

            drawTitle();
            drawConnectors();
            drawStages();
            drawRunnerNodes();
            drawParticle();
            drawTooltip();
        }

        function drawTitle() {
            ctx.font = 'bold 14px ' + themeFonts;
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillText('ASSET PIPELINE', W / 2, 30);

            // Source file icon
            ctx.font = '22px ' + themeFonts;
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.fillText('\uD83D\uDCC1', startX - 40, stageY + stageH / 2 + 6);
            ctx.font = '9px ' + themeFonts;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fillText('Source File', startX - 40, stageY + stageH / 2 + 24);
        }

        function drawConnectors() {
            for (let i = 0; i < stages.length - 1; i++) {
                const r1 = getStageRect(i);
                const r2 = getStageRect(i + 1);
                const fromX = r1.x + r1.w;
                const toX = r2.x;
                const y = stageY + stageH / 2;

                const isActive = (animPhase > i) || (animPhase === i && animProgress > 0.8);
                const alpha = isActive ? 0.8 : 0.2;

                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(fromX + 4, y);
                ctx.lineTo(toX - 12, y);
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.moveTo(toX - 4, y);
                ctx.lineTo(toX - 14, y - 6);
                ctx.lineTo(toX - 14, y + 6);
                ctx.closePath();
                ctx.fill();

                if (animPhase === i && animProgress > 0.7) {
                    const dashProgress = (animProgress - 0.7) / 0.3;
                    const dx = toX - fromX;
                    const px = fromX + 4 + dx * dashProgress;
                    ctx.fillStyle = stages[i].color;
                    ctx.beginPath();
                    ctx.arc(px, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const r0 = getStageRect(0);
            const entryFromX = startX - 20;
            const entryToX = r0.x;
            const entryY = stageY + stageH / 2;
            const entryActive = animPhase >= 0;
            const entryAlpha = entryActive ? 0.7 : 0.2;

            ctx.strokeStyle = `rgba(255, 255, 255, ${entryAlpha})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(entryFromX, entryY);
            ctx.lineTo(entryToX - 8, entryY);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawStages() {
            for (let i = 0; i < stages.length; i++) {
                const stage = stages[i];
                const rect = getStageRect(i);
                const isActive = (animPhase === i);
                const isCompleted = (animPhase > i);
                const isHovered = (hoverStage === i);

                const boxAlpha = isActive ? 0.3 : isCompleted ? 0.2 : 0.08;
                const borderAlpha = isActive ? 0.9 : isCompleted ? 0.6 : isHovered ? 0.4 : 0.2;

                if (isActive) {
                    ctx.shadowColor = stage.color;
                    ctx.shadowBlur = 15;
                }

                roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 10);
                ctx.fillStyle = hexToRgba(stage.color, boxAlpha);
                ctx.fill();
                ctx.strokeStyle = hexToRgba(stage.color, borderAlpha);
                ctx.lineWidth = isActive ? 2 : 1;
                ctx.stroke();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                // Progress bar
                if (isActive) {
                    const barY = rect.y + rect.h - 8;
                    const barPad = 12;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    roundRect(ctx, rect.x + barPad, barY, rect.w - barPad * 2, 3, 2);
                    ctx.fill();
                    ctx.fillStyle = hexToRgba(stage.color, 0.8);
                    const fillW = (rect.w - barPad * 2) * animProgress;
                    if (fillW > 0) {
                        roundRect(ctx, rect.x + barPad, barY, fillW, 3, 2);
                        ctx.fill();
                    }
                }

                // Checkmark
                if (isCompleted) {
                    ctx.font = '14px ' + themeFonts;
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#22c55e';
                    ctx.fillText('\u2713', rect.x + rect.w - 8, rect.y + 18);
                }

                // Number
                ctx.font = 'bold 10px ' + themeFonts;
                ctx.textAlign = 'left';
                ctx.fillStyle = hexToRgba(stage.color, isActive || isCompleted ? 0.9 : 0.5);
                ctx.fillText((i + 1).toString(), rect.x + 10, rect.y + 16);

                // Icon
                ctx.font = '26px ' + themeFonts;
                ctx.textAlign = 'center';
                ctx.fillStyle = hexToRgba(stage.color, isActive ? 1 : isCompleted ? 0.85 : 0.6);
                ctx.fillText(stage.icon, rect.x + rect.w / 2, rect.y + 50);

                // Label
                ctx.font = 'bold 12px ' + themeFonts;
                ctx.textAlign = 'center';
                ctx.fillStyle = isActive || isCompleted ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.7)';
                ctx.fillText(stage.label, rect.x + rect.w / 2, rect.y + 72);

                // Description
                ctx.font = '10px ' + themeFonts;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                const descLines = stage.desc.split('\n');
                for (let l = 0; l < descLines.length; l++) {
                    ctx.fillText(descLines[l], rect.x + rect.w / 2, rect.y + 88 + l * 13);
                }
            }
        }

        function drawRunnerNodes() {
            const distRect = getStageRect(3);
            const runnerW = 80;
            const runnerH = 36;
            const runnerGap = 12;
            const totalRunnersW = runners.length * runnerW + (runners.length - 1) * runnerGap;
            const runnerStartX = distRect.x + (distRect.w - totalRunnersW) / 2;
            const runnerY = distRect.y + distRect.h + 50;

            const isDistActive = (animPhase === 3);
            const isDistDone = (animPhase > 3);

            for (let i = 0; i < runners.length; i++) {
                const rx = runnerStartX + i * (runnerW + runnerGap);
                const ry = runnerY;
                runners[i].x = rx + runnerW / 2;
                runners[i].y = ry + runnerH / 2;

                const fillProgress = isDistActive ? Math.max(0, Math.min(1, (animProgress - i * 0.15) / 0.6)) : (isDistDone ? 1 : 0);

                // Line
                const lineFromX = distRect.x + distRect.w / 2;
                const lineFromY = distRect.y + distRect.h;
                const lineToX = rx + runnerW / 2;
                const lineToY = ry;
                const lineAlpha = fillProgress > 0 ? 0.6 : 0.2;

                ctx.strokeStyle = `rgba(251, 146, 60, ${lineAlpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(lineFromX, lineFromY + 4);
                ctx.quadraticCurveTo(lineFromX, (lineFromY + lineToY) / 2, lineToX, lineToY - 2);
                ctx.stroke();

                // Dot
                if (isDistActive && fillProgress > 0 && fillProgress < 1) {
                    const t = fillProgress;
                    const cx = lineFromX + (lineToX - lineFromX) * t;
                    const bcy = (lineFromY + lineToY) / 2;
                    const cy = (1 - t) * (1 - t) * (lineFromY + 4) + 2 * (1 - t) * t * bcy + t * t * (lineToY - 2);
                    ctx.fillStyle = '#fb923c';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Runner Box
                const boxAlpha = fillProgress > 0 ? 0.25 : 0.1;
                const borderAlpha = fillProgress > 0 ? 0.6 : 0.2;

                ctx.fillStyle = `rgba(251, 146, 60, ${boxAlpha})`;
                roundRect(ctx, rx, ry, runnerW, runnerH, 6);
                ctx.fill();
                ctx.strokeStyle = `rgba(251, 146, 60, ${borderAlpha})`;
                ctx.stroke();

                // Progress Fill
                if (fillProgress > 0 && fillProgress < 1) {
                    ctx.save();
                    roundRect(ctx, rx, ry, runnerW, runnerH, 6);
                    ctx.clip();
                    ctx.fillStyle = 'rgba(251, 146, 60, 0.15)';
                    ctx.fillRect(rx, ry, runnerW * fillProgress, runnerH);
                    ctx.restore();
                }

                // Checkmark
                if (fillProgress >= 1) {
                    ctx.font = '11px ' + themeFonts;
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#22c55e';
                    ctx.fillText('\u2713', rx + runnerW - 5, ry + 14);
                }

                // Text
                ctx.font = '10px ' + themeFonts;
                ctx.textAlign = 'center';
                ctx.fillStyle = fillProgress > 0 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.5)';
                ctx.fillText(runners[i].label, rx + runnerW / 2, ry + runnerH / 2 + 4);
            }
        }

        function drawParticle() {
            if (animPhase < 0 || animPhase > 3) return;

            const rect = getStageRect(animPhase);
            const cx = rect.x + rect.w / 2;
            const cy = rect.y - 20;
            const pulse = Math.sin(performance.now() * 0.005) * 0.3 + 0.7;
            const stage = stages[animPhase];

            ctx.beginPath();
            ctx.arc(cx, cy, 6 * pulse, 0, Math.PI * 2);
            ctx.fillStyle = hexToRgba(stage.color, 0.6 * pulse);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fillStyle = stage.color;
            ctx.fill();
        }

        function drawTooltip() {
            if (hoverStage < 0 || hoverStage >= stages.length) return;

            const stage = stages[hoverStage];
            const rect = getStageRect(hoverStage);
            const lines = stage.detail.split('\n');
            const lineH = 16;
            const padX = 14;
            const padY = 10;
            const tipW = 220;
            const tipH = padY * 2 + lines.length * lineH;

            let tipX = rect.x + rect.w / 2 - tipW / 2;
            let tipY = rect.y - tipH - 16;

            if (tipX < 8) tipX = 8;
            if (tipX + tipW > W - 8) tipX = W - 8 - tipW;
            if (tipY < 8) tipY = rect.y + rect.h + 12;

            // Tooltip Background (Glass)
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = hexToRgba(stage.color, 0.4);
            ctx.lineWidth = 1;

            roundRect(ctx, tipX, tipY, tipW, tipH, 8);
            ctx.fill();
            ctx.stroke();

            // Text
            ctx.font = '11px ' + themeFonts;
            ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            for (let l = 0; l < lines.length; l++) {
                ctx.fillText(lines[l], tipX + padX, tipY + padY + 12 + l * lineH);
            }
        }

        // --- Helpers ---

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function updateStateBadge(text, color) {
            stateBadge.textContent = text;
            stateBadge.style.background = 'var(--input-bg)';
            stateBadge.style.color = 'var(--text-muted)';
            stateBadge.style.borderColor = 'var(--border-subtle)';

            if (color === 'green') {
                stateBadge.style.background = 'rgba(34, 197, 94, 0.2)';
                stateBadge.style.color = '#22c55e';
                stateBadge.style.borderColor = 'rgba(34, 197, 94, 0.3)';
            } else if (color === 'blue') {
                stateBadge.style.background = 'rgba(96, 165, 250, 0.2)';
                stateBadge.style.color = '#60a5fa';
                stateBadge.style.borderColor = 'rgba(96, 165, 250, 0.3)';
            } else if (color === 'purple') {
                stateBadge.style.background = 'rgba(167, 139, 250, 0.2)';
                stateBadge.style.color = '#a78bfa';
                stateBadge.style.borderColor = 'rgba(167, 139, 250, 0.3)';
            } else if (color === 'orange') {
                stateBadge.style.background = 'rgba(251, 146, 60, 0.2)';
                stateBadge.style.color = '#fb923c';
                stateBadge.style.borderColor = 'rgba(251, 146, 60, 0.3)';
            }
        }

        // --- Animation ---
        const phaseDurations = [1.8, 3.0, 1.5, 2.5];

        function startSimulation() {
            if (isRunning) return;
            isRunning = true;
            animPhase = 0;
            animProgress = 0;
            animStartTime = performance.now();
            updateStateBadge('Uploading', 'blue');
            tick();
        }

        function resetSimulation() {
            isRunning = false;
            animPhase = -1;
            animProgress = 0;
            if (animRAF) {
                cancelAnimationFrame(animRAF);
                animRAF = null;
            }
            updateStateBadge('Idle', 'default');
            draw();
        }

        function tick() {
            if (!isRunning) return;
            const now = performance.now();
            const elapsed = (now - animStartTime) / 1000;
            const phaseDur = phaseDurations[animPhase] || 2;
            animProgress = Math.min(1, elapsed / phaseDur);

            draw();

            if (animProgress >= 1) {
                animPhase++;
                animProgress = 0;
                animStartTime = performance.now();

                if (animPhase >= stages.length) {
                    animPhase = stages.length;
                    isRunning = false;
                    updateStateBadge('Complete', 'green');
                    draw();
                    return;
                }
                const stateNames = ['Uploading', 'Optimizing', 'Storing', 'Distributing'];
                const stateColors = ['blue', 'purple', 'green', 'orange'];
                updateStateBadge(stateNames[animPhase], stateColors[animPhase]);
            }
            animRAF = requestAnimationFrame(tick);
        }

        // --- Interaction ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function findHoverStage(mx, my) {
            for (let i = 0; i < stages.length; i++) {
                const r = getStageRect(i);
                if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
            }
            return -1;
        }

        canvas.addEventListener('pointermove', (e) => {
            const { x, y } = getCanvasCoords(e);
            const prev = hoverStage;
            hoverStage = findHoverStage(x, y);
            canvas.style.cursor = hoverStage >= 0 ? 'pointer' : 'default';
            if (hoverStage !== prev) draw();
        });

        canvas.addEventListener('pointerleave', () => {
            hoverStage = -1;
            draw();
        });

        canvas.addEventListener('pointerdown', (e) => {
            const { x, y } = getCanvasCoords(e);
            const clicked = findHoverStage(x, y);
            if (clicked >= 0 && !isRunning) {
                animPhase = clicked;
                animProgress = 0.5;
                const stateNames = ['Uploading', 'Optimizing', 'Storing', 'Distributing'];
                const stateColors = ['blue', 'purple', 'green', 'orange'];
                updateStateBadge(stateNames[clicked], stateColors[clicked]);
                draw();
            }
        });

        playBtn.addEventListener('click', () => {
            resetSimulation();
            setTimeout(() => startSimulation(), 100);
        });
        resetBtn.addEventListener('click', () => resetSimulation());

        draw();
    })();
</script>
