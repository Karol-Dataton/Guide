    <div class="tev-top-controls">

<script>
(function() {
    // ========================================================================
    // Expression Parser - safe recursive-descent, no eval()
    // ========================================================================

    function tokenize(expr) {
        var tokens = [];
        var i = 0;
        var s = expr.trim();
        while (i < s.length) {
            var ch = s[i];
            if (ch === ' ' || ch === '\t') { i++; continue; }
            if ((ch >= '0' && ch <= '9') || (ch === '.' && i + 1 < s.length && s[i + 1] >= '0' && s[i + 1] <= '9')) {
                var start = i;
                while (i < s.length && ((s[i] >= '0' && s[i] <= '9') || s[i] === '.')) i++;
                tokens.push({ type: 'num', value: parseFloat(s.substring(start, i)) });
                continue;
            }
            if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || ch === '_') {
                var start = i;
                while (i < s.length && ((s[i] >= 'a' && s[i] <= 'z') || (s[i] >= 'A' && s[i] <= 'Z') || (s[i] >= '0' && s[i] <= '9') || s[i] === '_')) i++;
                tokens.push({ type: 'id', value: s.substring(start, i) });
                continue;
            }
            if (i + 1 < s.length) {
                var two = s.substring(i, i + 2);
                if (two === '<=' || two === '>=' || two === '==' || two === '!=') {
                    tokens.push({ type: 'op', value: two }); i += 2; continue;
                }
            }
            if ('+-*/%^<>(),'.indexOf(ch) >= 0) {
                tokens.push({ type: 'op', value: ch }); i++; continue;
            }
            throw new Error('Unexpected character: "' + ch + '"');
        }
        tokens.push({ type: 'end' });
        return tokens;
    }

    var MATH_FUNCS = {
        'sin': Math.sin, 'cos': Math.cos, 'tan': Math.tan,
        'asin': Math.asin, 'acos': Math.acos, 'atan': Math.atan,
        'sqrt': Math.sqrt, 'abs': Math.abs,
        'log': Math.log, 'log10': Math.log10,
        'ceil': Math.ceil, 'floor': Math.floor, 'round': Math.round
    };
    var MULTI_ARG_FUNCS = { 'min': Math.min, 'max': Math.max };
    var CONSTANTS = { 'pi': Math.PI, 'e': Math.E };

    function parse(expr) {
        var tokens = tokenize(expr);
        var pos = 0;

        function peek() { return tokens[pos]; }
        function expect(val) {
            var t = tokens[pos];
            if (t.type !== 'op' || t.value !== val) throw new Error('Expected "' + val + '"');
            pos++;
            return t;
        }

        function parseExpr() { return parseOr(); }

        function parseOr() {
            var left = parseAnd();
            while (peek().type === 'id' && peek().value.toLowerCase() === 'or') {
                pos++;
                var right = parseAnd();
                left = (function(l, r) { return function(v) { return (l(v) ? 1 : 0) || (r(v) ? 1 : 0) ? 1 : 0; }; })(left, right);
            }
            return left;
        }

        function parseAnd() {
            var left = parseCmp();
            while (peek().type === 'id' && peek().value.toLowerCase() === 'and') {
                pos++;
                var right = parseCmp();
                left = (function(l, r) { return function(v) { return (l(v) ? 1 : 0) && (r(v) ? 1 : 0) ? 1 : 0; }; })(left, right);
            }
            return left;
        }

        function parseCmp() {
            var left = parseAdd();
            var t = peek();
            if (t.type === 'op' && (t.value === '<' || t.value === '>' || t.value === '<=' || t.value === '>=' || t.value === '==' || t.value === '!=')) {
                var op = t.value; pos++;
                var right = parseAdd();
                return (function(l, r, o) {
                    return function(v) {
                        var a = l(v), b = r(v);
                        switch (o) {
                            case '<':  return a < b ? 1 : 0;
                            case '>':  return a > b ? 1 : 0;
                            case '<=': return a <= b ? 1 : 0;
                            case '>=': return a >= b ? 1 : 0;
                            case '==': return a === b ? 1 : 0;
                            case '!=': return a !== b ? 1 : 0;
                        }
                        return 0;
                    };
                })(left, right, op);
            }
            return left;
        }

        function parseAdd() {
            var left = parseMul();
            while (peek().type === 'op' && (peek().value === '+' || peek().value === '-')) {
                var op = peek().value; pos++;
                var right = parseMul();
                left = (function(l, r, o) {
                    return function(v) { return o === '+' ? l(v) + r(v) : l(v) - r(v); };
                })(left, right, op);
            }
            return left;
        }

        function parseMul() {
            var left = parsePow();
            while (peek().type === 'op' && (peek().value === '*' || peek().value === '/' || peek().value === '%')) {
                var op = peek().value; pos++;
                var right = parsePow();
                left = (function(l, r, o) {
                    return function(v) {
                        if (o === '*') return l(v) * r(v);
                        if (o === '/') { var d = r(v); return d === 0 ? 0 : l(v) / d; }
                        return l(v) % r(v);
                    };
                })(left, right, op);
            }
            return left;
        }

        function parsePow() {
            var base = parseUnary();
            if (peek().type === 'op' && peek().value === '^') {
                pos++;
                var exp = parsePow();
                return (function(b, e) {
                    return function(v) { return Math.pow(b(v), e(v)); };
                })(base, exp);
            }
            return base;
        }

        function parseUnary() {
            var t = peek();
            if (t.type === 'op' && t.value === '-') {
                pos++;
                var inner = parseUnary();
                return function(v) { return -inner(v); };
            }
            if (t.type === 'id' && t.value.toLowerCase() === 'not') {
                pos++;
                var inner = parseUnary();
                return function(v) { return inner(v) ? 0 : 1; };
            }
            return parsePrimary();
        }

        function parsePrimary() {
            var t = peek();

            if (t.type === 'num') {
                pos++;
                var val = t.value;
                return function() { return val; };
            }

            if (t.type === 'op' && t.value === '(') {
                pos++;
                var inner = parseExpr();
                expect(')');
                return inner;
            }

            if (t.type === 'id') {
                var name = t.value;
                var nameLower = name.toLowerCase();
                pos++;

                if (nameLower === 'if') {
                    expect('(');
                    var cond = parseExpr();
                    expect(',');
                    var thenVal = parseExpr();
                    expect(',');
                    var elseVal = parseExpr();
                    expect(')');
                    return function(v) { return cond(v) ? thenVal(v) : elseVal(v); };
                }

                if (MATH_FUNCS[nameLower]) {
                    var fn = MATH_FUNCS[nameLower];
                    expect('(');
                    var arg = parseExpr();
                    expect(')');
                    return (function(fn, arg) {
                        return function(v) { return fn(arg(v)); };
                    })(fn, arg);
                }

                if (MULTI_ARG_FUNCS[nameLower]) {
                    var fn = MULTI_ARG_FUNCS[nameLower];
                    expect('(');
                    var args = [parseExpr()];
                    while (peek().type === 'op' && peek().value === ',') {
                        pos++;
                        args.push(parseExpr());
                    }
                    expect(')');
                    return (function(fn, args) {
                        return function(v) {
                            var vals = [];
                            for (var i = 0; i < args.length; i++) vals.push(args[i](v));
                            return fn.apply(null, vals);
                        };
                    })(fn, args);
                }

                if (CONSTANTS[nameLower] !== undefined) {
                    var cv = CONSTANTS[nameLower];
                    return function() { return cv; };
                }

                if (nameLower === 'tweenvalue') {
                    return function(v) { return v.tweenValue; };
                }
                if (nameLower === 'myvariable') {
                    return function(v) { return v.myVariable; };
                }

                throw new Error('Unknown identifier: "' + name + '"');
            }

            throw new Error('Unexpected token');
        }

        var evaluator = parseExpr();
        if (peek().type !== 'end') throw new Error('Unexpected input after expression');
        return evaluator;
    }

    // ========================================================================
    // DOM References
    // ========================================================================

    var canvas = document.getElementById('tev-canvas');
    var ctx = canvas.getContext('2d');
    var presetSelect = document.getElementById('tev-presets');
    var exprInput = document.getElementById('tev-expr');
    var errorEl = document.getElementById('tev-error');
    var tweenSlider = document.getElementById('tev-tween-slider');
    var tweenValEl = document.getElementById('tev-tween-val');
    var varSlider = document.getElementById('tev-var-slider');
    var varValEl = document.getElementById('tev-var-val');
    var playBtn = document.getElementById('tev-play');
    var resetBtn = document.getElementById('tev-reset');
    var explainerEl = document.getElementById('tev-explainer');
    var previewImg = document.getElementById('tev-preview-img');
    var previewReadout = document.getElementById('tev-preview-readout');

    // ========================================================================
    // State
    // ========================================================================

    var currentEvaluator = null;
    var tweenValue = 100;   // fixed keyframe value set by user
    var myVariable = 75;    // the variable that changes (external input)
    var playing = false;
    var animFrame = null;
    var lastTime = 0;
    var animT = 0;          // 0..1 animation progress for myVariable sweep
    var hasError = false;

    // ========================================================================
    // Expression compilation and evaluation
    // ========================================================================

    function compileExpr(str) {
        try {
            currentEvaluator = parse(str);
            errorEl.textContent = '';
            exprInput.classList.remove('tev-error');
            hasError = false;
        } catch (e) {
            errorEl.textContent = e.message;
            exprInput.classList.add('tev-error');
            hasError = true;
            currentEvaluator = null;
        }
    }

    function evalExpr(tv, mv) {
        if (!currentEvaluator) return tv;
        try {
            var result = currentEvaluator({ tweenValue: tv, myVariable: mv });
            if (typeof result !== 'number' || !isFinite(result)) return tv;
            return result;
        } catch (e) {
            return tv;
        }
    }

    // ========================================================================
    // Preview Panel
    // ========================================================================

    function updatePreview() {
        var ev = evalExpr(tweenValue, myVariable);
        var opacityPct = Math.max(0, Math.min(100, ev));
        previewImg.style.opacity = opacityPct / 100;
        previewReadout.innerHTML = 'Opacity: <strong>' + Math.round(opacityPct) + '%</strong>';
    }

    // ========================================================================
    // Canvas Drawing
    // ========================================================================

    var PAD_L = 52, PAD_R = 20, PAD_T = 24, PAD_B = 38;

    function resizeCanvas() {
        var rect = canvas.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function niceStep(range, maxTicks) {
        var rough = range / maxTicks;
        var mag = Math.pow(10, Math.floor(Math.log10(rough)));
        var frac = rough / mag;
        var nice;
        if (frac <= 1.5) nice = 1;
        else if (frac <= 3) nice = 2;
        else if (frac <= 7) nice = 5;
        else nice = 10;
        return nice * mag;
    }

    function draw() {
        var w = canvas.getBoundingClientRect().width;
        var h = canvas.getBoundingClientRect().height;
        var gx = PAD_L, gy = PAD_T;
        var gw = w - PAD_L - PAD_R;
        var gh = h - PAD_T - PAD_B;

        ctx.clearRect(0, 0, w, h);

        // The graph: X axis = myVariable (0..100), Y axis = expression result
        // We also draw a horizontal reference for tweenValue

        var N = 200;
        var exprVals = new Array(N + 1);
        for (var i = 0; i <= N; i++) {
            var mv = (i / N) * 100;
            exprVals[i] = evalExpr(tweenValue, mv);
        }

        // Auto-scale Y axis
        var minV = tweenValue, maxV = tweenValue;
        if (!hasError) {
            for (var i = 0; i <= N; i++) {
                if (exprVals[i] < minV) minV = exprVals[i];
                if (exprVals[i] > maxV) maxV = exprVals[i];
            }
        }
        // Include 0 and 100 in range for context since we deal with percentages
        if (minV > 0) minV = 0;
        if (maxV < 100) maxV = 100;
        var range = maxV - minV;
        if (range < 1) { minV = -5; maxV = 105; range = 110; }
        var pad = range * 0.08;
        minV -= pad; maxV += pad;

        function valToY(v) { return gy + gh - (v - minV) / (maxV - minV) * gh; }
        function mvToX(mv) { return gx + (mv / 100) * gw; }

        // -- Grid lines --
        ctx.lineWidth = 1;
        var step = niceStep(maxV - minV, 5);
        var gridStart = Math.ceil(minV / step) * step;

        ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textBaseline = 'middle';

        // Horizontal grid
        ctx.textAlign = 'right';
        for (var v = gridStart; v <= maxV; v += step) {
            var yy = valToY(v);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + gw, yy); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText(Math.round(v * 10) / 10, gx - 7, yy);
        }

        // Vertical grid
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (var p = 0; p <= 100; p += 25) {
            var xx = mvToX(p);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.beginPath(); ctx.moveTo(xx, gy); ctx.lineTo(xx, gy + gh); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText(p, xx, gy + gh + 6);
        }

        // -- tweenValue horizontal reference (blue dashed) --
        ctx.save();
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(gx, valToY(tweenValue));
        ctx.lineTo(gx + gw, valToY(tweenValue));
        ctx.stroke();
        ctx.restore();

        // tweenValue label
        ctx.font = '10px "SF Mono", "Fira Code", monospace';
        ctx.fillStyle = 'rgba(96, 165, 250, 0.6)';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText('tweenValue = ' + tweenValue, gx + gw, valToY(tweenValue) - 4);

        // -- Expression result curve (purple solid) --
        if (!hasError) {
            ctx.strokeStyle = '#a78bfa';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (var i = 0; i <= N; i++) {
                var x = mvToX((i / N) * 100);
                var y = valToY(exprVals[i]);
                var cy = Math.max(gy - 5, Math.min(gy + gh + 5, y));
                if (i === 0) ctx.moveTo(x, cy); else ctx.lineTo(x, cy);
            }
            ctx.stroke();
        }

        // -- Current myVariable marker (vertical line + dot) --
        var curX = mvToX(myVariable);
        var curResult = evalExpr(tweenValue, myVariable);

        // Vertical marker line
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(curX, gy);
        ctx.lineTo(curX, gy + gh);
        ctx.stroke();

        // Dot on expression curve at current myVariable
        if (!hasError) {
            var dotY = Math.max(gy - 5, Math.min(gy + gh + 5, valToY(curResult)));
            ctx.beginPath();
            ctx.arc(curX, dotY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#a78bfa';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // Value readout at top
        ctx.font = '11px "SF Mono", "Fira Code", monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        var readout = 'myVariable: ' + myVariable + '    tweenValue: ' + tweenValue;
        if (!hasError) readout += '    result: ' + curResult.toFixed(1);
        ctx.fillText(readout, gx + 4, gy - 5);

        // -- Axes --
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx, gy + gh);
        ctx.lineTo(gx + gw, gy + gh);
        ctx.stroke();

        // Axis labels
        ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('myVariable', gx + gw / 2, gy + gh + 22);

        ctx.save();
        ctx.translate(13, gy + gh / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('Expression Result', 0, 0);
        ctx.restore();

        // Update preview
        updatePreview();
    }

    // ========================================================================
    // Animation Loop - sweeps myVariable from 0 to 100
    // ========================================================================

    function animLoop(ts) {
        if (!playing) return;
        if (lastTime === 0) lastTime = ts;
        var dt = (ts - lastTime) / 1000;
        lastTime = ts;
        animT += dt / 3; // 3-second sweep
        if (animT >= 1) { animT = 0; }

        // Update myVariable from animation
        myVariable = Math.round(animT * 100);
        varSlider.value = myVariable;
        varValEl.textContent = myVariable;

        draw();
        animFrame = requestAnimationFrame(animLoop);
    }

    function startAnim() {
        playing = true;
        lastTime = 0;
        playBtn.innerHTML = '&#9646;&#9646;';
        playBtn.classList.add('tev-active');
        animFrame = requestAnimationFrame(animLoop);
    }

    function stopAnim() {
        playing = false;
        playBtn.innerHTML = '&#9654;';
        playBtn.classList.remove('tev-active');
        if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    }

    // ========================================================================
    // Preset Descriptions
    // ========================================================================

    var descriptions = {
        'tweenValue': 'The expression ignores <code>myVariable</code> and passes the keyframe value through unmodified. The result is constant regardless of external input.',
        'tweenValue * 2': 'Doubles the keyframed value regardless of <code>myVariable</code>. The result is a constant 200 when <code>tweenValue</code> is 100.',
        'tweenValue + 10': 'Adds a constant offset of 10. The result is always 10 above the keyframe value, unaffected by the variable.',
        '100 - tweenValue': 'Inverts the keyframe value. At <code>tweenValue = 100</code>, the result is 0. Not variable-driven.',
        'tweenValue * myVariable / 100': 'Scales the keyframed value by an external variable. At <code>myVariable = 100</code>, full output. At <code>0</code>, the cue is invisible. This is a common pattern for master dimming via OSC or ArtNet. Press play to simulate an incoming fader.',
        'sin(myVariable * pi / 50) * 50 + 50': 'Drives the output with a sinusoidal function of <code>myVariable</code>. As an OSC fader sweeps 0&rarr;100, the result oscillates. Press play to see the wave.',
        'if(myVariable > 50, tweenValue, 0)': 'A gate: the cue is visible only when <code>myVariable</code> exceeds 50 (e.g., a trigger threshold from a sensor). Below 50, the output is 0.',
        'max(tweenValue, myVariable)': 'Output is whichever is larger. When <code>myVariable</code> is below <code>tweenValue</code>, the keyframe wins. Above it, the variable takes over.',
        'myVariable ^ 2 / 100': 'Squares the variable input (normalized). This creates a non-linear response curve &mdash; useful for perceptually even fader control.',
        'myVariable': 'Completely replaces the keyframe value with direct external control. The tween\'s keyframes are ignored. Common for fully variable-driven properties.',
        'custom': 'Type any expression using <code>tweenValue</code>, <code>myVariable</code>, arithmetic operators, and math functions like <code>sin()</code>, <code>if()</code>, <code>max()</code>.'
    };

    function updateExplainer(key) {
        explainerEl.innerHTML = descriptions[key] || descriptions['custom'];
    }

    // ========================================================================
    // Event Handlers
    // ========================================================================

    presetSelect.addEventListener('change', function() {
        var val = presetSelect.value;
        if (val !== 'custom') {
            exprInput.value = val;
            compileExpr(val);
            updateExplainer(val);
        } else {
            exprInput.value = '';
            exprInput.focus();
            updateExplainer('custom');
            compileExpr('tweenValue');
        }
        if (!playing) draw();
    });

    exprInput.addEventListener('input', function() {
        var val = exprInput.value.trim();
        var matched = false;
        for (var i = 0; i < presetSelect.options.length; i++) {
            if (presetSelect.options[i].value === val) {
                presetSelect.value = val;
                updateExplainer(val);
                matched = true;
                break;
            }
        }
        if (!matched) {
            presetSelect.value = 'custom';
            updateExplainer('custom');
        }
        compileExpr(val || 'tweenValue');
        if (!playing) draw();
    });

    tweenSlider.addEventListener('input', function() {
        tweenValue = parseInt(tweenSlider.value, 10);
        tweenValEl.textContent = tweenValue;
        if (!playing) draw();
    });

    varSlider.addEventListener('input', function() {
        myVariable = parseInt(varSlider.value, 10);
        varValEl.textContent = myVariable;
        // If user manually drags during animation, stop animation
        if (playing) stopAnim();
        draw();
    });

    playBtn.addEventListener('click', function() {
        if (playing) {
            stopAnim();
        } else {
            animT = 0;
            startAnim();
        }
    });

    resetBtn.addEventListener('click', function() {
        stopAnim();
        myVariable = 0;
        varSlider.value = 0;
        varValEl.textContent = '0';
        animT = 0;
        draw();
    });

    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() { resizeCanvas(); draw(); }, 100);
    });

    // ========================================================================
    // Init
    // ========================================================================

    compileExpr('tweenValue * myVariable / 100');
    updateExplainer('tweenValue * myVariable / 100');
    resizeCanvas();
    draw();
})();
</script>
