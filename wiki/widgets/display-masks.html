<div class="interactive-widget" id="display-masks-widget">
    <div class="widget-controls"
        style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;">
        <div class="control-group" style="display: flex; align-items: center; gap: 8px;">
            <label style="font-weight: 500; white-space: nowrap;">Mask Preset</label>
            <select id="mask-preset-select"
                style="padding: 6px 10px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); font-family: var(--font-family);">
                <option value="none">None</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
                <option value="rect" selected>Rectangular</option>
                <option value="round">Round</option>
            </select>
        </div>

        <div class="control-group" style="display: flex; align-items: center; gap: 8px;">
            <label style="font-weight: 500; white-space: nowrap;">Gamma</label>
            <input type="range" id="mask-gamma-slider" min="0.3" max="2.5" step="0.05" value="1.0"
                style="width: 100px; accent-color: var(--accent-primary);">
            <span id="mask-gamma-value"
                style="font-size: 0.85rem; color: var(--text-secondary); min-width: 30px;">1.0</span>
        </div>

        <div class="control-group" style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button id="mask-reset" class="warp-btn"
                style="padding: 6px 12px; border-radius: 6px; background: var(--accent-primary); border: 1px solid transparent; color: #fff; cursor: pointer; font-family: var(--font-family); font-size: 0.85rem; font-weight: 600; transition: all 150ms ease;">Reset</button>
        </div>
    </div>

    <div
        style="position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--bg-tertiary);">
        <canvas id="mask-canvas" width="700" height="500"
            style="width: 100%; height: auto; display: block; cursor: crosshair; touch-action: none;"></canvas>
    </div>

    <div
        style="margin-top: 12px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-secondary);">
        <span style="display: flex; align-items: center; gap: 6px;">
            <span
                style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #22c55e;"></span>
            α=0 (visible)
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            <span
                style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #f59e0b;"></span>
            α=0.5 (feathered)
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            <span
                style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ef4444;"></span>
            α=1 (hidden)
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            Drag to move · Click to cycle alpha
        </span>
    </div>
</div>

<script>
    (function () {
        const canvas = document.getElementById('mask-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const presetSelect = document.getElementById('mask-preset-select');
        const gammaSlider = document.getElementById('mask-gamma-slider');
        const gammaValue = document.getElementById('mask-gamma-value');
        const btnReset = document.getElementById('mask-reset');

        const W = canvas.width;
        const H = canvas.height;

        let gridRows = 4;
        let gridCols = 5;
        let junctions = []; // flat array of {x, y, alpha}
        let gamma = 1.0;
        let dragIndex = -1;
        let hoverIndex = -1;
        let pointerDownTime = 0;
        let pointerMoved = false;

        // --- Test pattern background (cached) ---
        let patternCanvas = null;

        function createTestPattern() {
            patternCanvas = document.createElement('canvas');
            patternCanvas.width = W;
            patternCanvas.height = H;
            const pctx = patternCanvas.getContext('2d');

            // Gradient background
            const grad = pctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#1e3a5f');
            grad.addColorStop(0.5, '#2d1b69');
            grad.addColorStop(1, '#1a1a2e');
            pctx.fillStyle = grad;
            pctx.fillRect(0, 0, W, H);

            // Checkerboard overlay
            const cols = 14;
            const rows = 10;
            const cw = W / cols;
            const ch = H / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if ((r + c) % 2 === 0) {
                        pctx.fillStyle = 'rgba(255,255,255,0.06)';
                        pctx.fillRect(c * cw, r * ch, cw, ch);
                    }
                }
            }

            // Cross lines
            pctx.strokeStyle = 'rgba(99, 102, 241, 0.25)';
            pctx.lineWidth = 1;
            pctx.beginPath();
            pctx.moveTo(0, H / 2); pctx.lineTo(W, H / 2);
            pctx.moveTo(W / 2, 0); pctx.lineTo(W / 2, H);
            pctx.stroke();

            // Diagonal
            pctx.strokeStyle = 'rgba(239, 68, 68, 0.15)';
            pctx.beginPath();
            pctx.moveTo(0, 0); pctx.lineTo(W, H);
            pctx.moveTo(W, 0); pctx.lineTo(0, H);
            pctx.stroke();

            // Some colored rectangles to represent "content"
            pctx.fillStyle = 'rgba(99, 102, 241, 0.3)';
            pctx.fillRect(W * 0.15, H * 0.2, W * 0.25, H * 0.3);
            pctx.fillStyle = 'rgba(236, 72, 153, 0.25)';
            pctx.fillRect(W * 0.55, H * 0.35, W * 0.3, H * 0.35);
            pctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
            pctx.fillRect(W * 0.3, H * 0.6, W * 0.2, H * 0.25);

            // "CONTENT" text
            pctx.font = 'bold 48px -apple-system, sans-serif';
            pctx.textAlign = 'center';
            pctx.textBaseline = 'middle';
            pctx.fillStyle = 'rgba(255,255,255,0.12)';
            pctx.fillText('DISPLAY OUTPUT', W / 2, H / 2);
        }

        // --- Grid management ---
        function initGrid(rows, cols) {
            gridRows = rows;
            gridCols = cols;
            junctions = [];
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const x = (c / (gridCols - 1)) * W;
                    const y = (r / (gridRows - 1)) * H;
                    junctions.push({ x, y, alpha: 0 });
                }
            }
        }

        // --- Presets ---
        function applyPreset(name) {
            switch (name) {
                case 'none':
                    initGrid(4, 5);
                    break;
                case 'left':
                    initGrid(3, 5);
                    for (let r = 0; r < gridRows; r++) {
                        junctions[r * gridCols + 0].alpha = 1;
                        junctions[r * gridCols + 1].alpha = 0.7;
                        junctions[r * gridCols + 2].alpha = 0;
                        junctions[r * gridCols + 3].alpha = 0;
                        junctions[r * gridCols + 4].alpha = 0;
                    }
                    break;
                case 'right':
                    initGrid(3, 5);
                    for (let r = 0; r < gridRows; r++) {
                        junctions[r * gridCols + 0].alpha = 0;
                        junctions[r * gridCols + 1].alpha = 0;
                        junctions[r * gridCols + 2].alpha = 0;
                        junctions[r * gridCols + 3].alpha = 0.7;
                        junctions[r * gridCols + 4].alpha = 1;
                    }
                    break;
                case 'top':
                    initGrid(5, 3);
                    for (let c = 0; c < gridCols; c++) {
                        junctions[0 * gridCols + c].alpha = 1;
                        junctions[1 * gridCols + c].alpha = 0.7;
                        junctions[2 * gridCols + c].alpha = 0;
                        junctions[3 * gridCols + c].alpha = 0;
                        junctions[4 * gridCols + c].alpha = 0;
                    }
                    break;
                case 'bottom':
                    initGrid(5, 3);
                    for (let c = 0; c < gridCols; c++) {
                        junctions[0 * gridCols + c].alpha = 0;
                        junctions[1 * gridCols + c].alpha = 0;
                        junctions[2 * gridCols + c].alpha = 0;
                        junctions[3 * gridCols + c].alpha = 0.7;
                        junctions[4 * gridCols + c].alpha = 1;
                    }
                    break;
                case 'rect':
                    initGrid(4, 5);
                    // Outer edges α=1, middle ring α=0.5, center α=0
                    for (let r = 0; r < gridRows; r++) {
                        for (let c = 0; c < gridCols; c++) {
                            const isEdgeR = (r === 0 || r === gridRows - 1);
                            const isEdgeC = (c === 0 || c === gridCols - 1);
                            const isInnerR = (r === 1 || r === gridRows - 2);
                            const isInnerC = (c === 1 || c === gridCols - 2);
                            if (isEdgeR || isEdgeC) {
                                junctions[r * gridCols + c].alpha = 1;
                            } else if (isInnerR || isInnerC) {
                                junctions[r * gridCols + c].alpha = 0.4;
                            } else {
                                junctions[r * gridCols + c].alpha = 0;
                            }
                        }
                    }
                    break;
                case 'round':
                    initGrid(5, 6);
                    // Elliptical alpha based on distance from center
                    const cx = W / 2;
                    const cy = H / 2;
                    const rx = W * 0.38;
                    const ry = H * 0.38;
                    for (let r = 0; r < gridRows; r++) {
                        for (let c = 0; c < gridCols; c++) {
                            const j = junctions[r * gridCols + c];
                            const dx = (j.x - cx) / rx;
                            const dy = (j.y - cy) / ry;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 0.7) {
                                j.alpha = 0;
                            } else if (dist < 1.0) {
                                j.alpha = (dist - 0.7) / 0.3;
                            } else {
                                j.alpha = 1;
                            }
                            j.alpha = Math.round(j.alpha * 10) / 10;
                        }
                    }
                    break;
            }
        }

        // --- Rendering ---
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function getAlphaAt(nx, ny) {
            // nx, ny in [0, 1] across the canvas
            // Find which cell we're in
            const fx = nx * (gridCols - 1);
            const fy = ny * (gridRows - 1);
            const col = Math.min(Math.floor(fx), gridCols - 2);
            const row = Math.min(Math.floor(fy), gridRows - 2);
            const u = fx - col;
            const v = fy - row;

            const tl = junctions[row * gridCols + col].alpha;
            const tr = junctions[row * gridCols + col + 1].alpha;
            const bl = junctions[(row + 1) * gridCols + col].alpha;
            const br = junctions[(row + 1) * gridCols + col + 1].alpha;

            // Bilinear interpolation
            const top = lerp(tl, tr, u);
            const bot = lerp(bl, br, u);
            return lerp(top, bot, v);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Draw test pattern
            if (patternCanvas) {
                ctx.drawImage(patternCanvas, 0, 0);
            }

            // Draw mask overlay using pixel-level rendering via offscreen canvas
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = W;
            maskCanvas.height = H;
            const mctx = maskCanvas.getContext('2d');
            const imageData = mctx.createImageData(W, H);
            const data = imageData.data;

            // Resolution reduction for performance
            const step = 2;
            for (let py = 0; py < H; py += step) {
                for (let px = 0; px < W; px += step) {
                    const nx = px / W;
                    const ny = py / H;
                    let alpha = getAlphaAt(nx, ny);
                    // Apply gamma
                    alpha = Math.pow(Math.max(0, Math.min(1, alpha)), gamma);
                    const a = Math.round(alpha * 220); // Not fully opaque so you can still see grid
                    // Fill the step×step block
                    for (let dy = 0; dy < step && py + dy < H; dy++) {
                        for (let dx = 0; dx < step && px + dx < W; dx++) {
                            const idx = ((py + dy) * W + (px + dx)) * 4;
                            data[idx] = 0;       // R
                            data[idx + 1] = 0;   // G
                            data[idx + 2] = 0;   // B
                            data[idx + 3] = a;   // A
                        }
                    }
                }
            }
            mctx.putImageData(imageData, 0, 0);
            ctx.drawImage(maskCanvas, 0, 0);

            // Draw junction grid lines (faint)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            for (let r = 0; r < gridRows; r++) {
                ctx.beginPath();
                for (let c = 0; c < gridCols; c++) {
                    const j = junctions[r * gridCols + c];
                    if (c === 0) ctx.moveTo(j.x, j.y);
                    else ctx.lineTo(j.x, j.y);
                }
                ctx.stroke();
            }
            for (let c = 0; c < gridCols; c++) {
                ctx.beginPath();
                for (let r = 0; r < gridRows; r++) {
                    const j = junctions[r * gridCols + c];
                    if (r === 0) ctx.moveTo(j.x, j.y);
                    else ctx.lineTo(j.x, j.y);
                }
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Draw junction points
            for (let i = 0; i < junctions.length; i++) {
                const j = junctions[i];
                const isHover = (i === hoverIndex);
                const isDrag = (i === dragIndex);
                const radius = isDrag ? 9 : isHover ? 8 : 6;

                // Color based on alpha: green (0) → yellow (0.5) → red (1)
                let r, g, b;
                if (j.alpha <= 0.5) {
                    const t = j.alpha / 0.5;
                    r = Math.round(lerp(34, 245, t));
                    g = Math.round(lerp(197, 158, t));
                    b = Math.round(lerp(94, 11, t));
                } else {
                    const t = (j.alpha - 0.5) / 0.5;
                    r = Math.round(lerp(245, 239, t));
                    g = Math.round(lerp(158, 68, t));
                    b = Math.round(lerp(11, 68, t));
                }
                const color = `rgb(${r},${g},${b})`;

                // Glow
                if (isHover || isDrag) {
                    ctx.beginPath();
                    ctx.arc(j.x, j.y, radius + 5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${r},${g},${b},0.3)`;
                    ctx.fill();
                }

                // Circle
                ctx.beginPath();
                ctx.arc(j.x, j.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = isDrag ? 2.5 : 1.5;
                ctx.stroke();

                // Alpha label
                ctx.font = 'bold 10px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillText(j.alpha.toFixed(1), j.x, j.y - radius - 3);
            }
        }

        // --- Interaction ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function findClosestPoint(mx, my, threshold) {
            let closest = -1;
            let minDist = threshold * threshold;
            for (let i = 0; i < junctions.length; i++) {
                const dx = junctions[i].x - mx;
                const dy = junctions[i].y - my;
                const d2 = dx * dx + dy * dy;
                if (d2 < minDist) {
                    minDist = d2;
                    closest = i;
                }
            }
            return closest;
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            dragIndex = findClosestPoint(x, y, 20);
            pointerDownTime = Date.now();
            pointerMoved = false;
            if (dragIndex >= 0) {
                canvas.setPointerCapture(e.pointerId);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            const { x, y } = getCanvasCoords(e);
            if (dragIndex >= 0) {
                pointerMoved = true;
                junctions[dragIndex].x = Math.max(0, Math.min(W, x));
                junctions[dragIndex].y = Math.max(0, Math.min(H, y));
                draw();
            } else {
                const prev = hoverIndex;
                hoverIndex = findClosestPoint(x, y, 20);
                if (hoverIndex !== prev) draw();
                canvas.style.cursor = hoverIndex >= 0 ? 'grab' : 'crosshair';
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            if (dragIndex >= 0) {
                canvas.releasePointerCapture(e.pointerId);
                // If it was a short click without much movement, cycle alpha
                const elapsed = Date.now() - pointerDownTime;
                if (elapsed < 300 && !pointerMoved) {
                    const j = junctions[dragIndex];
                    // Cycle: 0 → 0.5 → 1 → 0
                    if (j.alpha < 0.25) j.alpha = 0.5;
                    else if (j.alpha < 0.75) j.alpha = 1.0;
                    else j.alpha = 0;
                }
            }
            dragIndex = -1;
            canvas.style.cursor = 'crosshair';
            draw();
        });

        canvas.addEventListener('pointerleave', () => {
            if (dragIndex < 0) {
                hoverIndex = -1;
                draw();
            }
        });

        // --- Controls ---
        presetSelect.addEventListener('change', () => {
            applyPreset(presetSelect.value);
            draw();
        });

        gammaSlider.addEventListener('input', () => {
            gamma = parseFloat(gammaSlider.value);
            gammaValue.textContent = gamma.toFixed(1);
            draw();
        });

        btnReset.addEventListener('click', () => {
            applyPreset(presetSelect.value);
            gamma = 1.0;
            gammaSlider.value = '1.0';
            gammaValue.textContent = '1.0';
            draw();
        });

        // --- Init ---
        createTestPattern();
        applyPreset('rect');
        draw();
    })();
</script>
