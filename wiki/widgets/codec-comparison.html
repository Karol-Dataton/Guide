<div class="interactive-widget" id="codec-comparison-widget">
    <canvas id="codec-comparison-canvas" width="960" height="560"
        style="width: 100%; height: auto; display: block; touch-action: none;"></canvas>

    <div class="widget-controls" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <span style="font-size: 0.85rem; color: var(--text-secondary);">Decode:</span>
        <button id="codec-filter-all" class="codec-filter-btn active" type="button">All</button>
        <button id="codec-filter-gpu" class="codec-filter-btn" type="button">GPU</button>
        <button id="codec-filter-cpu" class="codec-filter-btn" type="button">CPU</button>
        <button id="codec-filter-raw" class="codec-filter-btn" type="button">Raw</button>

        <button id="codec-alpha-toggle" class="codec-toggle-btn" type="button">Alpha only: Off</button>
        <button id="codec-bitdepth-toggle" class="codec-toggle-btn" type="button">10/12-bit: Off</button>

        <span style="margin-left: auto; font-size: 0.85rem; color: var(--text-secondary);">Sort:</span>
        <select id="codec-sort-select" style="min-width: 180px;">
            <option value="file-desc">File size (largest first)</option>
            <option value="file-asc">File size (smallest first)</option>
            <option value="scrub-desc">Scrub performance</option>
            <option value="name-asc">Name</option>
            <option value="decode">Decode method</option>
        </select>
    </div>

    <div class="widget-explainer">
        Click codec chips to include or remove them from the comparison. Use filters and sorting to compare tradeoffs
        across <strong>file size</strong>, <strong>scrub performance</strong>, <strong>decode method</strong>,
        <strong>alpha support</strong>, and <strong>10/12-bit capability</strong>. If rows exceed the view,
        scroll inside the chart with your mouse wheel.
    </div>
</div>

<style>
    #codec-comparison-canvas {
        background: transparent !important;
    }

    #codec-comparison-widget .codec-filter-btn,
    #codec-comparison-widget .codec-toggle-btn {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-tertiary);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 0.8rem;
        font-family: inherit;
        transition: all 140ms ease;
    }

    #codec-comparison-widget .codec-filter-btn:hover,
    #codec-comparison-widget .codec-toggle-btn:hover {
        border-color: var(--accent-primary);
        transform: translateY(-1px);
    }

    #codec-comparison-widget .codec-filter-btn.active,
    #codec-comparison-widget .codec-toggle-btn.active {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border-color: transparent;
        color: #fff;
    }
</style>

<script>
    (function () {
        const canvas = document.getElementById('codec-comparison-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // High DPI / Retina display support
        const dpr = window.devicePixelRatio || 1;
        const logicalW = 960;
        const logicalH = 560;

        canvas.width = logicalW * dpr;
        canvas.height = logicalH * dpr;

        // Scale context to match logical coordinate system
        ctx.scale(dpr, dpr);

        const W = logicalW;
        const H = logicalH;

        // Theme management
        const theme = {
            bg: '#0f1729',
            grid: 'rgba(255,255,255,0.05)',
            textPrimary: '#ffffff',
            textSecondary: '#94a3b8',
            fontFamily: '-apple-system, sans-serif',
            fontHeader: '-apple-system, sans-serif',
            accent: '#6366f1',
            gpu: '#6366f1',
            cpu: '#f59e0b',
            raw: '#22c55e',
            border: 'rgba(255,255,255,0.1)',
            tooltipBg: '#1e293b'
        };

        function colorFromVar(varName, fallback) {
            if (typeof window === 'undefined') return fallback;
            const val = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            return val || fallback;
        }

        function updateTheme() {
            theme.bg = colorFromVar('--bg-secondary', '#12121a');
            theme.grid = colorFromVar('--border-subtle', 'rgba(255,255,255,0.06)');
            theme.textPrimary = colorFromVar('--text-primary', '#f8fafc');
            theme.textSecondary = colorFromVar('--text-secondary', '#94a3b8');
            theme.fontFamily = colorFromVar('--font-family', '-apple-system, BlinkMacSystemFont, sans-serif');
            theme.fontHeader = colorFromVar('--font-header', 'sans-serif');
            theme.accent = colorFromVar('--accent-primary', '#6B25DD');

            // Map groups to wiki category colors
            theme.gpu = colorFromVar('--accent-primary', '#6B25DD'); // Main brand color for GPU
            theme.cpu = colorFromVar('--cat-timeline', '#f59e0b'); // Timeline color for CPU
            theme.raw = colorFromVar('--cat-general', '#22c55e'); // Green for raw/general

            theme.border = colorFromVar('--border-subtle', 'rgba(255,255,255,0.1)');
            theme.tooltipBg = colorFromVar('--bg-tertiary', '#1a1a25');
        }

        // Helper to apply alpha to any CSS color (hex, rgb, hsl, var)
        function setFill(color, alpha) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
        }

        function setStroke(color, alpha) {
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
        }

        // Initialize theme
        updateTheme();

        // Watch for theme changes
        const observer = new MutationObserver(() => {
            updateTheme();
            requestAnimation();
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });


        const codecData = [
            {
                name: 'HAP',
                decode: 'GPU (DXT1)',
                group: 'gpu',
                alpha: false,
                fileScore: 4,
                fileLabel: 'Large (5-10x H.264)',
                scrubScore: 3,
                scrubLabel: 'Excellent',
                bestFor: 'Most standard video content',
                recommended: true
            },
            {
                name: 'HAP Alpha',
                decode: 'GPU (DXT5)',
                group: 'gpu',
                alpha: true,
                fileScore: 4,
                fileLabel: 'Large',
                scrubScore: 3,
                scrubLabel: 'Excellent',
                bestFor: 'Transparent video overlays',
                recommended: true
            },
            {
                name: 'HAP Q',
                decode: 'GPU (BC7)',
                group: 'gpu',
                alpha: false,
                fileScore: 5,
                fileLabel: 'Very large',
                scrubScore: 3,
                scrubLabel: 'Excellent',
                bestFor: 'Higher visual fidelity content',
                recommended: false
            },
            {
                name: 'HAP Q Alpha',
                decode: 'GPU (BC7 + DXT5)',
                group: 'gpu',
                alpha: true,
                fileScore: 5,
                fileLabel: 'Very large',
                scrubScore: 3,
                scrubLabel: 'Excellent',
                bestFor: 'High quality transparent content',
                recommended: false
            },
            {
                name: 'NotchLC Opaque',
                decode: 'GPU',
                group: 'gpu',
                alpha: false,
                fileScore: 3,
                fileLabel: 'Medium-large',
                scrubScore: 3,
                scrubLabel: 'Excellent',
                bestFor: 'ProRes replacement, high quality',
                recommended: true
            },
            {
                name: 'NotchLC Alpha',
                decode: 'GPU',
                group: 'gpu',
                alpha: true,
                fileScore: 3,
                fileLabel: 'Medium-large',
                scrubScore: 3,
                scrubLabel: 'Excellent',
                bestFor: 'ProRes 4444 replacement with alpha',
                recommended: true
            },
            {
                name: 'HEVC 4:2:0',
                decode: 'GPU (HW accel)',
                group: 'gpu',
                alpha: false,
                fileScore: 1,
                fileLabel: 'Small',
                scrubScore: 2,
                scrubLabel: 'Good',
                bestFor: 'Standard video when size matters',
                recommended: false
            },
            {
                name: 'HEVC X010',
                decode: 'GPU (HW accel)',
                group: 'gpu',
                highBitDepth: true,
                alpha: false,
                fileScore: 1,
                fileLabel: 'Small',
                scrubScore: 2,
                scrubLabel: 'Good',
                bestFor: '10-bit color depth content',
                recommended: false
            },
            {
                name: 'ProRes 422',
                decode: 'CPU',
                group: 'cpu',
                highBitDepth: true,
                alpha: false,
                fileScore: 2,
                fileLabel: 'Medium',
                scrubScore: 2,
                scrubLabel: 'Good',
                bestFor: 'Intermediate editing codec',
                recommended: false
            },
            {
                name: 'ProRes 4444',
                decode: 'CPU',
                group: 'cpu',
                highBitDepth: true,
                alpha: true,
                fileScore: 4,
                fileLabel: 'Large',
                scrubScore: 2,
                scrubLabel: 'Good',
                bestFor: 'High quality content with alpha',
                recommended: false
            },
            {
                name: 'H.264',
                decode: 'CPU',
                group: 'cpu',
                alpha: false,
                fileScore: 1,
                fileLabel: 'Small',
                scrubScore: 1,
                scrubLabel: 'Moderate',
                bestFor: 'Source delivery, not ideal output',
                recommended: false
            },
            {
                name: 'MPEG-2',
                decode: 'CPU',
                group: 'cpu',
                alpha: false,
                fileScore: 2,
                fileLabel: 'Medium',
                scrubScore: 1,
                scrubLabel: 'Moderate',
                bestFor: 'Legacy broadcast sources',
                recommended: false
            },
            {
                name: 'Raw RGB 8-bit',
                decode: 'Direct (none)',
                group: 'raw',
                alpha: false,
                fileScore: 5,
                fileLabel: 'Very large',
                scrubScore: 4,
                scrubLabel: 'Instant',
                bestFor: 'Uncompressed texture data',
                recommended: false
            },
            {
                name: 'Raw RGBA 8-bit',
                decode: 'Direct (none)',
                group: 'raw',
                alpha: true,
                fileScore: 5,
                fileLabel: 'Very large',
                scrubScore: 4,
                scrubLabel: 'Instant',
                bestFor: 'Uncompressed content with alpha',
                recommended: false
            },
            {
                name: 'Raw RGB 10-bit',
                decode: 'Direct (none)',
                group: 'raw',
                highBitDepth: true,
                alpha: false,
                fileScore: 5,
                fileLabel: 'Very large',
                scrubScore: 4,
                scrubLabel: 'Instant',
                bestFor: '10-bit uncompressed workflows',
                recommended: false
            }
        ];

        const byName = Object.create(null);
        codecData.forEach(codec => {
            byName[codec.name] = codec;
        });

        // Computed group colors function
        function getGroupColor(group) {
            return theme[group] || theme.textSecondary;
        }

        const state = {
            selected: new Set(['HAP', 'HAP Q', 'NotchLC Opaque', 'HEVC 4:2:0', 'H.264']),
            decodeFilter: 'all',
            alphaOnly: false,
            bitDepthOnly: false,
            sort: 'file-desc',
            hoverChip: null,
            hoverRow: null,
            mouseX: 0,
            mouseY: 0,
            scrollY: 0,
            scrollMax: 0,
            isDragging: false,
            dragStartY: 0,
            dragStartScrollY: 0
        };

        const visuals = Object.create(null);
        codecData.forEach((codec, index) => {
            visuals[codec.name] = {
                y: index * 56,
                targetY: index * 56,
                alpha: 0,
                targetAlpha: 0,
                bar: 0,
                targetBar: 0
            };
        });

        let chipHitboxes = [];
        let rowHitboxes = [];
        let visibleNames = [];
        let rowViewportRect = null;
        let scrollThumbRect = null;
        let animationFrame = null;

        const filterAllBtn = document.getElementById('codec-filter-all');
        const filterGpuBtn = document.getElementById('codec-filter-gpu');
        const filterCpuBtn = document.getElementById('codec-filter-cpu');
        const filterRawBtn = document.getElementById('codec-filter-raw');
        const alphaToggleBtn = document.getElementById('codec-alpha-toggle');
        const bitDepthToggleBtn = document.getElementById('codec-bitdepth-toggle');
        const sortSelect = document.getElementById('codec-sort-select');

        function pointInRect(px, py, r) {
            return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
        }

        function passesFilter(codec) {
            if (state.decodeFilter !== 'all' && codec.group !== state.decodeFilter) {
                return false;
            }
            if (state.alphaOnly && !codec.alpha) {
                return false;
            }
            if (state.bitDepthOnly && !codec.highBitDepth) {
                return false;
            }
            return true;
        }

        function getVisibleCodecs() {
            const selectedAndFiltered = codecData.filter(codec => state.selected.has(codec.name) && passesFilter(codec));
            const sorted = selectedAndFiltered.slice();

            if (state.sort === 'file-desc') {
                sorted.sort((a, b) => b.fileScore - a.fileScore || a.name.localeCompare(b.name));
            } else if (state.sort === 'file-asc') {
                sorted.sort((a, b) => a.fileScore - b.fileScore || a.name.localeCompare(b.name));
            } else if (state.sort === 'scrub-desc') {
                sorted.sort((a, b) => b.scrubScore - a.scrubScore || a.name.localeCompare(b.name));
            } else if (state.sort === 'decode') {
                const order = { gpu: 0, cpu: 1, raw: 2 };
                sorted.sort((a, b) => order[a.group] - order[b.group] || a.name.localeCompare(b.name));
            } else {
                sorted.sort((a, b) => a.name.localeCompare(b.name));
            }

            return sorted;
        }

        function updateTargets() {
            const visible = getVisibleCodecs();
            visibleNames = visible.map(codec => codec.name);

            const rowPitch = 56;

            visible.forEach((codec, index) => {
                const v = visuals[codec.name];
                v.targetY = index * rowPitch;
                v.targetAlpha = 1;
                v.targetBar = 1;
            });

            codecData.forEach(codec => {
                if (visibleNames.indexOf(codec.name) === -1) {
                    const v = visuals[codec.name];
                    v.targetAlpha = 0;
                    v.targetBar = 0;
                }
            });

            state.scrollY = 0;

            requestAnimation();
        }

        function requestAnimation() {
            if (animationFrame !== null) return;
            animationFrame = requestAnimationFrame(step);
        }

        function step() {
            animationFrame = null;
            let moving = false;

            codecData.forEach(codec => {
                const v = visuals[codec.name];

                const nextY = v.y + (v.targetY - v.y) * 0.22;
                const nextAlpha = v.alpha + (v.targetAlpha - v.alpha) * 0.2;
                const nextBar = v.bar + (v.targetBar - v.bar) * 0.2;

                if (Math.abs(nextY - v.targetY) > 0.3) moving = true;
                if (Math.abs(nextAlpha - v.targetAlpha) > 0.01) moving = true;
                if (Math.abs(nextBar - v.targetBar) > 0.01) moving = true;

                v.y = nextY;
                v.alpha = nextAlpha;
                v.bar = nextBar;
            });

            draw();

            if (moving) {
                animationFrame = requestAnimationFrame(step);
            }
        }



        function drawBackground() {
            // Clear background to remove container panel look
            ctx.clearRect(0, 0, W, H);
        }

        function drawTitle() {
            ctx.font = 'bold 16px ' + theme.fontHeader; // Increased size slightly to match wiki size
            ctx.textAlign = 'left';

            setFill(theme.textPrimary, 0.9);
            ctx.fillText('Codec Comparison', 24, 28);

            const visibleCount = visibleNames.length;
            ctx.font = '11px ' + theme.fontFamily;
            setFill(theme.textSecondary, 0.8);

            let subline = 'Visible rows: ' + visibleCount;
            if (state.scrollMax > 0) {
                subline += ' | Scroll to see all';
            }
            ctx.fillText(subline, 24, 47);
            ctx.globalAlpha = 1; // Reset
        }

        function drawChips() {
            chipHitboxes = [];
            ctx.font = '11px ' + theme.fontFamily;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            const left = 24;
            const right = W - 24;
            const chipH = 24;
            let x = left;
            let y = 62;

            // Draw Select All chip
            const selectAllLabel = "Select All";
            const saTextW = Math.ceil(ctx.measureText(selectAllLabel).width);
            const saChipW = saTextW + 18;

            const isSAHovered = state.hoverChip === 'SELECT_ALL';
            const saBorderAlpha = isSAHovered ? 0.9 : 0.4;
            const saFillAlpha = isSAHovered ? 0.2 : 0.1;


            roundRect(x, y, saChipW, chipH, 7);
            const saColor = theme.textSecondary;
            setFill(saColor, saFillAlpha);
            ctx.fill();
            setStroke(saColor, saBorderAlpha);
            ctx.lineWidth = 1;
            ctx.stroke();

            setFill(theme.textPrimary, 0.9);
            ctx.fillText(selectAllLabel, x + 9, y + chipH / 2 + 0.5);

            chipHitboxes.push({ x, y, w: saChipW, h: chipH, name: 'SELECT_ALL', action: true });
            x += saChipW + 8;

            codecData.forEach(codec => {
                const label = codec.name + (codec.recommended ? ' *' : '');
                const textW = Math.ceil(ctx.measureText(label).width);
                const chipW = textW + 18;

                if (x + chipW > right) {
                    x = left;
                    y += 30;
                }

                const isSelected = state.selected.has(codec.name);
                const isDimmed = !passesFilter(codec);
                const isHovered = state.hoverChip === codec.name;
                const color = getGroupColor(codec.group);

                const fillAlpha = isSelected ? (isDimmed ? 0.12 : 0.22) : (isDimmed ? 0.02 : 0.06);
                const borderAlpha = isHovered ? 0.75 : isSelected ? 0.55 : 0.25;

                roundRect(x, y, chipW, chipH, 7);
                setFill(color, fillAlpha);
                ctx.fill();
                setStroke(color, borderAlpha);
                ctx.lineWidth = isSelected ? 1.4 : 1;
                ctx.stroke();

                setFill(theme.textPrimary, isDimmed ? 0.45 : 0.9);
                ctx.fillText(label, x + 9, y + chipH / 2 + 0.5);

                chipHitboxes.push({ x, y, w: chipW, h: chipH, name: codec.name });
                x += chipW + 8;
            });
            ctx.globalAlpha = 1;
            return y + chipH;
        }

        function drawRows(rowsStartY) {
            rowHitboxes = [];
            scrollThumbRect = null;
            const rowX = 24;
            // Shorten row width so scrollbar is not over content
            const rowW = W - 64;
            const rowH = 48;
            const rowPitch = 56;

            rowViewportRect = {
                x: rowX,
                y: rowsStartY + 2,
                w: rowW + 40, // Viewport is slightly wider than rows
                h: H - (rowsStartY + 2) - 52
            };

            if (rowViewportRect.h < 80) {
                rowViewportRect.h = 80;
            }

            // Removed container panel background/border drawing here

            const contentHeight = visibleNames.length === 0
                ? 0
                : rowH + (visibleNames.length - 1) * rowPitch;

            state.scrollMax = Math.max(0, contentHeight - rowViewportRect.h);
            if (state.scrollY > state.scrollMax) {
                state.scrollY = state.scrollMax;
            }

            ctx.save();
            // Clip to viewport area
            roundRect(rowViewportRect.x - 10, rowViewportRect.y - 10, rowViewportRect.w + 20, rowViewportRect.h + 20, 0);
            ctx.clip();

            const sortedVisuals = codecData
                .map(codec => ({ codec, visual: visuals[codec.name] }))
                .filter(item => item.visual.alpha > 0.01)
                .sort((a, b) => a.visual.y - b.visual.y);

            sortedVisuals.forEach(item => {
                const codec = item.codec;
                const v = item.visual;
                const y = rowViewportRect.y + v.y - state.scrollY;
                const alpha = v.alpha;
                const isHover = state.hoverRow === codec.name;
                const rowColor = getGroupColor(codec.group);

                // Culling
                if (y + rowH < rowViewportRect.y - 20 || y > rowViewportRect.y + rowViewportRect.h + 20) {
                    return;
                }

                const fillAlpha = 0.08 * alpha + (isHover ? 0.05 : 0);
                const borderAlpha = 0.28 * alpha + (isHover ? 0.35 : 0);

                roundRect(rowX, y, rowW, rowH, 9);
                setFill(rowColor, fillAlpha);
                ctx.fill();
                setStroke(rowColor, borderAlpha);
                ctx.lineWidth = isHover ? 1.5 : 1;
                ctx.stroke();

                ctx.globalAlpha = alpha;

                ctx.font = 'bold 12px ' + theme.fontFamily;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                setFill(theme.textPrimary, 0.95);
                ctx.fillText(codec.name + (codec.recommended ? ' *' : ''), rowX + 12, y + 16);

                roundRect(rowX + 12, y + 26, 90, 16, 8);
                setFill(rowColor, 0.25);
                ctx.fill();
                setStroke(rowColor, 0.45);
                ctx.stroke();

                ctx.font = '10px ' + theme.fontFamily;
                setFill(theme.textPrimary, 0.9);
                ctx.fillText(codec.decode, rowX + 17, y + 34);

                const barX = rowX + 170;
                const barW = 190;
                const fileY = y + 15;
                const scrubY = y + 31;

                setFill(theme.textSecondary, 0.15);
                roundRect(barX, fileY, barW, 8, 4);
                ctx.fill();
                roundRect(barX, scrubY, barW, 8, 4);
                ctx.fill();

                const fileFill = barW * (codec.fileScore / 5) * v.bar;
                const scrubFill = barW * (codec.scrubScore / 4) * v.bar;

                ctx.fillStyle = fileScaleColor(codec.fileScore);
                roundRect(barX, fileY, Math.max(2, fileFill), 8, 4);
                ctx.fill();

                ctx.fillStyle = scrubScaleColor(codec.scrubScore);
                roundRect(barX, scrubY, Math.max(2, scrubFill), 8, 4);
                ctx.fill();

                ctx.font = '10px ' + theme.fontFamily;
                setFill(theme.textSecondary, 0.8);
                ctx.fillText('File: ' + codec.fileLabel, barX + barW + 10, fileY + 4);
                ctx.fillText('Scrub: ' + codec.scrubLabel, barX + barW + 10, scrubY + 4);

                // Right column for Alpha and Description
                const rightColW = 220;
                const rightColX = rowX + rowW - rightColW;
                const centerX = rightColX + rightColW / 2;

                // Alpha Badge
                const badgeW = 64;
                const badgeH = 18;
                const badgeX = centerX - badgeW / 2;
                const badgeY = y + 8;

                roundRect(badgeX, badgeY, badgeW, badgeH, 9);

                const yesColor = theme.raw; // green
                const noColor = theme.textSecondary;

                if (codec.alpha) {
                    setFill(yesColor, 0.2);
                    ctx.fill();
                    setStroke(yesColor, 0.55);
                    ctx.stroke();

                    ctx.font = '10px ' + theme.fontFamily;
                    ctx.textAlign = 'center';
                    setFill(yesColor, 0.95);
                    ctx.fillText('Alpha', centerX, badgeY + badgeH / 2 + 1);
                } else {
                    setFill(noColor, 0.1);
                    ctx.fill();
                    setStroke(noColor, 0.25);
                    ctx.stroke();

                    ctx.font = '10px ' + theme.fontFamily;
                    ctx.textAlign = 'center';
                    setFill(noColor, 0.6);
                    ctx.fillText('No Alpha', centerX, badgeY + badgeH / 2 + 1);
                }

                // Description
                ctx.font = '10px ' + theme.fontFamily;
                ctx.textAlign = 'center';
                setFill(theme.textSecondary, 0.7);
                ctx.fillText(codec.bestFor, centerX, y + 36);

                ctx.globalAlpha = 1;

                if (visibleNames.indexOf(codec.name) !== -1 && alpha > 0.4) {
                    rowHitboxes.push({ x: rowX, y, w: rowW, h: rowH, name: codec.name });
                }
            });

            if (visibleNames.length === 0) {
                // Centered empty state
                const emptyY = rowViewportRect.y + 60;
                ctx.font = '12px ' + theme.fontFamily;
                ctx.textAlign = 'center';
                setFill(theme.textPrimary, 0.75);
                ctx.fillText('No codecs are currently visible.', W / 2, emptyY);
                ctx.font = '11px ' + theme.fontFamily;
                setFill(theme.textSecondary, 0.9);
                ctx.fillText('Select codec chips or relax filters to compare.', W / 2, emptyY + 21);
            }

            ctx.restore();

            if (state.scrollMax > 0) {
                // Scrollbar on the far right
                const trackX = W - 24;
                const trackY = rowViewportRect.y + 8;
                const trackH = rowViewportRect.h - 16;

                roundRect(trackX, trackY, 4, trackH, 2);
                setFill(theme.textSecondary, 0.15);
                ctx.fill();

                const thumbH = Math.max(28, (rowViewportRect.h / contentHeight) * trackH);
                const thumbRange = trackH - thumbH;
                const thumbY = trackY + (state.scrollY / state.scrollMax) * thumbRange;

                roundRect(trackX - 1, thumbY, 6, thumbH, 3);
                setFill(theme.accent, 0.75);
                ctx.fill();

                scrollThumbRect = {
                    x: trackX - 3,
                    y: thumbY,
                    w: 10,
                    h: thumbH,
                    trackY,
                    trackH,
                    thumbH
                };
            }
        }

        function drawLegend() {
            const y = H - 34;
            ctx.font = '10px ' + theme.fontFamily;
            ctx.textAlign = 'left';
            setFill(theme.textSecondary, 0.7);

            drawLegendDot(24, y - 5, theme.gpu, 'GPU decode');
            drawLegendDot(132, y - 5, theme.cpu, 'CPU decode');
            drawLegendDot(240, y - 5, theme.raw, 'Direct/raw');

            setFill(theme.textSecondary, 0.5);
            let suffix = '* Recommended defaults';
            if (state.scrollMax > 0) {
                suffix += ' | Scroll to see all';
            }
            ctx.fillText(suffix, W - 250, y);
            ctx.globalAlpha = 1;
        }

        function drawLegendDot(x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            setFill(color, 1);
            ctx.fill();
            setFill(theme.textSecondary, 0.7);
            ctx.fillText(label, x + 9, y + 3);
        }

        function drawTooltip() {
            if (!state.hoverRow) return;
            const codec = byName[state.hoverRow];
            if (!codec) return;

            const lines = [
                codec.name,
                'Decode: ' + codec.decode,
                'File size: ' + codec.fileLabel,
                'Scrub: ' + codec.scrubLabel,
                'Alpha: ' + (codec.alpha ? 'Yes' : 'No'),
                '10/12-bit: ' + (codec.highBitDepth ? 'Supported' : 'No'),
                'Best for: ' + codec.bestFor
            ];

            const tipW = 290;
            const tipH = 139;
            let x = state.mouseX + 14;
            let y = state.mouseY + 14;

            if (x + tipW > W - 8) x = state.mouseX - tipW - 14;
            if (y + tipH > H - 8) y = state.mouseY - tipH - 14;
            if (x < 8) x = 8;
            if (y < 8) y = 8;

            roundRect(x, y, tipW, tipH, 8);
            setFill(theme.tooltipBg, 0.98); // High opacity for tooltip
            ctx.fill();
            setStroke(getGroupColor(codec.group), 0.75);
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.font = '11px ' + theme.fontFamily;
            ctx.textAlign = 'left';

            setFill(theme.textPrimary, 0.95);
            ctx.fillText(lines[0], x + 12, y + 19);

            ctx.font = '10px ' + theme.fontFamily;
            setFill(theme.textSecondary, 0.9);
            for (let i = 1; i < lines.length; i++) {
                ctx.fillText(lines[i], x + 12, y + 19 + i * 17);
            }
            ctx.globalAlpha = 1;
        }

        function draw() {
            drawBackground();
            drawTitle();
            const chipsBottom = drawChips();



            drawRows(chipsBottom + 16);
            drawLegend();
            drawTooltip();
        }

        function updateButtons() {
            filterAllBtn.classList.toggle('active', state.decodeFilter === 'all');
            filterGpuBtn.classList.toggle('active', state.decodeFilter === 'gpu');
            filterCpuBtn.classList.toggle('active', state.decodeFilter === 'cpu');
            filterRawBtn.classList.toggle('active', state.decodeFilter === 'raw');

            alphaToggleBtn.classList.toggle('active', state.alphaOnly);
            alphaToggleBtn.textContent = 'Alpha only: ' + (state.alphaOnly ? 'On' : 'Off');

            bitDepthToggleBtn.classList.toggle('active', state.bitDepthOnly);
            bitDepthToggleBtn.textContent = '10/12-bit: ' + (state.bitDepthOnly ? 'On' : 'Off');
        }

        function setDecodeFilter(filterName) {
            state.decodeFilter = filterName;
            updateButtons();
            updateTargets();
        }

        filterAllBtn.addEventListener('click', () => setDecodeFilter('all'));
        filterGpuBtn.addEventListener('click', () => setDecodeFilter('gpu'));
        filterCpuBtn.addEventListener('click', () => setDecodeFilter('cpu'));
        filterCpuBtn.addEventListener('click', () => setDecodeFilter('cpu'));
        filterRawBtn.addEventListener('click', () => setDecodeFilter('raw'));
        alphaToggleBtn.addEventListener('click', () => {
            state.alphaOnly = !state.alphaOnly;
            updateButtons();
            updateTargets();
        });
        bitDepthToggleBtn.addEventListener('click', () => {
            state.bitDepthOnly = !state.bitDepthOnly;
            updateButtons();
            updateTargets();
        });

        sortSelect.addEventListener('change', () => {
            state.sort = sortSelect.value;
            updateTargets();
        });

        function getCanvasCoords(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('pointermove', (evt) => {
            const p = getCanvasCoords(evt);
            state.mouseX = p.x;
            state.mouseY = p.y;

            let hoverChip = null;
            for (let i = 0; i < chipHitboxes.length; i++) {
                if (pointInRect(p.x, p.y, chipHitboxes[i])) {
                    hoverChip = chipHitboxes[i].name;
                    break;
                }
            }

            let hoverRow = null;
            for (let i = 0; i < rowHitboxes.length; i++) {
                if (pointInRect(p.x, p.y, rowHitboxes[i])) {
                    hoverRow = rowHitboxes[i].name;
                    break;
                }
            }

            const hoverScrollThumb = scrollThumbRect && pointInRect(p.x, p.y, scrollThumbRect);

            if (state.isDragging) {
                const dy = p.y - state.dragStartY;
                if (scrollThumbRect && state.scrollMax > 0) {
                    const thumbRange = scrollThumbRect.trackH - scrollThumbRect.thumbH;
                    if (thumbRange > 0) {
                        const deltaScroll = (dy / thumbRange) * state.scrollMax;
                        state.scrollY = Math.max(0, Math.min(state.scrollMax, state.dragStartScrollY + deltaScroll));
                        draw();
                    }
                }
                return;
            }

            const nextCursor = hoverScrollThumb ? 'ns-resize' : (hoverChip || hoverRow ? 'pointer' : 'default');
            canvas.style.cursor = nextCursor;

            if (hoverChip !== state.hoverChip || hoverRow !== state.hoverRow) {
                state.hoverChip = hoverChip;
                state.hoverRow = hoverRow;
                draw();
            }
        });

        canvas.addEventListener('pointerup', (evt) => {
            if (state.isDragging) {
                state.isDragging = false;
                canvas.releasePointerCapture(evt.pointerId);
            }
        });

        canvas.addEventListener('pointerleave', () => {
            state.hoverChip = null;
            state.hoverRow = null;
            canvas.style.cursor = 'default';
            draw();
        });

        canvas.addEventListener('pointerdown', (evt) => {
            const p = getCanvasCoords(evt);

            if (scrollThumbRect && pointInRect(p.x, p.y, scrollThumbRect)) {
                state.isDragging = true;
                state.dragStartY = p.y;
                state.dragStartScrollY = state.scrollY;
                canvas.setPointerCapture(evt.pointerId);
                return;
            }

            for (let i = 0; i < chipHitboxes.length; i++) {
                const chip = chipHitboxes[i];
                if (pointInRect(p.x, p.y, chip)) {
                    if (chip.action && chip.name === 'SELECT_ALL') {
                        // Select All Action
                        const allSelected = codecData.every(c => state.selected.has(c.name));
                        if (allSelected) {
                            state.selected.clear();
                        } else {
                            codecData.forEach(c => state.selected.add(c.name));
                        }
                    } else {
                        // Toggle regular chip
                        if (state.selected.has(chip.name)) {
                            state.selected.delete(chip.name);
                        } else {
                            state.selected.add(chip.name);
                        }
                    }
                    updateTargets();
                    return;
                }
            }
        });

        canvas.addEventListener('wheel', (evt) => {
            if (!rowViewportRect || state.scrollMax <= 0) return;

            const p = getCanvasCoords(evt);
            if (!pointInRect(p.x, p.y, rowViewportRect)) return;

            const delta = evt.deltaY;
            const next = Math.max(0, Math.min(state.scrollMax, state.scrollY + delta));
            if (next !== state.scrollY) {
                state.scrollY = next;
                state.hoverRow = null;
                draw();
                evt.preventDefault();
            }
        }, { passive: false });

        function roundRect(x, y, w, h, r) {
            const rr = Math.max(0, Math.min(r, Math.min(w, h) / 2));
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.lineTo(x + w - rr, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
            ctx.lineTo(x + w, y + h - rr);
            ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
            ctx.lineTo(x + rr, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
            ctx.lineTo(x, y + rr);
            ctx.quadraticCurveTo(x, y, x + rr, y);
            ctx.closePath();
        }

        // Kept for backward compat with score functions
        function rgbaFromHex(hex, alpha) {
            // This might fail if hex is not hex.
            // But score functions return rgba string now.
            // This function was used in old draw loop.
            // Helper: if hex starts with # parse it.
            if (hex.startsWith('#')) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
            }
            return hex; // Fallback
        }

        function fileScaleColor(score) {
            if (score <= 1) return 'rgba(34,197,94,0.9)';
            if (score === 2) return 'rgba(132,204,22,0.9)';
            if (score === 3) return 'rgba(250,204,21,0.9)';
            if (score === 4) return 'rgba(249,115,22,0.9)';
            return 'rgba(239,68,68,0.9)';
        }

        function scrubScaleColor(score) {
            if (score <= 1) return 'rgba(239,68,68,0.9)';
            if (score === 2) return 'rgba(245,158,11,0.9)';
            if (score === 3) return 'rgba(34,197,94,0.9)';
            return 'rgba(16,185,129,0.9)';
        }

        updateButtons();
        updateTargets();
        draw();
    })();
</script>
