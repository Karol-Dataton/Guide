<div class="interactive-widget" id="display-masks-widget">
    <div class="widget-controls"
        style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;">
        <div class="control-group" style="display: flex; align-items: center; gap: 8px;">
            <label style="font-weight: 500; white-space: nowrap;">Mask Preset</label>
            <select id="mask-preset-select"
                style="padding: 6px 10px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); font-family: var(--font-family);">
                <option value="none">None</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
                <option value="rect" selected>Rectangular</option>
            </select>
        </div>

        <div class="control-group" style="display: flex; align-items: center; gap: 8px;">
            <label style="font-weight: 500; white-space: nowrap;">Gamma</label>
            <input type="range" id="mask-gamma-slider" min="0.3" max="2.5" step="0.05" value="0.4545"
                style="width: 100px; accent-color: var(--accent-primary);">
            <span id="mask-gamma-value"
                style="font-size: 0.85rem; color: var(--text-secondary); min-width: 34px;">0.45</span>
        </div>

        <div class="control-group" style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button id="mask-reset" class="warp-btn"
                style="padding: 6px 12px; border-radius: 6px; background: var(--accent-primary); border: 1px solid transparent; color: #fff; cursor: pointer; font-family: var(--font-family); font-size: 0.85rem; font-weight: 600; transition: all 150ms ease;">Reset</button>
        </div>
    </div>

    <!-- Main layout: canvas + properties panel side by side -->
    <div style="display: flex; gap: 12px; align-items: flex-start;">

        <!-- Canvas -->
        <div style="flex: 1 1 0; min-width: 0; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--bg-tertiary);">
            <canvas id="mask-canvas" width="640" height="460"
                style="width: 100%; height: auto; display: block; cursor: crosshair; touch-action: none;"></canvas>
            <div id="mask-status"
                 style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #eee; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; pointer-events: none; opacity: 0; transition: opacity 0.2s;">
                Ready
            </div>
        </div>

        <!-- Properties panel -->
        <div id="mask-props-panel"
             style="width: 210px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--bg-secondary, #1a1a2e); padding: 12px; font-size: 0.82rem; color: var(--text-primary);">

            <div style="font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 10px;">Junction</div>

            <!-- Alpha slider -->
            <div id="mask-prop-alpha-row" style="margin-bottom: 10px; opacity: 0.35; pointer-events: none;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                    <label style="color: var(--text-secondary);">Alpha (value)</label>
                    <span id="mask-prop-alpha-display" style="font-variant-numeric: tabular-nums;">0.000</span>
                </div>
                <input type="range" id="mask-prop-alpha-slider" min="0" max="1" step="0.001" value="0"
                    style="width: 100%; accent-color: var(--accent-primary); display: block; margin-bottom: 6px;">
                <div style="display: flex; gap: 6px;">
                    <button id="mask-prop-opaque-btn"
                        style="flex: 1; padding: 4px 0; border-radius: 5px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #ef4444; cursor: pointer; font-size: 0.75rem; font-family: var(--font-family);">
                        Opaque
                    </button>
                    <button id="mask-prop-transparent-btn"
                        style="flex: 1; padding: 4px 0; border-radius: 5px; background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4); color: #22c55e; cursor: pointer; font-size: 0.75rem; font-family: var(--font-family);">
                        Transparent
                    </button>
                </div>
            </div>

            <!-- Position -->
            <div id="mask-prop-pos-row" style="margin-bottom: 10px; opacity: 0.35;">
                <div style="display: flex; gap: 8px;">
                    <div style="flex: 1;">
                        <div style="color: var(--text-secondary); margin-bottom: 2px;">X (norm.)</div>
                        <div id="mask-prop-x" style="font-variant-numeric: tabular-nums; background: var(--bg-tertiary, rgba(0,0,0,0.2)); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border-subtle);">—</div>
                    </div>
                    <div style="flex: 1;">
                        <div style="color: var(--text-secondary); margin-bottom: 2px;">Y (norm.)</div>
                        <div id="mask-prop-y" style="font-variant-numeric: tabular-nums; background: var(--bg-tertiary, rgba(0,0,0,0.2)); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border-subtle);">—</div>
                    </div>
                </div>
            </div>

            <!-- Smooth -->
            <div id="mask-prop-smooth-row" style="margin-bottom: 10px; opacity: 0.35; pointer-events: none;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="mask-prop-smooth" style="accent-color: var(--accent-primary); width: 14px; height: 14px;">
                    <span>Smooth (G¹ continuity)</span>
                </label>
            </div>

            <!-- Handle selector (direction cross) -->
            <div id="mask-prop-handle-row" style="opacity: 0.35; pointer-events: none;">
                <div style="color: var(--text-secondary); margin-bottom: 6px;">Active handle</div>

                <!-- Direction cross -->
                <div style="position: relative; width: 80px; height: 80px; margin: 0 auto 8px;">
                    <!-- Center dot -->
                    <div style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--border-subtle); transform: translate(-50%, -50%);"></div>
                    <!-- Up -->
                    <button id="mask-dir-Up"
                        style="position: absolute; left: 50%; top: 2px; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-subtle); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;"
                        title="Up handle">↑</button>
                    <!-- Down -->
                    <button id="mask-dir-Down"
                        style="position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-subtle); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;"
                        title="Down handle">↓</button>
                    <!-- Left -->
                    <button id="mask-dir-Left"
                        style="position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-subtle); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;"
                        title="Left handle">←</button>
                    <!-- Right -->
                    <button id="mask-dir-Right"
                        style="position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-subtle); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;"
                        title="Right handle">→</button>
                </div>

                <!-- Length / Angle for active handle -->
                <div id="mask-prop-handle-inputs" style="opacity: 0.4; pointer-events: none;">
                    <div style="display: flex; gap: 8px; margin-bottom: 4px;">
                        <div style="flex: 1;">
                            <div style="color: var(--text-secondary); margin-bottom: 2px;">Length (px)</div>
                            <input type="number" id="mask-prop-handle-length" min="0" step="1" value="0"
                                style="width: 100%; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--border-subtle); background: var(--input-bg, rgba(0,0,0,0.3)); color: var(--text-primary); font-family: var(--font-family); font-size: 0.8rem; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1;">
                            <div style="color: var(--text-secondary); margin-bottom: 2px;">Angle (°)</div>
                            <input type="number" id="mask-prop-handle-angle" step="1" value="0"
                                style="width: 100%; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--border-subtle); background: var(--input-bg, rgba(0,0,0,0.3)); color: var(--text-primary); font-family: var(--font-family); font-size: 0.8rem; box-sizing: border-box;">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div
        style="margin-top: 12px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-secondary);">
        <span style="display: flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 12px; height: 12px; transform: rotate(45deg); background: #22c55e;"></span>
            α=0 transparent
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 12px; height: 12px; transform: rotate(45deg); background: #f59e0b;"></span>
            α=0.5
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 12px; height: 12px; transform: rotate(45deg); background: #ef4444;"></span>
            α=1 opaque
        </span>
        <span style="display: flex; align-items: center; gap: 6px; margin-left: auto; opacity: 0.7;">
            Click to select · Drag to move · Ctrl+click curve to add junction · Shift/Alt+click to remove row/col
        </span>
    </div>
</div>

<script>
    (function () {
        const canvas = document.getElementById('mask-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('mask-status');

        const presetSelect = document.getElementById('mask-preset-select');
        const gammaSlider = document.getElementById('mask-gamma-slider');
        const gammaValueEl = document.getElementById('mask-gamma-value');
        const btnReset = document.getElementById('mask-reset');

        // Properties panel elements
        const propAlphaRow = document.getElementById('mask-prop-alpha-row');
        const propAlphaSlider = document.getElementById('mask-prop-alpha-slider');
        const propAlphaDisplay = document.getElementById('mask-prop-alpha-display');
        const propOpaqueBtn = document.getElementById('mask-prop-opaque-btn');
        const propTransparentBtn = document.getElementById('mask-prop-transparent-btn');
        const propPosRow = document.getElementById('mask-prop-pos-row');
        const propXEl = document.getElementById('mask-prop-x');
        const propYEl = document.getElementById('mask-prop-y');
        const propSmoothRow = document.getElementById('mask-prop-smooth-row');
        const propSmooth = document.getElementById('mask-prop-smooth');
        const propHandleRow = document.getElementById('mask-prop-handle-row');
        const propHandleInputs = document.getElementById('mask-prop-handle-inputs');
        const propHandleLength = document.getElementById('mask-prop-handle-length');
        const propHandleAngle = document.getElementById('mask-prop-handle-angle');
        const dirButtons = {
            Up: document.getElementById('mask-dir-Up'),
            Down: document.getElementById('mask-dir-Down'),
            Left: document.getElementById('mask-dir-Left'),
            Right: document.getElementById('mask-dir-Right'),
        };

        const W = canvas.width;
        const H = canvas.height;

        // ---------------------------------------------------------------
        // Data model
        // ---------------------------------------------------------------
        // Each junction: {
        //   x, y  — canvas-space pixels (origin top-left)
        //   value — alpha: 0=transparent/visible, 1=opaque/hidden  (WatchOut convention)
        //   smooth — G¹ continuity flag
        //   handles: {
        //     Left?:  { x, y }   — offset from junction pos in canvas px
        //     Right?: { x, y }
        //     Up?:    { x, y }   — positive y = downward in canvas space
        //     Down?:  { x, y }
        //   }
        // }
        // Grid stored row-major: junctions[r * gridCols + c]

        let gridRows = 4;
        let gridCols = 4;
        let junctions = [];
        let gamma = 0.4545;

        // Interaction state
        let selectedIndex = null;      // selected junction index
        let activeDir = null;          // active handle direction ('Left'|'Right'|'Up'|'Down')
        let dragTarget = null;         // { type: 'point'|'handle', index, dir? }
        let hoverTarget = null;        // { type: 'point'|'handle', index, dir? }
        let hoverCurve = null;         // { type: 'h'|'v', r, c, t, x, y } — for Ctrl+click insertion
        let pointerStartPos = { x: 0, y: 0 };
        let pointerMoved = false;
        let pointerDownTime = 0;
        let ctrlHeld = false;

        // ---------------------------------------------------------------
        // Opposite direction map
        // ---------------------------------------------------------------
        const OPPOSITE = { Left: 'Right', Right: 'Left', Up: 'Down', Down: 'Up' };

        // ---------------------------------------------------------------
        // Handle directions present for a given grid position
        // ---------------------------------------------------------------
        function presentDirections(r, c) {
            const dirs = [];
            if (c > 0)            dirs.push('Left');
            if (c < gridCols - 1) dirs.push('Right');
            if (r > 0)            dirs.push('Up');
            if (r < gridRows - 1) dirs.push('Down');
            return dirs;
        }

        // ---------------------------------------------------------------
        // Normalized ↔ canvas coordinate conversion
        // ---------------------------------------------------------------
        // WatchOut uses normalized [0,1] with origin at bottom-left.
        // Canvas uses pixel coords with origin at top-left.
        // We store junctions in canvas pixels internally for easy rendering.
        function normToCanvas(nx, ny) {
            // WatchOut: y=0 bottom, y=1 top → canvas: y=H top, y=0 bottom
            return { x: nx * W, y: (1 - ny) * H };
        }
        function canvasToNorm(cx, cy) {
            return { x: cx / W, y: 1 - cy / H };
        }

        // ---------------------------------------------------------------
        // Create junction from normalized position
        // ---------------------------------------------------------------
        function createJunction(nx, ny, value, r, c, rows, cols) {
            const { x, y } = normToCanvas(nx, ny);
            const dirs = [];
            if (c > 0)          dirs.push('Left');
            if (c < cols - 1)   dirs.push('Right');
            if (r > 0)          dirs.push('Up');    // Up = toward row 0 = toward canvas top
            if (r < rows - 1)   dirs.push('Down');
            const handles = {};
            for (const d of dirs) handles[d] = { x: 0, y: 0 };
            return { x, y, value, smooth: true, handles };
        }

        // ---------------------------------------------------------------
        // Auto-calculate handles for a straight grid
        // ---------------------------------------------------------------
        function updateHandlesFromGrid() {
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const j = junctions[r * gridCols + c];

                    if ('Right' in j.handles && c < gridCols - 1) {
                        const next = junctions[r * gridCols + c + 1];
                        j.handles.Right = { x: (next.x - j.x) * 0.33, y: (next.y - j.y) * 0.33 };
                    }
                    if ('Left' in j.handles && c > 0) {
                        const prev = junctions[r * gridCols + c - 1];
                        j.handles.Left = { x: (prev.x - j.x) * 0.33, y: (prev.y - j.y) * 0.33 };
                    }
                    if ('Down' in j.handles && r < gridRows - 1) {
                        const next = junctions[(r + 1) * gridCols + c];
                        j.handles.Down = { x: (next.x - j.x) * 0.33, y: (next.y - j.y) * 0.33 };
                    }
                    if ('Up' in j.handles && r > 0) {
                        const prev = junctions[(r - 1) * gridCols + c];
                        j.handles.Up = { x: (prev.x - j.x) * 0.33, y: (prev.y - j.y) * 0.33 };
                    }
                }
            }
        }

        // ---------------------------------------------------------------
        // Helper math
        // ---------------------------------------------------------------
        function lerp(a, b, t) { return a + (b - a) * t; }

        function cubicBezier1D(p0, p1, p2, p3, t) {
            const u = 1 - t;
            return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
        }

        function getPointOnCurve(p0, cp1, cp2, p3, t) {
            return {
                x: cubicBezier1D(p0.x, cp1.x, cp2.x, p3.x, t),
                y: cubicBezier1D(p0.y, cp1.y, cp2.y, p3.y, t),
            };
        }

        // ---------------------------------------------------------------
        // Control points for horizontal curve between junctions [r,c] and [r,c+1]
        // ---------------------------------------------------------------
        function hCurveCP(j0, j1) {
            const h0 = j0.handles.Right || { x: 0, y: 0 };
            const h1 = j1.handles.Left  || { x: 0, y: 0 };
            return {
                cp1: { x: j0.x + h0.x, y: j0.y + h0.y },
                cp2: { x: j1.x + h1.x, y: j1.y + h1.y }, // Left handle points toward j0
            };
        }

        // Control points for vertical curve between junctions [r,c] and [r+1,c]
        function vCurveCP(j0, j1) {
            const h0 = j0.handles.Down || { x: 0, y: 0 };
            const h1 = j1.handles.Up   || { x: 0, y: 0 };
            return {
                cp1: { x: j0.x + h0.x, y: j0.y + h0.y },
                cp2: { x: j1.x + h1.x, y: j1.y + h1.y },
            };
        }

        // ---------------------------------------------------------------
        // PRESETS — all coordinates in WatchOut normalized space [0,1]
        // then converted to canvas pixels via normToCanvas()
        // ---------------------------------------------------------------

        // Constants matching WatchOut mask.rs
        const OPAQUE_W  = 0.1;   // MASK_OPAQUE_WIDTH
        const FEATHER_W = 0.2;   // MASK_FEATHER_WIDTH
        const MARGIN    = 0.0;   // MASK_MARGIN (currently 0 in WatchOut)

        const CV = 0.0; // CONTENTS_VISIBLE
        const CH = 1.0; // CONTENTS_HIDDEN

        function buildGridFromData(rowData, colData) {
            // rowData: array of { y, vis }
            // colData: array of { x, vis }
            // value at [r,c] = rowData[r].vis * colData[c].vis
            const rows = rowData.length;
            const cols = colData.length;
            gridRows = rows;
            gridCols = cols;
            junctions = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const value = rowData[r].vis * colData[c].vis;
                    const j = createJunction(colData[c].x, rowData[r].y, value, r, c, rows, cols);
                    junctions.push(j);
                }
            }
            updateHandlesFromGrid();
        }

        function applyPreset(name) {
            selectedIndex = null;
            activeDir = null;

            switch (name) {
                case 'none': {
                    // 2x2 fully transparent grid
                    const rowData = [{ y: 0.0, vis: CV }, { y: 1.0, vis: CV }];
                    const colData = [{ x: 0.0, vis: CV }, { x: 1.0, vis: CV }];
                    buildGridFromData(rowData, colData);
                    break;
                }

                case 'left': {
                    // 2 rows × 3 cols
                    // WatchOut: outside_hidden_x=0-MARGIN=0, inside_hidden_x=OPAQUE_W, visible_x=OPAQUE_W+FEATHER_W
                    const rowData = [
                        { y: 0.0 - MARGIN, vis: 1.0 }, // UNSPECIFIED = 1.0
                        { y: 1.0 + MARGIN, vis: 1.0 },
                    ];
                    const colData = [
                        { x: 0.0 - MARGIN,          vis: CH },   // outside hidden
                        { x: OPAQUE_W,               vis: CH },   // inside hidden
                        { x: OPAQUE_W + FEATHER_W,   vis: CV },   // visible
                    ];
                    buildGridFromData(rowData, colData);
                    break;
                }

                case 'right': {
                    const rowData = [
                        { y: 0.0 - MARGIN, vis: 1.0 },
                        { y: 1.0 + MARGIN, vis: 1.0 },
                    ];
                    const colData = [
                        { x: 1.0 - (OPAQUE_W + FEATHER_W), vis: CV },   // visible
                        { x: 1.0 - OPAQUE_W,               vis: CH },   // inside hidden
                        { x: 1.0 + MARGIN,                  vis: CH },   // outside hidden
                    ];
                    buildGridFromData(rowData, colData);
                    break;
                }

                case 'top': {
                    // 3 rows × 2 cols
                    const rowData = [
                        { y: 1.0 - (OPAQUE_W + FEATHER_W), vis: CV },
                        { y: 1.0 - OPAQUE_W,               vis: CH },
                        { y: 1.0 + MARGIN,                  vis: CH },
                    ];
                    const colData = [
                        { x: 0.0 - MARGIN, vis: 1.0 },
                        { x: 1.0 + MARGIN, vis: 1.0 },
                    ];
                    buildGridFromData(rowData, colData);
                    break;
                }

                case 'bottom': {
                    const rowData = [
                        { y: 0.0 - MARGIN, vis: CH },
                        { y: OPAQUE_W,     vis: CH },
                        { y: OPAQUE_W + FEATHER_W, vis: CV },
                    ];
                    const colData = [
                        { x: 0.0 - MARGIN, vis: 1.0 },
                        { x: 1.0 + MARGIN, vis: 1.0 },
                    ];
                    buildGridFromData(rowData, colData);
                    break;
                }

                case 'rect': {
                    // 4 rows × 4 cols — MARGIN=0.2, FEATHER=0.15
                    const RM = 0.2, RF = 0.15;
                    const rowData = [
                        { y: RM,           vis: CV },
                        { y: RM + RF,      vis: CH },
                        { y: 1.0-RM-RF,   vis: CH },
                        { y: 1.0-RM,      vis: CV },
                    ];
                    const colData = [
                        { x: RM,           vis: CV },
                        { x: RM + RF,      vis: CH },
                        { x: 1.0-RM-RF,   vis: CH },
                        { x: 1.0-RM,      vis: CV },
                    ];
                    buildGridFromData(rowData, colData);
                    break;
                }

            }
        }

        // ---------------------------------------------------------------
        // Test pattern background (cached)
        // ---------------------------------------------------------------
        let patternCanvas = null;

        function createTestPattern() {
            patternCanvas = document.createElement('canvas');
            patternCanvas.width = W;
            patternCanvas.height = H;
            const pctx = patternCanvas.getContext('2d');

            const grad = pctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#1e3a5f');
            grad.addColorStop(0.5, '#2d1b69');
            grad.addColorStop(1, '#1a1a2e');
            pctx.fillStyle = grad;
            pctx.fillRect(0, 0, W, H);

            const cols = 12, rows = 9;
            const cw = W / cols, ch = H / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if ((r + c) % 2 === 0) {
                        pctx.fillStyle = 'rgba(255,255,255,0.06)';
                        pctx.fillRect(c * cw, r * ch, cw, ch);
                    }
                }
            }

            pctx.strokeStyle = 'rgba(99, 102, 241, 0.25)';
            pctx.lineWidth = 1;
            pctx.beginPath();
            pctx.moveTo(0, H/2); pctx.lineTo(W, H/2);
            pctx.moveTo(W/2, 0); pctx.lineTo(W/2, H);
            pctx.stroke();

            pctx.strokeStyle = 'rgba(239, 68, 68, 0.15)';
            pctx.beginPath();
            pctx.moveTo(0, 0); pctx.lineTo(W, H);
            pctx.moveTo(W, 0); pctx.lineTo(0, H);
            pctx.stroke();

            pctx.font = 'bold 40px Futura, sans-serif';
            pctx.textAlign = 'center';
            pctx.textBaseline = 'middle';
            pctx.fillStyle = 'rgba(255,255,255,0.12)';
            pctx.fillText('DISPLAY OUTPUT', W/2, H/2);
        }

        // ---------------------------------------------------------------
        // Mask overlay rendering
        // ---------------------------------------------------------------
        function drawMaskOverlay() {
            const maskCvs = document.createElement('canvas');
            maskCvs.width = W;
            maskCvs.height = H;
            const mctx = maskCvs.getContext('2d');

            const steps = 12;

            for (let r = 0; r < gridRows - 1; r++) {
                for (let c = 0; c < gridCols - 1; c++) {
                    const tl = junctions[r       * gridCols + c    ];
                    const tr = junctions[r       * gridCols + c + 1];
                    const bl = junctions[(r + 1) * gridCols + c    ];
                    const br = junctions[(r + 1) * gridCols + c + 1];

                    const { cp1: topCp1, cp2: topCp2 } = hCurveCP(tl, tr);
                    const { cp1: botCp1, cp2: botCp2 } = hCurveCP(bl, br);

                    for (let i = 0; i < steps; i++) {
                        for (let j2 = 0; j2 < steps; j2++) {
                            const u0 = j2 / steps, v0 = i / steps;
                            const u1 = (j2+1)/steps, v1 = (i+1)/steps;

                            const getSP = (u, v) => {
                                const top = getPointOnCurve(tl, topCp1, topCp2, tr, u);
                                const bot = getPointOnCurve(bl, botCp1, botCp2, br, u);
                                const x = lerp(top.x, bot.x, v);
                                const y = lerp(top.y, bot.y, v);
                                const aTop = lerp(tl.value, tr.value, u);
                                const aBot = lerp(bl.value, br.value, u);
                                const alpha = lerp(aTop, aBot, v);
                                return { x, y, alpha };
                            };

                            const pA = getSP(u0, v0);
                            const pB = getSP(u1, v0);
                            const pC = getSP(u1, v1);
                            const pD = getSP(u0, v1);

                            let alpha = (pA.alpha + pB.alpha + pC.alpha + pD.alpha) / 4;
                            alpha = Math.pow(Math.max(0, Math.min(1, alpha)), gamma);

                            mctx.beginPath();
                            mctx.moveTo(pA.x, pA.y);
                            mctx.lineTo(pB.x, pB.y);
                            mctx.lineTo(pC.x, pC.y);
                            mctx.lineTo(pD.x, pD.y);
                            mctx.closePath();
                            mctx.fillStyle = `rgba(0,0,0,${alpha})`;
                            mctx.fill();
                        }
                    }
                }
            }
            ctx.drawImage(maskCvs, 0, 0);
        }

        // ---------------------------------------------------------------
        // Value → color
        // ---------------------------------------------------------------
        function valueColor(v) {
            // 0 = green (#22c55e), 0.5 = amber (#f59e0b), 1 = red (#ef4444)
            let r, g, b;
            if (v <= 0.5) {
                const t = v / 0.5;
                r = Math.round(lerp(34,  245, t));
                g = Math.round(lerp(197, 158, t));
                b = Math.round(lerp(94,  11,  t));
            } else {
                const t = (v - 0.5) / 0.5;
                r = Math.round(lerp(245, 239, t));
                g = Math.round(lerp(158, 68,  t));
                b = Math.round(lerp(11,  68,  t));
            }
            return `rgb(${r},${g},${b})`;
        }

        // ---------------------------------------------------------------
        // Draw a diamond (rotated square) at (x, y) with half-size r
        // ---------------------------------------------------------------
        function drawDiamond(x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x,     y - r);
            ctx.lineTo(x + r, y    );
            ctx.lineTo(x,     y + r);
            ctx.lineTo(x - r, y    );
            ctx.closePath();
        }

        // ---------------------------------------------------------------
        // Main draw
        // ---------------------------------------------------------------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // 1. Test pattern
            if (patternCanvas) ctx.drawImage(patternCanvas, 0, 0);

            // 2. Mask overlay
            drawMaskOverlay();

            // 3. Grid lines (Bézier)
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);

            for (let r = 0; r < gridRows; r++) {
                ctx.beginPath();
                ctx.moveTo(junctions[r * gridCols].x, junctions[r * gridCols].y);
                for (let c = 0; c < gridCols - 1; c++) {
                    const j0 = junctions[r * gridCols + c];
                    const j1 = junctions[r * gridCols + c + 1];
                    const { cp1, cp2 } = hCurveCP(j0, j1);
                    ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, j1.x, j1.y);
                }
                ctx.stroke();
            }

            for (let c = 0; c < gridCols; c++) {
                ctx.beginPath();
                ctx.moveTo(junctions[c].x, junctions[c].y);
                for (let r = 0; r < gridRows - 1; r++) {
                    const j0 = junctions[r       * gridCols + c];
                    const j1 = junctions[(r + 1) * gridCols + c];
                    const { cp1, cp2 } = vCurveCP(j0, j1);
                    ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, j1.x, j1.y);
                }
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // 4. Ctrl hover curve insertion indicator
            if (ctrlHeld && hoverCurve) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(hoverCurve.x, hoverCurve.y, 5, 0, Math.PI*2);
                ctx.stroke();

                ctx.lineWidth = 1;
                ctx.setLineDash([2, 2]);
                ctx.beginPath();
                ctx.moveTo(hoverCurve.x - 10, hoverCurve.y);
                ctx.lineTo(hoverCurve.x + 10, hoverCurve.y);
                ctx.moveTo(hoverCurve.x,      hoverCurve.y - 10);
                ctx.lineTo(hoverCurve.x,      hoverCurve.y + 10);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 5. Handles for selected junction
            if (selectedIndex !== null) {
                const j = junctions[selectedIndex];
                for (const [dir, h] of Object.entries(j.handles)) {
                    const hx = j.x + h.x, hy = j.y + h.y;
                    const isActive = (dir === activeDir);

                    ctx.strokeStyle = isActive ? 'rgba(255,220,0,0.8)' : 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = isActive ? 1.5 : 1;
                    ctx.beginPath();
                    ctx.moveTo(j.x, j.y);
                    ctx.lineTo(hx, hy);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(hx, hy, isActive ? 4.5 : 3, 0, Math.PI*2);
                    ctx.fillStyle = isActive ? '#ffd700' : 'rgba(255,255,255,0.6)';
                    ctx.fill();
                }
            }

            // 6. Junction diamonds
            for (let i = 0; i < junctions.length; i++) {
                const j = junctions[i];
                const isSelected = (i === selectedIndex);
                const isHover = (hoverTarget && hoverTarget.type === 'point' && hoverTarget.index === i);
                const isDrag = (dragTarget && dragTarget.type === 'point' && dragTarget.index === i);

                const r = isDrag ? 9 : isSelected ? 8 : isHover ? 7 : 5.5;
                const color = valueColor(j.value);

                // Glow for selected/hovered
                if (isSelected || isHover) {
                    drawDiamond(j.x, j.y, r + 6);
                    ctx.fillStyle = color.replace('rgb(', 'rgba(').replace(')', ', 0.25)');
                    ctx.fill();
                }

                drawDiamond(j.x, j.y, r);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(255,255,255,0.6)';
                ctx.lineWidth = isSelected ? 2 : 1.5;
                ctx.stroke();

                // Alpha label on hover/selected
                if (isSelected || isHover || isDrag) {
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.fillText(j.value.toFixed(2), j.x, j.y - r - 3);
                }
            }

            // 7. Handle dots for drag target (when dragging a handle)
            if (dragTarget && dragTarget.type === 'handle') {
                const j = junctions[dragTarget.index];
                const h = j.handles[dragTarget.dir];
                if (h) {
                    ctx.beginPath();
                    ctx.arc(j.x + h.x, j.y + h.y, 5, 0, Math.PI*2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                }
            }
        }

        // ---------------------------------------------------------------
        // Hit testing
        // ---------------------------------------------------------------
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function distSq(x1, y1, x2, y2) {
            return (x1-x2)**2 + (y1-y2)**2;
        }

        function findPointHit(mx, my) {
            const THRESH_SQ = 12 * 12;
            let best = null, bestD = THRESH_SQ;
            for (let i = 0; i < junctions.length; i++) {
                const d = distSq(junctions[i].x, junctions[i].y, mx, my);
                if (d < bestD) { bestD = d; best = i; }
            }
            return best !== null ? { type: 'point', index: best } : null;
        }

        function findHandleHit(mx, my) {
            if (selectedIndex === null) return null;
            const THRESH_SQ = 8 * 8;
            const j = junctions[selectedIndex];
            for (const [dir, h] of Object.entries(j.handles)) {
                const hx = j.x + h.x, hy = j.y + h.y;
                if (distSq(hx, hy, mx, my) < THRESH_SQ) {
                    return { type: 'handle', index: selectedIndex, dir };
                }
            }
            return null;
        }

        function findCurveHit(mx, my) {
            const THRESH = 10;

            // Check horizontal curves
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols - 1; c++) {
                    const j0 = junctions[r * gridCols + c];
                    const j1 = junctions[r * gridCols + c + 1];
                    const { cp1, cp2 } = hCurveCP(j0, j1);
                    for (let s = 1; s <= 8; s++) {
                        const t = s / 9;
                        const p = getPointOnCurve(j0, cp1, cp2, j1, t);
                        if (distSq(p.x, p.y, mx, my) < THRESH*THRESH) {
                            return { type: 'h', r, c, t, x: p.x, y: p.y };
                        }
                    }
                }
            }

            // Check vertical curves
            for (let c = 0; c < gridCols; c++) {
                for (let r = 0; r < gridRows - 1; r++) {
                    const j0 = junctions[r       * gridCols + c];
                    const j1 = junctions[(r + 1) * gridCols + c];
                    const { cp1, cp2 } = vCurveCP(j0, j1);
                    for (let s = 1; s <= 8; s++) {
                        const t = s / 9;
                        const p = getPointOnCurve(j0, cp1, cp2, j1, t);
                        if (distSq(p.x, p.y, mx, my) < THRESH*THRESH) {
                            return { type: 'v', r, c, t, x: p.x, y: p.y };
                        }
                    }
                }
            }
            return null;
        }

        // ---------------------------------------------------------------
        // Add row / column by splitting at parameter t
        // ---------------------------------------------------------------
        function addRow(afterRow, tVal) {
            if (gridRows >= 12) return;
            const newJunctions = [];
            for (let c = 0; c < gridCols; c++) {
                const j0 = junctions[afterRow       * gridCols + c];
                const j1 = junctions[(afterRow + 1) * gridCols + c];
                const { cp1, cp2 } = vCurveCP(j0, j1);
                const pos = getPointOnCurve(j0, cp1, cp2, j1, tVal);
                const value = lerp(j0.value, j1.value, tVal);
                const nj = { x: pos.x, y: pos.y, value, smooth: true, handles: {} };
                if (c > 0)          nj.handles.Left  = { x: 0, y: 0 };
                if (c < gridCols-1) nj.handles.Right = { x: 0, y: 0 };
                nj.handles.Up   = { x: 0, y: 0 };
                nj.handles.Down = { x: 0, y: 0 };
                newJunctions.push(nj);
            }
            const next = [];
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) next.push(junctions[r * gridCols + c]);
                if (r === afterRow) for (const nj of newJunctions) next.push(nj);
            }
            gridRows++;
            junctions = next;
            // Init handles for new row only
            const nr = afterRow + 1;
            for (let c = 0; c < gridCols; c++) {
                const j = junctions[nr * gridCols + c];
                const prev = junctions[(nr - 1) * gridCols + c];
                const nxt = junctions[(nr + 1) * gridCols + c];
                if ('Right' in j.handles && c < gridCols-1) {
                    const nb = junctions[nr * gridCols + c + 1];
                    j.handles.Right = { x: (nb.x - j.x)*0.33, y: (nb.y - j.y)*0.33 };
                }
                if ('Left' in j.handles && c > 0) {
                    const pb = junctions[nr * gridCols + c - 1];
                    j.handles.Left = { x: (pb.x - j.x)*0.33, y: (pb.y - j.y)*0.33 };
                }
                j.handles.Up   = { x: (prev.x - j.x)*0.33, y: (prev.y - j.y)*0.33 };
                j.handles.Down = { x: (nxt.x  - j.x)*0.33, y: (nxt.y  - j.y)*0.33 };
            }
        }

        function addCol(afterCol, tVal) {
            if (gridCols >= 12) return;
            const newCol = [];
            for (let r = 0; r < gridRows; r++) {
                const j0 = junctions[r * gridCols + afterCol];
                const j1 = junctions[r * gridCols + afterCol + 1];
                const { cp1, cp2 } = hCurveCP(j0, j1);
                const pos = getPointOnCurve(j0, cp1, cp2, j1, tVal);
                const value = lerp(j0.value, j1.value, tVal);
                const nj = { x: pos.x, y: pos.y, value, smooth: true, handles: {} };
                nj.handles.Left  = { x: 0, y: 0 };
                nj.handles.Right = { x: 0, y: 0 };
                if (r > 0)          nj.handles.Up   = { x: 0, y: 0 };
                if (r < gridRows-1) nj.handles.Down = { x: 0, y: 0 };
                newCol.push(nj);
            }
            const next = [];
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    next.push(junctions[r * gridCols + c]);
                    if (c === afterCol) next.push(newCol[r]);
                }
            }
            gridCols++;
            junctions = next;
            const nc = afterCol + 1;
            for (let r = 0; r < gridRows; r++) {
                const j = junctions[r * gridCols + nc];
                const prev = junctions[r * gridCols + nc - 1];
                const nxt = junctions[r * gridCols + nc + 1];
                j.handles.Left  = { x: (prev.x - j.x)*0.33, y: (prev.y - j.y)*0.33 };
                j.handles.Right = { x: (nxt.x  - j.x)*0.33, y: (nxt.y  - j.y)*0.33 };
                if ('Up' in j.handles) {
                    const pu = junctions[(r-1) * gridCols + nc];
                    j.handles.Up = { x: (pu.x - j.x)*0.33, y: (pu.y - j.y)*0.33 };
                }
                if ('Down' in j.handles) {
                    const pd = junctions[(r+1) * gridCols + nc];
                    j.handles.Down = { x: (pd.x - j.x)*0.33, y: (pd.y - j.y)*0.33 };
                }
            }
        }

        function removeRow(rowIndex) {
            if (gridRows <= 2) return;
            const next = [];
            for (let r = 0; r < gridRows; r++) {
                if (r === rowIndex) continue;
                for (let c = 0; c < gridCols; c++) next.push(junctions[r * gridCols + c]);
            }
            gridRows--;
            junctions = next;
            // Rebuild directions for border rows
            rebuildDirections();
        }

        function removeCol(colIndex) {
            if (gridCols <= 2) return;
            const next = [];
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (c === colIndex) continue;
                    next.push(junctions[r * gridCols + c]);
                }
            }
            gridCols--;
            junctions = next;
            rebuildDirections();
        }

        function rebuildDirections() {
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const j = junctions[r * gridCols + c];
                    const needed = new Set(presentDirections(r, c));
                    // Remove handles no longer valid
                    for (const dir of Object.keys(j.handles)) {
                        if (!needed.has(dir)) delete j.handles[dir];
                    }
                    // Add missing handles
                    for (const dir of needed) {
                        if (!(dir in j.handles)) j.handles[dir] = { x: 0, y: 0 };
                    }
                }
            }
        }

        // ---------------------------------------------------------------
        // Properties panel update
        // ---------------------------------------------------------------
        function updatePropsPanel() {
            const hasSelection = selectedIndex !== null;
            const j = hasSelection ? junctions[selectedIndex] : null;

            const enable = (el) => { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; };
            const disable = (el) => { el.style.opacity = '0.35'; el.style.pointerEvents = 'none'; };

            if (hasSelection) {
                enable(propAlphaRow);
                propAlphaRow.style.pointerEvents = 'auto';
                propAlphaSlider.value = j.value;
                propAlphaDisplay.textContent = j.value.toFixed(3);

                propPosRow.style.opacity = '1';
                const norm = canvasToNorm(j.x, j.y);
                propXEl.textContent = norm.x.toFixed(3);
                propYEl.textContent = norm.y.toFixed(3);

                enable(propSmoothRow);
                propSmooth.checked = j.smooth;

                enable(propHandleRow);

                // Direction buttons — enable only those with handles
                for (const [dir, btn] of Object.entries(dirButtons)) {
                    const hasDir = dir in j.handles;
                    btn.style.opacity = hasDir ? '1' : '0.25';
                    btn.style.pointerEvents = hasDir ? 'auto' : 'none';
                    btn.style.borderColor = (dir === activeDir) ? '#ffd700' : '';
                    btn.style.color = (dir === activeDir) ? '#ffd700' : '';
                    btn.style.background = (dir === activeDir) ? 'rgba(255,215,0,0.15)' : '';
                }

                // Handle inputs
                if (activeDir && activeDir in j.handles) {
                    propHandleInputs.style.opacity = '1';
                    propHandleInputs.style.pointerEvents = 'auto';
                    const h = j.handles[activeDir];
                    const len = Math.sqrt(h.x*h.x + h.y*h.y);
                    let angle = Math.atan2(h.y, h.x) * 180 / Math.PI;
                    propHandleLength.value = Math.round(len);
                    propHandleAngle.value = Math.round(angle);
                } else {
                    propHandleInputs.style.opacity = '0.4';
                    propHandleInputs.style.pointerEvents = 'none';
                }
            } else {
                disable(propAlphaRow);
                propPosRow.style.opacity = '0.35';
                propXEl.textContent = '—';
                propYEl.textContent = '—';
                disable(propSmoothRow);
                disable(propHandleRow);
                propHandleInputs.style.opacity = '0.4';
                propHandleInputs.style.pointerEvents = 'none';
                for (const btn of Object.values(dirButtons)) {
                    btn.style.borderColor = '';
                    btn.style.color = '';
                    btn.style.background = '';
                }
            }
        }

        // ---------------------------------------------------------------
        // Properties panel event handlers
        // ---------------------------------------------------------------
        propAlphaSlider.addEventListener('input', () => {
            if (selectedIndex === null) return;
            junctions[selectedIndex].value = parseFloat(propAlphaSlider.value);
            propAlphaDisplay.textContent = junctions[selectedIndex].value.toFixed(3);
            draw();
        });

        propOpaqueBtn.addEventListener('click', () => {
            if (selectedIndex === null) return;
            junctions[selectedIndex].value = 1;
            updatePropsPanel();
            draw();
        });

        propTransparentBtn.addEventListener('click', () => {
            if (selectedIndex === null) return;
            junctions[selectedIndex].value = 0;
            updatePropsPanel();
            draw();
        });

        propSmooth.addEventListener('change', () => {
            if (selectedIndex === null) return;
            junctions[selectedIndex].smooth = propSmooth.checked;
            draw();
        });

        for (const [dir, btn] of Object.entries(dirButtons)) {
            btn.addEventListener('click', () => {
                if (selectedIndex === null) return;
                activeDir = (activeDir === dir) ? null : dir;
                updatePropsPanel();
                draw();
            });
        }

        function applyHandleFromInputs() {
            if (selectedIndex === null || !activeDir) return;
            const j = junctions[selectedIndex];
            if (!(activeDir in j.handles)) return;
            const len = parseFloat(propHandleLength.value) || 0;
            const angleDeg = parseFloat(propHandleAngle.value) || 0;
            const angleRad = angleDeg * Math.PI / 180;
            const hx = Math.cos(angleRad) * len;
            const hy = Math.sin(angleRad) * len;
            j.handles[activeDir] = { x: hx, y: hy };

            // G¹ smooth: mirror opposite handle
            if (j.smooth) {
                const opp = OPPOSITE[activeDir];
                if (opp in j.handles) {
                    j.handles[opp] = { x: -hx, y: -hy };
                }
            }
            draw();
        }

        propHandleLength.addEventListener('change', applyHandleFromInputs);
        propHandleAngle.addEventListener('change', applyHandleFromInputs);

        // ---------------------------------------------------------------
        // Pointer events
        // ---------------------------------------------------------------
        canvas.addEventListener('keydown', () => {}, false); // needed to receive kb events? No.
        window.addEventListener('keydown', (e) => { ctrlHeld = e.ctrlKey; if (hoverCurve || !hoverCurve) draw(); });
        window.addEventListener('keyup',   (e) => { ctrlHeld = e.ctrlKey; draw(); });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            ctrlHeld = e.ctrlKey;
            const { x, y } = getCanvasCoords(e);

            // Ctrl+click on curve → insert junction
            if (ctrlHeld) {
                const curve = findCurveHit(x, y);
                if (curve) {
                    if (curve.type === 'h') addCol(curve.c, curve.t);
                    else                    addRow(curve.r, curve.t);
                    selectedIndex = null;
                    activeDir = null;
                    updatePropsPanel();
                    draw();
                    return;
                }
            }

            // Check handle hit first (only when a junction is selected)
            const handleHit = findHandleHit(x, y);
            if (handleHit) {
                dragTarget = handleHit;
                activeDir = handleHit.dir;
                pointerStartPos = { x, y };
                pointerMoved = false;
                pointerDownTime = Date.now();
                canvas.setPointerCapture(e.pointerId);
                updatePropsPanel();
                draw();
                return;
            }

            // Check junction hit
            const pointHit = findPointHit(x, y);
            if (pointHit) {
                const r = Math.floor(pointHit.index / gridCols);
                const c = pointHit.index % gridCols;

                if (e.shiftKey) {
                    removeRow(r);
                    selectedIndex = null;
                    activeDir = null;
                    updatePropsPanel();
                    draw();
                    return;
                }
                if (e.altKey || e.metaKey) {
                    removeCol(c);
                    selectedIndex = null;
                    activeDir = null;
                    updatePropsPanel();
                    draw();
                    return;
                }

                selectedIndex = pointHit.index;
                dragTarget = pointHit;
                pointerStartPos = { x, y };
                pointerMoved = false;
                pointerDownTime = Date.now();
                canvas.setPointerCapture(e.pointerId);
                updatePropsPanel();
                draw();
                return;
            }

            // Click on empty area → deselect
            selectedIndex = null;
            activeDir = null;
            updatePropsPanel();
            draw();
        });

        canvas.addEventListener('pointermove', (e) => {
            ctrlHeld = e.ctrlKey;
            const { x, y } = getCanvasCoords(e);

            if (dragTarget) {
                pointerMoved = true;
                const j = junctions[dragTarget.index];

                if (dragTarget.type === 'point') {
                    const dx = x - pointerStartPos.x;
                    const dy = y - pointerStartPos.y;
                    j.x += dx;
                    j.y += dy;
                    // Also move all handles with the point (handles are relative offsets, so they stay)
                    pointerStartPos = { x, y };

                } else if (dragTarget.type === 'handle') {
                    const hx = x - j.x;
                    const hy = y - j.y;
                    j.handles[dragTarget.dir] = { x: hx, y: hy };

                    // G¹ smooth: mirror opposite
                    if (j.smooth) {
                        const opp = OPPOSITE[dragTarget.dir];
                        if (opp in j.handles) {
                            j.handles[opp] = { x: -hx, y: -hy };
                        }
                    }
                    activeDir = dragTarget.dir;
                }

                updatePropsPanel();
                draw();
            } else {
                const prevHover = hoverTarget;
                const prevCurve = hoverCurve;

                // Check handle hit first
                hoverTarget = findHandleHit(x, y);
                if (!hoverTarget) hoverTarget = findPointHit(x, y);

                hoverCurve = (ctrlHeld && !hoverTarget) ? findCurveHit(x, y) : null;

                if (hoverTarget) {
                    canvas.style.cursor = 'grab';
                    if (hoverTarget.type === 'point') {
                        const r = Math.floor(hoverTarget.index / gridCols);
                        const c = hoverTarget.index % gridCols;
                        if (e.shiftKey) {
                            statusEl.textContent = 'Click to remove ROW';
                            statusEl.style.opacity = 1;
                        } else if (e.altKey || e.metaKey) {
                            statusEl.textContent = 'Click to remove COLUMN';
                            statusEl.style.opacity = 1;
                        } else {
                            const j = junctions[hoverTarget.index];
                            statusEl.textContent = `α=${j.value.toFixed(3)} · Drag to move · Shift: del row · Alt: del col`;
                            statusEl.style.opacity = 1;
                        }
                    } else {
                        statusEl.textContent = 'Drag to move handle';
                        statusEl.style.opacity = 1;
                    }
                } else if (ctrlHeld && hoverCurve) {
                    canvas.style.cursor = 'copy';
                    statusEl.textContent = 'Ctrl+click to insert junction on curve';
                    statusEl.style.opacity = 1;
                } else if (ctrlHeld) {
                    canvas.style.cursor = 'crosshair';
                    statusEl.textContent = 'Ctrl+click a curve to insert junction';
                    statusEl.style.opacity = 1;
                } else {
                    canvas.style.cursor = 'crosshair';
                    statusEl.style.opacity = 0;
                }

                const changed = JSON.stringify(prevHover) !== JSON.stringify(hoverTarget) ||
                                JSON.stringify(prevCurve) !== JSON.stringify(hoverCurve);
                if (changed) draw();
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            if (dragTarget) {
                canvas.releasePointerCapture(e.pointerId);
            }
            dragTarget = null;
            pointerMoved = false;
        });

        canvas.addEventListener('pointerleave', () => {
            hoverTarget = null;
            hoverCurve = null;
            draw();
        });

        // ---------------------------------------------------------------
        // Controls
        // ---------------------------------------------------------------
        presetSelect.addEventListener('change', () => {
            applyPreset(presetSelect.value);
            updatePropsPanel();
            draw();
        });

        gammaSlider.addEventListener('input', () => {
            gamma = parseFloat(gammaSlider.value);
            gammaValueEl.textContent = gamma.toFixed(2);
            draw();
        });

        btnReset.addEventListener('click', () => {
            applyPreset(presetSelect.value);
            gamma = 0.4545;
            gammaSlider.value = String(gamma);
            gammaValueEl.textContent = gamma.toFixed(2);
            updatePropsPanel();
            draw();
        });

        // ---------------------------------------------------------------
        // Init
        // ---------------------------------------------------------------
        createTestPattern();
        applyPreset('rect');
        updatePropsPanel();
        draw();
    })();
</script>
