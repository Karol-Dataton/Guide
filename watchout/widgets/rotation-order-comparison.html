<div class="interactive-widget" id="rotation-order-widget">
    <style>
        #rotation-order-widget {
            width: 100%;
        }

        #rotation-order-widget .ro-panels {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        #rotation-order-widget .ro-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        #rotation-order-widget .ro-panel-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 6px 6px 0 0;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        #rotation-order-widget .ro-panel-header.ro-watchout {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-primary, #6366f1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-bottom: none;
        }

        #rotation-order-widget .ro-panel-header.ro-alt {
            background: rgba(251, 146, 60, 0.12);
            color: #fb923c;
            border: 1px solid rgba(251, 146, 60, 0.25);
            border-bottom: none;
        }

        #rotation-order-widget .ro-panel-header .ro-badge {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        #rotation-order-widget .ro-watchout .ro-badge {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-primary, #a5b4fc);
        }

        #rotation-order-widget .ro-alt .ro-badge {
            background: rgba(251, 146, 60, 0.2);
            color: #fdba74;
        }

        #rotation-order-widget canvas {
            width: 100%;
            height: 300px;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
            border-radius: 0 0 8px 8px;
            display: block;
        }

        #rotation-order-widget .ro-panel:first-child canvas {
            border: 1px solid rgba(99, 102, 241, 0.18);
            border-top: none;
        }

        #rotation-order-widget .ro-panel:last-child canvas {
            border: 1px solid rgba(251, 146, 60, 0.18);
            border-top: none;
        }

        #rotation-order-widget .ro-controls {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        #rotation-order-widget .ro-slider-group {
            flex: 1;
            min-width: 110px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
        }

        #rotation-order-widget .ro-slider-group label {
            font-size: 0.75rem;
            font-weight: 600;
            pointer-events: none;
        }

        #rotation-order-widget .ro-slider-group[data-axis="x"] label { color: #f87171; }
        #rotation-order-widget .ro-slider-group[data-axis="y"] label { color: #4ade80; }
        #rotation-order-widget .ro-slider-group[data-axis="z"] label { color: #60a5fa; }

        #rotation-order-widget .ro-slider-group input[type=range] {
            width: 100%;
            height: 5px;
            cursor: pointer;
        }

        #rotation-order-widget .ro-slider-group[data-axis="x"] input { accent-color: #f87171; }
        #rotation-order-widget .ro-slider-group[data-axis="y"] input { accent-color: #4ade80; }
        #rotation-order-widget .ro-slider-group[data-axis="z"] input { accent-color: #60a5fa; }

        #rotation-order-widget .ro-val {
            font-size: 0.7rem;
            color: var(--text-muted, #78716c);
            font-variant-numeric: tabular-nums;
        }

        #rotation-order-widget .ro-order-pick {
            min-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(251, 146, 60, 0.15);
            background: rgba(251, 146, 60, 0.04);
        }

        #rotation-order-widget .ro-order-pick label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #fb923c;
            pointer-events: none;
        }

        #rotation-order-widget .ro-order-pick select {
            width: 100%;
            padding: 5px 8px;
            border-radius: 4px;
            background: var(--input-bg, #1c1917);
            border: 1px solid var(--border-subtle, rgba(255,255,255,0.1));
            color: var(--text-primary, #e7e5e4);
            font-size: 0.8rem;
            font-family: monospace;
            cursor: pointer;
        }

        #rotation-order-widget .ro-btn-row {
            display: flex;
            align-items: flex-end;
        }

        #rotation-order-widget .ro-reset-btn {
            padding: 5px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            background: var(--bg-tertiary, #292524);
            color: var(--text-secondary, #a8a29e);
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            align-self: flex-end;
            height: fit-content;
        }

        #rotation-order-widget .ro-reset-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #rotation-order-widget .ro-explain {
            margin-top: 10px;
            min-height: 44px;
            padding: 10px 12px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent-primary, #6366f1);
            font-size: 0.82rem;
            line-height: 1.45;
            color: var(--text-secondary, #a8a29e);
        }

        #rotation-order-widget .ro-explain strong {
            color: var(--text-primary, #e7e5e4);
        }

        #rotation-order-widget .ro-match {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }

        #rotation-order-widget .ro-match.same {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        #rotation-order-widget .ro-match.diff {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        @media (max-width: 680px) {
            #rotation-order-widget .ro-panels {
                flex-direction: column;
            }

            #rotation-order-widget canvas {
                height: 240px;
            }

            #rotation-order-widget .ro-controls {
                flex-direction: column;
            }

            #rotation-order-widget .ro-slider-group {
                min-width: 100%;
            }
        }
    </style>

    <div class="ro-panels">
        <div class="ro-panel">
            <div class="ro-panel-header ro-watchout">
                <span class="ro-badge">WATCHOUT</span>
                <span>Z &rarr; Y &rarr; X</span>
            </div>
            <canvas id="ro-canvas-left" width="800" height="520"></canvas>
        </div>
        <div class="ro-panel">
            <div class="ro-panel-header ro-alt">
                <span class="ro-badge">Compare</span>
                <span id="ro-alt-order-label">X &rarr; Y &rarr; Z</span>
            </div>
            <canvas id="ro-canvas-right" width="800" height="520"></canvas>
        </div>
    </div>

    <div class="ro-controls">
        <div class="ro-slider-group" data-axis="x">
            <label>Rotation X</label>
            <input type="range" id="ro-rx" min="-180" max="180" value="45" step="1">
            <span class="ro-val" id="ro-rx-val">45&deg;</span>
        </div>
        <div class="ro-slider-group" data-axis="y">
            <label>Rotation Y</label>
            <input type="range" id="ro-ry" min="-180" max="180" value="30" step="1">
            <span class="ro-val" id="ro-ry-val">30&deg;</span>
        </div>
        <div class="ro-slider-group" data-axis="z">
            <label>Rotation Z</label>
            <input type="range" id="ro-rz" min="-180" max="180" value="20" step="1">
            <span class="ro-val" id="ro-rz-val">20&deg;</span>
        </div>
        <div class="ro-order-pick">
            <label>Compare Order</label>
            <select id="ro-order-select">
                <option value="XYZ" selected>X &rarr; Y &rarr; Z</option>
                <option value="XZY">X &rarr; Z &rarr; Y</option>
                <option value="YXZ">Y &rarr; X &rarr; Z</option>
                <option value="YZX">Y &rarr; Z &rarr; X</option>
                <option value="ZXY">Z &rarr; X &rarr; Y</option>
                <option value="ZYX">Z &rarr; Y &rarr; X (WATCHOUT)</option>
            </select>
        </div>
        <div class="ro-btn-row">
            <button class="ro-reset-btn" id="ro-reset">Reset</button>
        </div>
    </div>

    <div class="ro-explain" id="ro-explain">
        Both cards receive the <strong>same X, Y, Z values</strong>, but applied in different order.
        When only one axis is non-zero the results are identical. Try combining two or three axes to see how order changes the outcome.
        <span class="ro-match diff" id="ro-match-badge" style="display:none;"></span>
    </div>
</div>

<script>
    (function () {
        /* ---- DOM refs ---- */
        var cL = document.getElementById('ro-canvas-left');
        var cR = document.getElementById('ro-canvas-right');
        if (!cL || !cR) return;
        var ctxL = cL.getContext('2d');
        var ctxR = cR.getContext('2d');
        var LW = cL.width, LH = cL.height;
        var RW = cR.width, RH = cR.height;

        var sRx = document.getElementById('ro-rx');
        var sRy = document.getElementById('ro-ry');
        var sRz = document.getElementById('ro-rz');
        var vRx = document.getElementById('ro-rx-val');
        var vRy = document.getElementById('ro-ry-val');
        var vRz = document.getElementById('ro-rz-val');
        var orderSel = document.getElementById('ro-order-select');
        var altLabel = document.getElementById('ro-alt-order-label');
        var explainEl = document.getElementById('ro-explain');
        var matchBadge = document.getElementById('ro-match-badge');

        /* ---- 3D math ---- */
        var DEG = Math.PI / 180;

        function rotZ(p, a) {
            var c = Math.cos(a), s = Math.sin(a);
            return [c * p[0] - s * p[1], s * p[0] + c * p[1], p[2]];
        }
        function rotY(p, a) {
            var c = Math.cos(a), s = Math.sin(a);
            return [c * p[0] + s * p[2], p[1], -s * p[0] + c * p[2]];
        }
        function rotX(p, a) {
            var c = Math.cos(a), s = Math.sin(a);
            return [p[0], c * p[1] - s * p[2], s * p[1] + c * p[2]];
        }

        var rotFns = { X: rotX, Y: rotY, Z: rotZ };

        function applyOrder(p, order, rx, ry, rz) {
            var vals = { X: rx, Y: ry, Z: rz };
            for (var i = 0; i < order.length; i++) {
                p = rotFns[order[i]](p, vals[order[i]]);
            }
            return p;
        }

        /* ---- Projection ---- */
        var focalLen = 600;

        function projectTo(p, cw, ch) {
            var cx = cw / 2, cy = ch / 2;
            var z = p[2] + focalLen;
            if (z < 1) z = 1;
            var sc = focalLen / z;
            return [cx + p[0] * sc, cy + p[1] * sc, z, sc];
        }

        /* ---- Card geometry ---- */
        var cardW = 140, cardH = 100;
        var verts = [
            [-cardW, -cardH, 0],
            [cardW, -cardH, 0],
            [cardW, cardH, 0],
            [-cardW, cardH, 0]
        ];
        var gridH = 3, gridV = 5;

        function lerp2(a, b, t) {
            return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        }

        /* ---- Draw one card ---- */
        function drawCard(ctx, cw, ch, order, rx, ry, rz, accentColor, accentRgba) {
            ctx.clearRect(0, 0, cw, ch);

            var transformed = verts.map(function (v) { return applyOrder(v, order, rx, ry, rz); });
            var projected = transformed.map(function (v) { return projectTo(v, cw, ch); });

            /* face direction */
            var ax = projected[1][0] - projected[0][0], ay = projected[1][1] - projected[0][1];
            var bx = projected[3][0] - projected[0][0], by = projected[3][1] - projected[0][1];
            var cross = ax * by - ay * bx;
            var isFront = cross > 0;

            /* axis stubs for context */
            var axisLen = 180;
            var axesDef = [
                { dir: [axisLen, 0, 0], color: '#f87171', lbl: 'X' },
                { dir: [0, axisLen, 0], color: '#4ade80', lbl: 'Y' },
                { dir: [0, 0, axisLen], color: '#60a5fa', lbl: 'Z' }
            ];
            axesDef.forEach(function (ad) {
                var tip = applyOrder(ad.dir, order, rx, ry, rz);
                var neg = applyOrder([-ad.dir[0], -ad.dir[1], -ad.dir[2]], order, rx, ry, rz);
                var pt = projectTo(tip, cw, ch);
                var pn = projectTo(neg, cw, ch);
                ctx.strokeStyle = ad.color;
                ctx.globalAlpha = 0.25;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(pn[0], pn[1]);
                ctx.lineTo(pt[0], pt[1]);
                ctx.stroke();

                /* small label */
                var o = projectTo([0, 0, 0], cw, ch);
                var dx = pt[0] - o[0], dy = pt[1] - o[1];
                var ln = Math.sqrt(dx * dx + dy * dy) || 1;
                ctx.globalAlpha = 0.4;
                ctx.fillStyle = ad.color;
                ctx.font = '16px "Futura Now Headline", Futura, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ad.lbl, pt[0] + dx / ln * 14, pt[1] + dy / ln * 14);
                ctx.globalAlpha = 1;
            });

            /* card face */
            ctx.beginPath();
            ctx.moveTo(projected[0][0], projected[0][1]);
            for (var i = 1; i < 4; i++) ctx.lineTo(projected[i][0], projected[i][1]);
            ctx.closePath();

            if (isFront) {
                var grad = ctx.createLinearGradient(projected[0][0], projected[0][1], projected[2][0], projected[2][1]);
                grad.addColorStop(0, accentRgba.replace('A', '0.35'));
                grad.addColorStop(1, accentRgba.replace('A', '0.20'));
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = 'rgba(80, 60, 60, 0.3)';
            }
            ctx.fill();

            ctx.strokeStyle = isFront ? accentColor : 'rgba(120, 100, 100, 0.5)';
            ctx.globalAlpha = isFront ? 0.7 : 0.5;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.globalAlpha = 1;

            /* grid */
            ctx.strokeStyle = isFront ? accentColor : 'rgba(120, 100, 100, 0.3)';
            ctx.globalAlpha = isFront ? 0.18 : 0.12;
            ctx.lineWidth = 1;
            for (var gi = 1; gi < gridH; gi++) {
                var t = gi / gridH;
                var l = lerp2(projected[0], projected[3], t);
                var r = lerp2(projected[1], projected[2], t);
                ctx.beginPath(); ctx.moveTo(l[0], l[1]); ctx.lineTo(r[0], r[1]); ctx.stroke();
            }
            for (var gi = 1; gi < gridV; gi++) {
                var t = gi / gridV;
                var tp = lerp2(projected[0], projected[1], t);
                var bp = lerp2(projected[3], projected[2], t);
                ctx.beginPath(); ctx.moveTo(tp[0], tp[1]); ctx.lineTo(bp[0], bp[1]); ctx.stroke();
            }
            ctx.globalAlpha = 1;

            /* label */
            var lcx = (projected[0][0] + projected[2][0]) / 2;
            var lcy = (projected[0][1] + projected[2][1]) / 2;
            ctx.fillStyle = isFront ? 'rgba(220, 220, 255, 0.75)' : 'rgba(180, 150, 150, 0.5)';
            ctx.font = '22px "Futura Now Headline", Futura, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isFront ? 'FRONT' : 'BACK', lcx, lcy);

            /* corner dots */
            projected.forEach(function (p) {
                ctx.fillStyle = isFront ? accentColor : 'rgba(120,100,100,0.6)';
                ctx.globalAlpha = isFront ? 0.8 : 0.5;
                ctx.beginPath();
                ctx.arc(p[0], p[1], 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            /* return projected corners for comparison */
            return projected;
        }

        /* ---- Order labels ---- */
        var orderLabels = {
            ZYX: 'Z \u2192 Y \u2192 X',
            XYZ: 'X \u2192 Y \u2192 Z',
            XZY: 'X \u2192 Z \u2192 Y',
            YXZ: 'Y \u2192 X \u2192 Z',
            YZX: 'Y \u2192 Z \u2192 X',
            ZXY: 'Z \u2192 X \u2192 Y'
        };

        /* ---- Main draw ---- */
        function draw() {
            var rx = parseFloat(sRx.value) * DEG;
            var ry = parseFloat(sRy.value) * DEG;
            var rz = parseFloat(sRz.value) * DEG;

            vRx.textContent = sRx.value + '\u00B0';
            vRy.textContent = sRy.value + '\u00B0';
            vRz.textContent = sRz.value + '\u00B0';

            var altOrder = orderSel.value; // e.g. "XYZ"
            altLabel.textContent = orderLabels[altOrder] || altOrder;

            /* Left: WATCHOUT order (ZYX) */
            var projL = drawCard(ctxL, LW, LH, 'ZYX', rx, ry, rz,
                'rgba(165, 160, 255, 0.9)', 'rgba(99, 102, 241, A)');

            /* Right: comparison order */
            var projR = drawCard(ctxR, RW, RH, altOrder, rx, ry, rz,
                'rgba(251, 186, 116, 0.9)', 'rgba(251, 146, 60, A)');

            /* Compare: measure max corner deviation in pixels */
            var maxDev = 0;
            for (var i = 0; i < 4; i++) {
                var dx = projL[i][0] - projR[i][0];
                var dy = projL[i][1] - projR[i][1];
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d > maxDev) maxDev = d;
            }

            /* Count non-zero axes */
            var nonZero = (sRx.value !== '0' ? 1 : 0) + (sRy.value !== '0' ? 1 : 0) + (sRz.value !== '0' ? 1 : 0);
            var isWatchoutOrder = altOrder === 'ZYX';

            if (isWatchoutOrder) {
                matchBadge.style.display = 'inline-block';
                matchBadge.className = 'ro-match same';
                matchBadge.textContent = 'IDENTICAL — Same order selected';
            } else if (maxDev < 0.5 || nonZero <= 1) {
                matchBadge.style.display = 'inline-block';
                matchBadge.className = 'ro-match same';
                matchBadge.textContent = nonZero <= 1
                    ? 'IDENTICAL — Only one axis is active, so order has no effect'
                    : 'IDENTICAL';
            } else {
                matchBadge.style.display = 'inline-block';
                matchBadge.className = 'ro-match diff';
                matchBadge.textContent = 'DIFFERENT — Rotation order changes the result';
            }
        }

        /* ---- Events ---- */
        sRx.addEventListener('input', draw);
        sRy.addEventListener('input', draw);
        sRz.addEventListener('input', draw);
        orderSel.addEventListener('change', draw);

        document.getElementById('ro-reset').addEventListener('click', function () {
            sRx.value = 45;
            sRy.value = 30;
            sRz.value = 20;
            orderSel.value = 'XYZ';
            draw();
        });

        /* ---- Init ---- */
        draw();
    })();
</script>
