<div class="interactive-widget" id="key-fill-compositor">
<style>
    #key-fill-compositor {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        width: 100%;
        box-sizing: border-box;
        color: var(--text-primary);
    }
    #key-fill-compositor *, #key-fill-compositor *::before, #key-fill-compositor *::after {
        box-sizing: border-box;
    }

    /* ── Controls row ── */
    .kfc-controls {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        align-items: flex-start;
    }
    .kfc-control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .kfc-label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    /* ── Segmented button group ── */
    .kfc-seg {
        display: flex;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border-subtle);
    }
    .kfc-seg button {
        flex: 1;
        padding: 5px 10px;
        font-size: 0.8rem;
        font-family: inherit;
        cursor: pointer;
        border: none;
        border-right: 1px solid var(--border-subtle);
        background: var(--code-bg);
        color: var(--text-secondary);
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
    }
    .kfc-seg button:last-child { border-right: none; }
    .kfc-seg button.active {
        background: var(--accent-primary);
        color: #fff;
    }
    .kfc-seg button:hover:not(.active) {
        background: var(--border-subtle);
        color: var(--text-primary);
    }

    /* ── Select ── */
    .kfc-select {
        padding: 5px 8px;
        border-radius: 5px;
        border: 1px solid var(--border-subtle);
        background: var(--code-bg);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.82rem;
        cursor: pointer;
    }

    /* ── Toggle row ── */
    .kfc-toggle-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        align-items: center;
    }
    .kfc-toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        user-select: none;
        font-size: 0.85rem;
        color: var(--text-primary);
    }
    .kfc-toggle input[type="checkbox"] { cursor: pointer; }

    /* ── Canvas row ── */
    .kfc-canvas-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
    }
    .kfc-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }
    .kfc-panel-label {
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
    }
    .kfc-panel-label.result {
        color: var(--accent-primary);
    }
    .kfc-canvas {
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
        max-width: 100%;
        height: auto;
        display: block;
    }
    .kfc-canvas.result {
        border: 2px solid var(--accent-primary);
    }
    .kfc-op {
        font-size: 1.5rem;
        color: var(--text-muted, var(--text-secondary));
        padding-top: 28px;
        line-height: 1;
    }

    /* ── Explainer ── */
    .kfc-explainer {
        margin-top: 18px;
        padding: 13px 16px;
        background: var(--code-bg);
        border-left: 3px solid var(--accent-primary);
        border-radius: 0 6px 6px 0;
        font-size: 0.87rem;
        line-height: 1.65;
        color: var(--text-primary);
    }
</style>

<!-- Controls -->
<div class="kfc-controls">
    <div class="kfc-control-group">
        <span class="kfc-label">Keying Mode</span>
        <div class="kfc-seg" id="kfc-mode-btns">
            <button data-mode="luma" class="active">Luma</button>
            <button data-mode="luma-inv">Luma Inverted</button>
            <button data-mode="alpha">Alpha</button>
            <button data-mode="alpha-inv">Alpha Inverted</button>
        </div>
    </div>
    <div class="kfc-control-group">
        <span class="kfc-label">Key Content</span>
        <select class="kfc-select" id="kfc-key-pattern">
            <option value="gradient">Left-to-right gradient</option>
            <option value="radial">Radial spotlight</option>
            <option value="text">Text shape ("KEY")</option>
            <option value="checker">Checkerboard</option>
        </select>
    </div>
    <div class="kfc-control-group">
        <span class="kfc-label">Fill Content</span>
        <select class="kfc-select" id="kfc-fill-pattern">
            <option value="bars">Color bars</option>
            <option value="gradient">Blue gradient</option>
            <option value="solid">Solid orange</option>
            <option value="noise">Noise texture</option>
        </select>
    </div>
</div>

<div class="kfc-toggle-row">
    <label class="kfc-toggle">
        <input type="checkbox" id="kfc-invert"> Fill-side Invert
    </label>
    <label class="kfc-toggle">
        <input type="checkbox" id="kfc-visualize"> Visualize Key (diagnostic)
    </label>
</div>

<!-- Canvas row -->
<div class="kfc-canvas-row">
    <div class="kfc-panel">
        <span class="kfc-panel-label">Key Layer</span>
        <canvas id="kfc-key" class="kfc-canvas" width="180" height="180"></canvas>
    </div>
    <div class="kfc-op">+</div>
    <div class="kfc-panel">
        <span class="kfc-panel-label">Fill Layer</span>
        <canvas id="kfc-fill" class="kfc-canvas" width="180" height="180"></canvas>
    </div>
    <div class="kfc-op">=</div>
    <div class="kfc-panel">
        <span class="kfc-panel-label result">Result</span>
        <canvas id="kfc-result" class="kfc-canvas result" width="180" height="180"></canvas>
    </div>
</div>

<div class="kfc-explainer" id="kfc-explainer"></div>
</div>

<script>
(function () {
    var W = 180, H = 180;

    var keyCanvas    = document.getElementById('kfc-key');
    var fillCanvas   = document.getElementById('kfc-fill');
    var resultCanvas = document.getElementById('kfc-result');
    var explainer    = document.getElementById('kfc-explainer');
    var modeBtns     = document.getElementById('kfc-mode-btns');
    var keyPatSel    = document.getElementById('kfc-key-pattern');
    var fillPatSel   = document.getElementById('kfc-fill-pattern');
    var invertChk    = document.getElementById('kfc-invert');
    var visualizeChk = document.getElementById('kfc-visualize');

    if (!keyCanvas) return;

    var ctxKey    = keyCanvas.getContext('2d');
    var ctxFill   = fillCanvas.getContext('2d');
    var ctxResult = resultCanvas.getContext('2d');

    var mode       = 'luma';
    var keyPat     = 'gradient';
    var fillPat    = 'bars';
    var invertFill = false;
    var visualize  = false;

    /* ── Checkerboard helper ── */
    function drawChecker(ctx, w, h) {
        var sz = 9;
        for (var cy = 0; cy < h; cy += sz) {
            for (var cx = 0; cx < w; cx += sz) {
                var light = ((Math.floor(cx / sz) + Math.floor(cy / sz)) % 2 === 0);
                ctx.fillStyle = light ? '#c8c8c8' : '#909090';
                ctx.fillRect(cx, cy, sz, sz);
            }
        }
    }

    /* ── Build key ImageData ── */
    function buildKeyData(pattern, isAlpha) {
        var id = ctxKey.createImageData(W, H);
        var d  = id.data;
        for (var py = 0; py < H; py++) {
            for (var px = 0; px < W; px++) {
                var i = (py * W + px) * 4;
                var tx = px / (W - 1);
                var ty = py / (H - 1);
                var v  = 0; // 0-255 luminance or alpha value

                if (pattern === 'gradient') {
                    v = Math.round(tx * 255);
                } else if (pattern === 'radial') {
                    var dx = tx - 0.5, dy = ty - 0.5;
                    var dist = Math.sqrt(dx * dx + dy * dy) * 2; // 0 at center, 1 at corner
                    v = Math.round(Math.max(0, 1 - dist) * 255);
                } else if (pattern === 'text') {
                    // We'll use a canvas-drawn text path instead; placeholder filled below
                    v = 0;
                } else if (pattern === 'checker') {
                    var bx = Math.floor(px / 30), by = Math.floor(py / 30);
                    v = ((bx + by) % 2 === 0) ? 255 : 0;
                }

                if (isAlpha) {
                    d[i]     = 160;
                    d[i + 1] = 160;
                    d[i + 2] = 160;
                    d[i + 3] = v;
                } else {
                    d[i]     = v;
                    d[i + 1] = v;
                    d[i + 2] = v;
                    d[i + 3] = 255;
                }
            }
        }
        return id;
    }

    /* ── Draw key layer canvas ── */
    function drawKey() {
        var isAlpha = (mode === 'alpha' || mode === 'alpha-inv');
        drawChecker(ctxKey, W, H);

        if (keyPat === 'text') {
            // Draw white text on black, then composite over checker
            var tmp = document.createElement('canvas');
            tmp.width = W; tmp.height = H;
            var tc = tmp.getContext('2d');
            tc.fillStyle = '#000';
            tc.fillRect(0, 0, W, H);
            tc.fillStyle = isAlpha ? 'rgba(255,255,255,1)' : '#fff';
            tc.font = 'bold 56px sans-serif';
            tc.textAlign = 'center';
            tc.textBaseline = 'middle';
            tc.fillText('KEY', W / 2, H / 2);
            if (isAlpha) {
                // Re-render: black bg fully transparent, text fully opaque
                var id2 = tc.getImageData(0, 0, W, H);
                var dd  = id2.data;
                for (var pi = 0; pi < dd.length; pi += 4) {
                    var lum = dd[pi]; // grayscale — r=g=b
                    dd[pi]     = 160;
                    dd[pi + 1] = 160;
                    dd[pi + 2] = 160;
                    dd[pi + 3] = lum; // alpha = brightness of text
                }
                tc.putImageData(id2, 0, 0);
            }
            ctxKey.drawImage(tmp, 0, 0);
        } else {
            var keyId = buildKeyData(keyPat, isAlpha);
            var tmp2 = document.createElement('canvas');
            tmp2.width = W; tmp2.height = H;
            tmp2.getContext('2d').putImageData(keyId, 0, 0);
            ctxKey.drawImage(tmp2, 0, 0);
        }
    }

    /* ── Build fill ImageData (pre-baked, no alpha) ── */
    function buildFillData(pattern) {
        var id = ctxFill.createImageData(W, H);
        var d  = id.data;
        var rng = 1; // simple seeded pseudo-random
        for (var py = 0; py < H; py++) {
            for (var px = 0; px < W; px++) {
                var i  = (py * W + px) * 4;
                var tx = px / (W - 1);
                var ty = py / (H - 1);
                var r, g, b;

                if (pattern === 'bars') {
                    var barW = W / 6;
                    var bIdx = Math.min(Math.floor(px / barW), 5);
                    var cols = [
                        [220, 50,  50],
                        [50,  180, 50],
                        [50,  100, 220],
                        [220, 200, 50],
                        [200, 50,  200],
                        [50,  200, 200]
                    ];
                    var bright = 0.7 + 0.3 * ty;
                    r = Math.round(cols[bIdx][0] * bright);
                    g = Math.round(cols[bIdx][1] * bright);
                    b = Math.round(cols[bIdx][2] * bright);
                } else if (pattern === 'gradient') {
                    r = Math.round(20 + tx * 30);
                    g = Math.round(80 + ty * 80);
                    b = Math.round(180 + tx * 60);
                } else if (pattern === 'solid') {
                    r = 220; g = 120; b = 30;
                } else if (pattern === 'noise') {
                    // Simple LCG pseudo-random for deterministic noise
                    rng = (rng * 1664525 + 1013904223) & 0xffffffff;
                    var n = ((rng >>> 0) % 80);
                    r = 100 + n;
                    g = 140 + Math.round(tx * 60);
                    b = 160 + Math.round(ty * 40);
                }

                d[i]     = r;
                d[i + 1] = g;
                d[i + 2] = b;
                d[i + 3] = 255;
            }
        }
        return id;
    }

    /* ── Sample key alpha at pixel (px, py) for current mode & pattern ── */
    function sampleKeyAlpha(px, py, keyPixels) {
        var i = (py * W + px) * 4;
        var isAlpha = (mode === 'alpha' || mode === 'alpha-inv');
        var raw;
        if (isAlpha) {
            raw = keyPixels[i + 3] / 255;
        } else {
            // Luma: use the red channel (it's a gray image so r=g=b)
            raw = keyPixels[i] / 255;
        }
        var invert = (mode === 'luma-inv' || mode === 'alpha-inv');
        if (invert) raw = 1 - raw;
        if (invertFill) raw = 1 - raw;
        return Math.max(0, Math.min(1, raw));
    }

    /* ── Extract raw key pixels (after drawing on keyCanvas) ── */
    function getKeyPixels() {
        // We need the actual drawn pixels including the text path
        return ctxKey.getImageData(0, 0, W, H).data;
    }

    /* ── Main render ── */
    function render() {
        // 1. Draw key
        drawKey();

        // 2. Draw fill
        var fillId = buildFillData(fillPat);
        ctxFill.putImageData(fillId, 0, 0);

        // 3. Sample key pixels AFTER drawing
        var keyPx = getKeyPixels();
        var fillPx = fillId.data;

        // 4. Compose result
        var resultId = ctxResult.createImageData(W, H);
        var rd = resultId.data;

        for (var py = 0; py < H; py++) {
            for (var px = 0; px < W; px++) {
                var i = (py * W + px) * 4;
                var ka = sampleKeyAlpha(px, py, keyPx);

                if (visualize) {
                    // Diagnostic: show mask as white=opaque, black=transparent
                    var mv = Math.round(ka * 255);
                    rd[i]     = mv;
                    rd[i + 1] = mv;
                    rd[i + 2] = mv;
                    rd[i + 3] = 255;
                } else {
                    rd[i]     = fillPx[i];
                    rd[i + 1] = fillPx[i + 1];
                    rd[i + 2] = fillPx[i + 2];
                    rd[i + 3] = Math.round(ka * 255);
                }
            }
        }

        if (visualize) {
            ctxResult.putImageData(resultId, 0, 0);
        } else {
            drawChecker(ctxResult, W, H);
            var tmp = document.createElement('canvas');
            tmp.width = W; tmp.height = H;
            tmp.getContext('2d').putImageData(resultId, 0, 0);
            ctxResult.drawImage(tmp, 0, 0);
        }

        // 5. Update explainer
        updateExplainer();
    }

    /* ── Explainer text ── */
    function updateExplainer() {
        var modeText = {
            'luma':     '<strong>Luma</strong> — the key layer\'s brightness drives opacity. Bright pixels in the key → opaque fill; dark pixels → transparent fill.',
            'luma-inv': '<strong>Luma Inverted</strong> — the key layer\'s luminance is inverted before masking. Dark pixels in the key → opaque fill; bright pixels → transparent fill.',
            'alpha':    '<strong>Alpha</strong> — the key layer\'s own alpha channel is used as the mask, ignoring its RGB color entirely. Opaque areas of the key → opaque fill.',
            'alpha-inv':'<strong>Alpha Inverted</strong> — the key layer\'s alpha channel is inverted. Transparent areas of the key → opaque fill; opaque areas → transparent fill.'
        };
        var patText = {
            'gradient': 'a left-to-right luminance gradient',
            'radial':   'a radial spotlight (bright center, dark edges)',
            'text':     'a text shape — any content can act as a key, including text',
            'checker':  'a hard-edged checkerboard pattern'
        };
        var extras = [];
        if (invertFill) extras.push('<strong>Fill-side Invert</strong> is on, flipping the mask at the cue level independently of the key mode.');
        if (visualize)  extras.push('<strong>Visualize Key</strong> is on — the result shows the raw mask (white = opaque region, black = transparent region) rather than the composited output.');

        var html = modeText[mode] + ' The key layer contains ' + patText[keyPat] + '.';
        if (extras.length) html += '<br><br>' + extras.join('<br>');
        explainer.innerHTML = html;
    }

    /* ── Event wiring ── */
    modeBtns.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-mode]');
        if (!btn) return;
        mode = btn.dataset.mode;
        modeBtns.querySelectorAll('button').forEach(function (b) {
            b.classList.toggle('active', b === btn);
        });
        render();
    });

    keyPatSel.addEventListener('change', function () {
        keyPat = this.value;
        render();
    });

    fillPatSel.addEventListener('change', function () {
        fillPat = this.value;
        render();
    });

    invertChk.addEventListener('change', function () {
        invertFill = this.checked;
        render();
    });

    visualizeChk.addEventListener('change', function () {
        visualize = this.checked;
        render();
    });

    render();
})();
</script>
