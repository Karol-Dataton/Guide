<div class="interactive-widget" id="pbp-widget">
<style>
    #pbp-widget {
        width: 100%;
        font-family: var(--font-family, system-ui, sans-serif);
    }

    #pbp-widget .pbp-layout {
        display: flex;
        gap: 14px;
        align-items: flex-start;
    }

    #pbp-widget .pbp-canvas-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #pbp-widget canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        border: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
        cursor: crosshair;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #pbp-widget .pbp-btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    #pbp-widget .pbp-btn {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle, rgba(255,255,255,0.12));
        background: rgba(255,255,255,0.04);
        color: var(--text-primary, #e8e8f0);
        cursor: pointer;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        transition: background 150ms ease, border-color 150ms ease;
    }

    #pbp-widget .pbp-btn:hover {
        background: rgba(107,37,221,0.15);
        border-color: var(--accent-primary, #6B25DD);
    }

    #pbp-widget .pbp-btn.pbp-btn-active {
        background: rgba(107,37,221,0.25);
        border-color: var(--accent-primary, #6B25DD);
        color: #c4a0ff;
    }

    #pbp-widget .pbp-btn-danger {
        background: rgba(239,68,68,0.08);
        border-color: rgba(239,68,68,0.25);
        color: #f87171;
    }

    #pbp-widget .pbp-btn-danger:hover {
        background: rgba(239,68,68,0.2);
        border-color: rgba(239,68,68,0.5);
    }

    #pbp-widget .pbp-btn-danger:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    #pbp-widget .pbp-info {
        padding: 7px 12px;
        border-radius: 6px;
        background: rgba(107,37,221,0.06);
        border-left: 3px solid var(--accent-primary, #6B25DD);
        font-size: 0.78rem;
        line-height: 1.45;
        color: var(--text-secondary, #9090a8);
        min-height: 32px;
        margin-top: 12px;
    }

    #pbp-widget .pbp-props {
        width: 188px;
        flex-shrink: 0;
        border-radius: 10px;
        border: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
        background: var(--bg-secondary, #1a1a2e);
        padding: 12px;
        font-size: 0.82rem;
        color: var(--text-primary, #e8e8f0);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    #pbp-widget .pbp-props-header {
        font-weight: 700;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary, #9090a8);
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
    }

    #pbp-widget .pbp-props-title {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-primary, #e8e8f0);
    }

    #pbp-widget .pbp-check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 5px 7px;
        border-radius: 5px;
        border: 1px solid transparent;
        transition: background 120ms, border-color 120ms;
    }

    #pbp-widget .pbp-check-row:hover {
        background: rgba(107,37,221,0.1);
        border-color: rgba(107,37,221,0.2);
    }

    #pbp-widget .pbp-check-row input[type=checkbox] {
        accent-color: var(--accent-primary, #6B25DD);
        width: 14px;
        height: 14px;
        cursor: pointer;
        flex-shrink: 0;
    }

    #pbp-widget .pbp-check-label {
        font-size: 0.82rem;
        color: var(--text-primary, #e8e8f0);
        line-height: 1.3;
    }

    #pbp-widget .pbp-check-row.pbp-locked {
        opacity: 0.35;
        pointer-events: none;
    }

    #pbp-widget .pbp-props-empty {
        color: var(--text-secondary, #9090a8);
        font-size: 0.8rem;
        font-style: italic;
        text-align: center;
        padding: 16px 0;
    }

    #pbp-widget .pbp-divider {
        border: none;
        border-top: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
        margin: 0;
    }

    @media (max-width: 680px) {
        #pbp-widget .pbp-layout {
            flex-direction: column;
        }
        #pbp-widget .pbp-props {
            width: 100%;
        }
    }
</style>

<div class="pbp-layout">
    <!-- Left: canvas + buttons + info -->
    <div class="pbp-canvas-col">
        <canvas id="pbp-canvas" width="700" height="460"></canvas>
        <div class="pbp-btn-row">
            <button class="pbp-btn" id="pbp-play-btn">Play</button>
            <button class="pbp-btn pbp-btn-danger" id="pbp-clear-btn">Clear All</button>
        </div>
        <div class="pbp-info" id="pbp-info">Click empty area to add a point. Drag points or handles to reshape the path.</div>
    </div>

    <!-- Right: properties panel -->
    <div class="pbp-props" id="pbp-props">
        <div class="pbp-props-header">Point Properties</div>
        <div class="pbp-props-empty" id="pbp-props-empty">No point selected.<br>Click a point to inspect it.</div>

        <div id="pbp-props-content" style="display:none; display:flex; flex-direction:column; gap:8px;">
            <div class="pbp-props-title" id="pbp-props-title">Point 1 of 3</div>

            <hr class="pbp-divider">

            <label class="pbp-check-row" id="pbp-linked-row">
                <input type="checkbox" id="pbp-linked-chk">
                <span class="pbp-check-label">Linked Handles</span>
            </label>

            <label class="pbp-check-row" id="pbp-smooth-in-row">
                <input type="checkbox" id="pbp-smooth-in-chk">
                <span class="pbp-check-label">Smooth In</span>
            </label>

            <label class="pbp-check-row" id="pbp-smooth-out-row">
                <input type="checkbox" id="pbp-smooth-out-chk">
                <span class="pbp-check-label">Smooth Out</span>
            </label>

            <hr class="pbp-divider">

            <button class="pbp-btn pbp-btn-danger" id="pbp-delete-btn" style="width:100%;">Delete Point</button>
        </div>
    </div>
</div>

<script>
(function() {
    var canvas = document.getElementById('pbp-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');

    var playBtn    = document.getElementById('pbp-play-btn');
    var clearBtn   = document.getElementById('pbp-clear-btn');
    var infoEl     = document.getElementById('pbp-info');
    var propsEmpty = document.getElementById('pbp-props-empty');
    var propsContent = document.getElementById('pbp-props-content');
    var propsTitle = document.getElementById('pbp-props-title');
    var linkedChk   = document.getElementById('pbp-linked-chk');
    var smoothInChk = document.getElementById('pbp-smooth-in-chk');
    var smoothOutChk= document.getElementById('pbp-smooth-out-chk');
    var linkedRow   = document.getElementById('pbp-linked-row');
    var smoothInRow = document.getElementById('pbp-smooth-in-row');
    var smoothOutRow= document.getElementById('pbp-smooth-out-row');
    var deleteBtn   = document.getElementById('pbp-delete-btn');

    // ── constants ──────────────────────────────────────────────────────────
    var W = 700, H = 460;
    var MAX_POINTS = 6;
    var ACCENT = '#6B25DD';
    var ACCENT_GLOW = 'rgba(107,37,221,0.45)';
    var GOLD = '#f5c842';
    var HIT_POINT   = 12;
    var HIT_HANDLE  = 8;

    // ── data ───────────────────────────────────────────────────────────────
    var pts = [];   // array of point objects
    var sel = -1;   // selected point index
    var playing = false;
    var playT = 0;
    var playStart = 0;
    var playRAF = 0;
    var PLAY_DURATION = 3000; // ms

    // drag state
    var dragging = false;
    var dragWhat = null; // 'point', 'handleIn', 'handleOut'
    var dragIdx  = -1;
    var hoveredPt = -1;
    var hoveredHandle = null; // 'in' | 'out' | null

    // ── init ───────────────────────────────────────────────────────────────
    function makePoint(x, y, prevPt, nextPt) {
        var pt = { x: x, y: y, smoothIn: true, smoothOut: true, linked: true,
                   handleIn:  { x: x - 60, y: y },
                   handleOut: { x: x + 60, y: y } };
        if (prevPt) {
            pt.handleIn.x  = x + (prevPt.x - x) * 0.33;
            pt.handleIn.y  = y + (prevPt.y - y) * 0.33;
        }
        if (nextPt) {
            pt.handleOut.x = x + (nextPt.x - x) * 0.33;
            pt.handleOut.y = y + (nextPt.y - y) * 0.33;
        }
        return pt;
    }

    function initPoints() {
        // 3-point gentle S-curve
        var p1 = { x: 120, y: 300, smoothIn: true, smoothOut: true, linked: true,
                   handleIn:  { x: 60,  y: 320 },
                   handleOut: { x: 220, y: 200 } };
        var p2 = { x: 350, y: 230, smoothIn: true, smoothOut: true, linked: true,
                   handleIn:  { x: 250, y: 260 },
                   handleOut: { x: 450, y: 200 } };
        var p3 = { x: 580, y: 160, smoothIn: true, smoothOut: true, linked: true,
                   handleIn:  { x: 480, y: 200 },
                   handleOut: { x: 640, y: 140 } };
        pts = [p1, p2, p3];
        sel = -1;
    }

    initPoints();

    // ── math helpers ──────────────────────────────────────────────────────
    function dist(ax, ay, bx, by) {
        var dx = ax - bx, dy = ay - by;
        return Math.sqrt(dx*dx + dy*dy);
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    // Cubic bezier point
    function cubicBezier(p0, p1, p2, p3, t) {
        var mt = 1 - t;
        return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
    }

    // Chord-length parameterisation: returns canvas {x,y} for global t in [0,1]
    function pathPoint(globalT) {
        if (pts.length < 2) return { x: pts[0].x, y: pts[0].y };
        // compute segment chord lengths
        var STEPS = 20;
        var segs = pts.length - 1;
        var segLens = [];
        var total = 0;
        for (var s = 0; s < segs; s++) {
            var a = pts[s], b = pts[s+1];
            var cp1x = a.smoothOut ? a.handleOut.x : a.x;
            var cp1y = a.smoothOut ? a.handleOut.y : a.y;
            var cp2x = b.smoothIn  ? b.handleIn.x  : b.x;
            var cp2y = b.smoothIn  ? b.handleIn.y  : b.y;
            var len = 0, px = a.x, py = a.y;
            for (var i = 1; i <= STEPS; i++) {
                var tt = i / STEPS;
                var nx = cubicBezier(a.x, cp1x, cp2x, b.x, tt);
                var ny = cubicBezier(a.y, cp1y, cp2y, b.y, tt);
                len += dist(px, py, nx, ny);
                px = nx; py = ny;
            }
            segLens.push(len);
            total += len;
        }
        if (total === 0) return { x: pts[0].x, y: pts[0].y };

        var target = globalT * total;
        var acc = 0;
        for (var s = 0; s < segs; s++) {
            if (acc + segLens[s] >= target || s === segs - 1) {
                var localT = segLens[s] > 0 ? (target - acc) / segLens[s] : 0;
                localT = Math.max(0, Math.min(1, localT));
                var a = pts[s], b = pts[s+1];
                var cp1x = a.smoothOut ? a.handleOut.x : a.x;
                var cp1y = a.smoothOut ? a.handleOut.y : a.y;
                var cp2x = b.smoothIn  ? b.handleIn.x  : b.x;
                var cp2y = b.smoothIn  ? b.handleIn.y  : b.y;
                return {
                    x: cubicBezier(a.x, cp1x, cp2x, b.x, localT),
                    y: cubicBezier(a.y, cp1y, cp2y, b.y, localT)
                };
            }
            acc += segLens[s];
        }
        return { x: pts[pts.length-1].x, y: pts[pts.length-1].y };
    }

    // ── drawing ───────────────────────────────────────────────────────────
    function draw() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();
        drawGrid();
        drawWatermark();
        drawPath();
        if (sel >= 0) drawHandles(sel);
        drawPoints();
        if (playing && pts.length >= 2) drawMovingDot();
    }

    function drawBackground() {
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0a0a1a');
        grad.addColorStop(1, '#111126');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }

    function drawGrid() {
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        var step = 40;
        ctx.beginPath();
        for (var x = 0; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
        for (var y = 0; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();
    }

    function drawWatermark() {
        ctx.save();
        ctx.font = 'bold 72px var(--font-family, system-ui)';
        ctx.fillStyle = 'rgba(255,255,255,0.025)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('STAGE', W/2, H/2);
        ctx.restore();
    }

    function drawPath() {
        if (pts.length < 2) return;
        ctx.save();
        ctx.strokeStyle = 'rgba(107,37,221,0.7)';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = 'rgba(107,37,221,0.4)';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (var i = 0; i < pts.length - 1; i++) {
            var a = pts[i], b = pts[i+1];
            var cp1x = a.smoothOut ? a.handleOut.x : a.x;
            var cp1y = a.smoothOut ? a.handleOut.y : a.y;
            var cp2x = b.smoothIn  ? b.handleIn.x  : b.x;
            var cp2y = b.smoothIn  ? b.handleIn.y  : b.y;
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, b.x, b.y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawHandles(idx) {
        var pt = pts[idx];
        ctx.save();
        // draw stems + handle dots
        var handles = [];
        if (idx > 0 && pt.smoothIn)   handles.push({ key:'in',  hx: pt.handleIn.x,  hy: pt.handleIn.y });
        if (idx < pts.length-1 && pt.smoothOut) handles.push({ key:'out', hx: pt.handleOut.x, hy: pt.handleOut.y });

        for (var h = 0; h < handles.length; h++) {
            var hd = handles[h];
            var isHovH = (hoveredHandle === hd.key && hoveredPt === idx);
            var isDragH = (dragging && dragWhat === 'handle' + hd.key && dragIdx === idx);
            var active = isHovH || isDragH;

            // stem
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
            ctx.lineTo(hd.hx, hd.hy);
            ctx.strokeStyle = active ? 'rgba(245,200,66,0.7)' : 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            // handle dot
            ctx.beginPath();
            ctx.arc(hd.hx, hd.hy, active ? 6 : 5, 0, Math.PI*2);
            ctx.fillStyle = active ? GOLD : 'rgba(255,255,255,0.65)';
            if (active) {
                ctx.shadowColor = GOLD;
                ctx.shadowBlur = 8;
            }
            ctx.fill();
            ctx.strokeStyle = active ? GOLD : 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    }

    function drawPoints() {
        for (var i = 0; i < pts.length; i++) {
            var pt = pts[i];
            var isSel  = (i === sel);
            var isHov  = (i === hoveredPt && !dragging);
            var isDrag = (dragging && dragWhat === 'point' && dragIdx === i);

            ctx.save();

            // glow for hover / selected
            if (isSel || isHov || isDrag) {
                ctx.shadowColor = ACCENT_GLOW;
                ctx.shadowBlur  = 14;
            }

            // outer ring for selected
            if (isSel || isDrag) {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 13, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(107,37,221,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // main dot
            var r = isSel || isDrag ? 9 : isHov ? 8 : 7;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, r, 0, Math.PI*2);
            ctx.fillStyle = isSel || isDrag ? '#9B5DFF' : ACCENT;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.restore();

            // label
            ctx.save();
            ctx.font = 'bold 11px var(--font-family, system-ui)';
            ctx.fillStyle = isSel ? '#c4a0ff' : 'rgba(255,255,255,0.55)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(String(i + 1), pt.x, pt.y - 11);
            ctx.restore();
        }
    }

    function drawMovingDot() {
        var pp = pathPoint(playT);
        ctx.save();
        ctx.shadowColor = '#f5c842';
        ctx.shadowBlur  = 18;
        ctx.beginPath();
        ctx.arc(pp.x, pp.y, 8, 0, Math.PI*2);
        ctx.fillStyle = GOLD;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    // ── playback ──────────────────────────────────────────────────────────
    function startPlay() {
        if (pts.length < 2) { setInfo('Add at least 2 points before playing.'); return; }
        playing  = true;
        playT    = 0;
        playStart = performance.now();
        playBtn.textContent = 'Stop';
        playBtn.classList.add('pbp-btn-active');
        setInfo('Playing path preview…');
        playFrame();
    }

    function stopPlay() {
        playing = false;
        cancelAnimationFrame(playRAF);
        playBtn.textContent = 'Play';
        playBtn.classList.remove('pbp-btn-active');
        setInfo(sel >= 0 ? 'Point ' + (sel+1) + ' selected. Drag to reposition.' : 'Click empty area to add a point. Drag points or handles to reshape the path.');
        draw();
    }

    function playFrame() {
        var now = performance.now();
        playT = Math.min(1, (now - playStart) / PLAY_DURATION);
        draw();
        if (playT < 1) {
            playRAF = requestAnimationFrame(playFrame);
        } else {
            // bounce back immediately
            playStart = performance.now();
            playT = 0;
            playRAF = requestAnimationFrame(playFrame);
        }
    }

    // ── hit testing ───────────────────────────────────────────────────────
    function hitHandle(mx, my, idx) {
        if (idx < 0 || idx >= pts.length) return null;
        var pt = pts[idx];
        if (idx > 0 && pt.smoothIn && dist(mx, my, pt.handleIn.x, pt.handleIn.y) <= HIT_HANDLE)
            return 'handlein';
        if (idx < pts.length-1 && pt.smoothOut && dist(mx, my, pt.handleOut.x, pt.handleOut.y) <= HIT_HANDLE)
            return 'handleout';
        return null;
    }

    function hitPoint(mx, my) {
        for (var i = 0; i < pts.length; i++) {
            if (dist(mx, my, pts[i].x, pts[i].y) <= HIT_POINT) return i;
        }
        return -1;
    }

    // ── handle mirroring ──────────────────────────────────────────────────
    function mirrorHandle(idx, moved) {
        var pt = pts[idx];
        if (!pt.linked) return;
        if (moved === 'handleout') {
            // mirror in = reflect out through pt
            pt.handleIn.x = 2*pt.x - pt.handleOut.x;
            pt.handleIn.y = 2*pt.y - pt.handleOut.y;
        } else {
            pt.handleOut.x = 2*pt.x - pt.handleIn.x;
            pt.handleOut.y = 2*pt.y - pt.handleIn.y;
        }
    }

    // ── pointer events ────────────────────────────────────────────────────
    function canvasXY(e) {
        var rect = canvas.getBoundingClientRect();
        var scaleX = W / rect.width;
        var scaleY = H / rect.height;
        var src = e.touches ? e.touches[0] : e;
        return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        var pos = canvasXY(e);
        var mx = pos.x, my = pos.y;

        // 1. handles of selected point
        if (sel >= 0) {
            var h = hitHandle(mx, my, sel);
            if (h) {
                dragging = true;
                dragWhat = h;   // 'handlein' | 'handleout'
                dragIdx  = sel;
                hoveredHandle = null;
                draw();
                return;
            }
        }

        // 2. any point
        var pi = hitPoint(mx, my);
        if (pi >= 0) {
            sel = pi;
            dragging = true;
            dragWhat = 'point';
            dragIdx  = pi;
            updatePanel();
            draw();
            return;
        }

        // 3. empty space → add point
        if (pts.length < MAX_POINTS) {
            var prev = pts[pts.length - 1];
            var np = makePoint(mx, my, prev, null);
            // fix prev handleOut toward new point
            prev.handleOut.x = prev.x + (mx - prev.x) * 0.33;
            prev.handleOut.y = prev.y + (my - prev.y) * 0.33;
            pts.push(np);
            sel = pts.length - 1;
            updatePanel();
            setInfo('Added point ' + pts.length + '. ' + (pts.length < MAX_POINTS ? (MAX_POINTS - pts.length) + ' more can be added.' : 'Maximum points reached.'));
            draw();
        } else {
            setInfo('Maximum of ' + MAX_POINTS + ' points reached. Delete a point to add another.');
        }
    });

    canvas.addEventListener('pointermove', function(e) {
        e.preventDefault();
        var pos = canvasXY(e);
        var mx = pos.x, my = pos.y;

        if (dragging) {
            if (dragWhat === 'point') {
                var pt = pts[dragIdx];
                var dx = mx - pt.x, dy = my - pt.y;
                pt.x = mx; pt.y = my;
                // move handles with point
                pt.handleIn.x  += dx; pt.handleIn.y  += dy;
                pt.handleOut.x += dx; pt.handleOut.y += dy;
                setInfo('Point ' + (dragIdx+1) + ': (' + Math.round(mx) + ', ' + Math.round(my) + ')');
            } else if (dragWhat === 'handlein') {
                pts[dragIdx].handleIn.x = mx;
                pts[dragIdx].handleIn.y = my;
                mirrorHandle(dragIdx, 'handlein');
                setInfo('Handle In of point ' + (dragIdx+1));
            } else if (dragWhat === 'handleout') {
                pts[dragIdx].handleOut.x = mx;
                pts[dragIdx].handleOut.y = my;
                mirrorHandle(dragIdx, 'handleout');
                setInfo('Handle Out of point ' + (dragIdx+1));
            }
            draw();
            return;
        }

        // hover detection
        var newHovPt = -1;
        var newHovH  = null;

        if (sel >= 0) {
            var h = hitHandle(mx, my, sel);
            if (h) {
                newHovH  = h === 'handlein' ? 'in' : 'out';
                newHovPt = sel;
                canvas.style.cursor = 'grab';
            }
        }

        if (!newHovH) {
            var pi = hitPoint(mx, my);
            if (pi >= 0) {
                newHovPt = pi;
                canvas.style.cursor = 'grab';
            } else {
                canvas.style.cursor = pts.length < MAX_POINTS ? 'crosshair' : 'default';
            }
        }

        if (newHovPt !== hoveredPt || newHovH !== hoveredHandle) {
            hoveredPt = newHovPt;
            hoveredHandle = newHovH;
            draw();
        }
    });

    canvas.addEventListener('pointerup', function(e) {
        if (dragging) {
            dragging  = false;
            dragWhat  = null;
            dragIdx   = -1;
            updatePanel();
            setInfo(sel >= 0 ? 'Point ' + (sel+1) + ' selected.' : 'Click empty area to add a point.');
            draw();
        }
    });

    canvas.addEventListener('pointerleave', function() {
        hoveredPt = -1;
        hoveredHandle = null;
        if (!dragging) draw();
    });

    // ── properties panel ──────────────────────────────────────────────────
    function updatePanel() {
        if (sel < 0 || sel >= pts.length) {
            propsEmpty.style.display = '';
            propsContent.style.display = 'none';
            deleteBtn.disabled = true;
            return;
        }
        var pt = pts[sel];
        propsEmpty.style.display = 'none';
        propsContent.style.display = 'flex';
        propsTitle.textContent = 'Point ' + (sel+1) + ' of ' + pts.length;

        linkedChk.checked   = pt.linked;
        smoothInChk.checked  = pt.smoothIn;
        smoothOutChk.checked = pt.smoothOut;

        // lock smooth in/out when linked
        var locked = pt.linked;
        smoothInRow.classList.toggle('pbp-locked', locked);
        smoothOutRow.classList.toggle('pbp-locked', locked);

        // only show handleIn row if not first point, handleOut if not last
        smoothInRow.style.visibility  = (sel > 0)              ? '' : 'hidden';
        smoothOutRow.style.visibility = (sel < pts.length - 1) ? '' : 'hidden';

        deleteBtn.disabled = pts.length <= 2;
    }

    linkedChk.addEventListener('change', function() {
        if (sel < 0) return;
        pts[sel].linked = linkedChk.checked;
        if (linkedChk.checked) {
            pts[sel].smoothIn  = true;
            pts[sel].smoothOut = true;
            // re-mirror so handles are consistent
            mirrorHandle(sel, 'handleout');
        }
        updatePanel();
        draw();
    });

    smoothInChk.addEventListener('change', function() {
        if (sel < 0 || pts[sel].linked) return;
        pts[sel].smoothIn = smoothInChk.checked;
        draw();
    });

    smoothOutChk.addEventListener('change', function() {
        if (sel < 0 || pts[sel].linked) return;
        pts[sel].smoothOut = smoothOutChk.checked;
        draw();
    });

    deleteBtn.addEventListener('click', function() {
        if (sel < 0 || pts.length <= 2) return;
        pts.splice(sel, 1);
        sel = Math.min(sel, pts.length - 1);
        updatePanel();
        setInfo('Point deleted. ' + pts.length + ' points remain.');
        draw();
    });

    // ── toolbar buttons ───────────────────────────────────────────────────
    playBtn.addEventListener('click', function() {
        if (playing) stopPlay(); else startPlay();
    });

    clearBtn.addEventListener('click', function() {
        stopPlay();
        initPoints();
        updatePanel();
        setInfo('Reset to default path.');
        draw();
    });

    // ── info bar ─────────────────────────────────────────────────────────
    function setInfo(msg) {
        infoEl.textContent = msg;
    }

    // ── initial render ────────────────────────────────────────────────────
    updatePanel();
    draw();
})();
</script>
</div>
