<div class="interactive-widget" id="warp-geometry-widget">
    <div class="widget-controls"
        style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;">
        <div class="control-group" style="display: flex; align-items: center; gap: 8px;">
            <label style="font-weight: 500; white-space: nowrap;">Grid</label>
            <select id="warp-grid-select"
                style="padding: 6px 10px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); font-family: var(--font-family);">
                <option value="3">3 × 3</option>
                <option value="4" selected>4 × 4</option>
                <option value="5">5 × 5</option>
                <option value="6">6 × 6</option>
            </select>
        </div>
        <div class="control-group" style="display: flex; align-items: center; gap: 8px;">
            <label style="font-weight: 500; white-space: nowrap;">Texture</label>
            <select id="warp-texture-select"
                style="padding: 6px 10px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); font-family: var(--font-family);">
                <option value="grid">Grid Pattern</option>
                <option value="image">Image Overlay</option>
            </select>
        </div>

        <div class="control-group" style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button id="warp-preset-barrel" class="warp-btn"
                style="padding: 6px 12px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); cursor: pointer; font-family: var(--font-family); font-size: 0.85rem; transition: all 150ms ease;">Barrel</button>
            <button id="warp-preset-pincushion" class="warp-btn"
                style="padding: 6px 12px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); cursor: pointer; font-family: var(--font-family); font-size: 0.85rem; transition: all 150ms ease;">Pincushion</button>
            <button id="warp-preset-keystone" class="warp-btn"
                style="padding: 6px 12px; border-radius: 6px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); cursor: pointer; font-family: var(--font-family); font-size: 0.85rem; transition: all 150ms ease;">Keystone</button>
            <button id="warp-reset" class="warp-btn"
                style="padding: 6px 12px; border-radius: 6px; background: var(--accent-primary); border: 1px solid transparent; color: #fff; cursor: pointer; font-family: var(--font-family); font-size: 0.85rem; font-weight: 600; transition: all 150ms ease;">Reset</button>
        </div>
    </div>

    <div
        style="position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--bg-tertiary);">
        <canvas id="warp-canvas" width="700" height="500"
            style="width: 100%; height: auto; display: block; cursor: crosshair; touch-action: none;"></canvas>
    </div>

    <div
        style="margin-top: 12px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-secondary);">
        <span style="display: flex; align-items: center; gap: 6px;">
            <span
                style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-primary);"></span>
            Control Point (drag to warp)
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 12px; height: 3px; background: rgba(167, 139, 250, 0.6);"></span>
            Warp Mesh
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 12px; height: 3px; background: rgba(255,255,255,0.15);"></span>
            Original Grid (reference)
        </span>
        <span style="margin-left: auto; font-size: 0.75rem; opacity: 0.7;">
            Image: <a href="https://commons.wikimedia.org/wiki/File:Gamla_Link%C3%B6ping_11.jpg" target="_blank"
                style="color: inherit; text-decoration: underline;">Gamla Linköping</a>
        </span>
    </div>
</div>

<script>
    (function () {
        const canvas = document.getElementById('warp-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const gridSelect = document.getElementById('warp-grid-select');
        const textureSelect = document.getElementById('warp-texture-select');
        const btnBarrel = document.getElementById('warp-preset-barrel');
        const btnPincushion = document.getElementById('warp-preset-pincushion');
        const btnKeystone = document.getElementById('warp-preset-keystone');
        const btnReset = document.getElementById('warp-reset');

        const W = canvas.width;
        const H = canvas.height;
        const PAD = 40; // padding from canvas edge

        let gridSize = 4;
        let controlPoints = []; // flat array of {x, y}
        let defaultPoints = [];
        let dragIndex = -1;
        let hoverIndex = -1;

        // --- Checkerboard test pattern (cached) ---
        let patternCanvas = null;
        let imageTexture = null;
        let useImage = false;

        function createTestPattern() {
            patternCanvas = document.createElement('canvas');
            patternCanvas.width = W;
            patternCanvas.height = H;
            const pctx = patternCanvas.getContext('2d');

            const cols = 16;
            const rows = 12;
            const cw = W / cols;
            const ch = H / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const isDark = (r + c) % 2 === 0;
                    pctx.fillStyle = isDark ? '#1e293b' : '#334155';
                    pctx.fillRect(c * cw, r * ch, cw, ch);
                }
            }

            // Draw some colored reference lines
            pctx.strokeStyle = 'rgba(99, 102, 241, 0.3)';
            pctx.lineWidth = 1;
            // Horizontal center
            pctx.beginPath();
            pctx.moveTo(0, H / 2);
            pctx.lineTo(W, H / 2);
            pctx.stroke();
            // Vertical center
            pctx.beginPath();
            pctx.moveTo(W / 2, 0);
            pctx.lineTo(W / 2, H);
            pctx.stroke();

            // Edge crosshairs
            pctx.strokeStyle = 'rgba(239, 68, 68, 0.25)';
            pctx.beginPath();
            pctx.moveTo(0, 0); pctx.lineTo(W, H);
            pctx.moveTo(W, 0); pctx.lineTo(0, H);
            pctx.stroke();
        }

        function loadImage() {
            if (imageTexture) return; // already loaded
            const img = new Image();
            img.onload = () => {
                imageTexture = img;
                if (useImage) draw();
            };
            img.src = '../media/gamla.png';
        }

        // --- Grid management ---
        function initGrid(size) {
            gridSize = size;
            controlPoints = [];
            defaultPoints = [];
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const x = PAD + (col / (gridSize - 1)) * (W - 2 * PAD);
                    const y = PAD + (row / (gridSize - 1)) * (H - 2 * PAD);
                    controlPoints.push({ x, y });
                    defaultPoints.push({ x, y });
                }
            }
        }

        function resetGrid() {
            for (let i = 0; i < controlPoints.length; i++) {
                controlPoints[i].x = defaultPoints[i].x;
                controlPoints[i].y = defaultPoints[i].y;
            }
        }

        // --- Presets ---
        function applyBarrel(strength) {
            resetGrid();
            const cx = W / 2;
            const cy = H / 2;
            const maxR = Math.sqrt(cx * cx + cy * cy);
            for (let i = 0; i < controlPoints.length; i++) {
                const dx = defaultPoints[i].x - cx;
                const dy = defaultPoints[i].y - cy;
                const r = Math.sqrt(dx * dx + dy * dy);
                const nr = r / maxR;
                const factor = 1 + strength * nr * nr;
                controlPoints[i].x = cx + dx * factor;
                controlPoints[i].y = cy + dy * factor;
            }
        }

        function applyPincushion(strength) {
            resetGrid();
            const cx = W / 2;
            const cy = H / 2;
            const maxR = Math.sqrt(cx * cx + cy * cy);
            for (let i = 0; i < controlPoints.length; i++) {
                const dx = defaultPoints[i].x - cx;
                const dy = defaultPoints[i].y - cy;
                const r = Math.sqrt(dx * dx + dy * dy);
                const nr = r / maxR;
                const factor = 1 - strength * nr * nr;
                controlPoints[i].x = cx + dx * factor;
                controlPoints[i].y = cy + dy * factor;
            }
        }

        function applyKeystone(strength) {
            resetGrid();
            for (let i = 0; i < controlPoints.length; i++) {
                const row = Math.floor(i / gridSize);
                const t = row / (gridSize - 1); // 0 at top, 1 at bottom
                const cx = W / 2;
                const dx = defaultPoints[i].x - cx;
                // Top row narrows, bottom widens
                const scale = 1 + strength * (t - 0.5);
                controlPoints[i].x = cx + dx * scale;
            }
        }

        // --- Rendering ---
        function bilinearInterp(x0, y0, x1, y1, x2, y2, x3, y3, u, v) {
            // Corners: 0=TL, 1=TR, 2=BL, 3=BR
            const x = (1 - u) * (1 - v) * x0 + u * (1 - v) * x1 + (1 - u) * v * x2 + u * v * x3;
            const y = (1 - u) * (1 - v) * y0 + u * (1 - v) * y1 + (1 - u) * v * y2 + u * v * y3;
            return { x, y };
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            const source = (useImage && imageTexture) ? imageTexture : patternCanvas;
            const opacity = (useImage && imageTexture) ? 0.9 : 1.0;

            // Draw background (unwarped, faded)
            if (source) {
                ctx.globalAlpha = 0.25;
                ctx.drawImage(source, 0, 0, W, H);
                ctx.globalAlpha = 1.0;
            }

            // Draw original (default) grid as faint reference
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let row = 0; row < gridSize; row++) {
                ctx.beginPath();
                for (let col = 0; col < gridSize; col++) {
                    const p = defaultPoints[row * gridSize + col];
                    if (col === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }
            for (let col = 0; col < gridSize; col++) {
                ctx.beginPath();
                for (let row = 0; row < gridSize; row++) {
                    const p = defaultPoints[row * gridSize + col];
                    if (row === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            // Draw warped texture cells
            if (source) {
                const subDiv = 8; // subdivisions per cell for smooth warping
                for (let row = 0; row < gridSize - 1; row++) {
                    for (let col = 0; col < gridSize - 1; col++) {
                        const tl = controlPoints[row * gridSize + col];
                        const tr = controlPoints[row * gridSize + col + 1];
                        const bl = controlPoints[(row + 1) * gridSize + col];
                        const br = controlPoints[(row + 1) * gridSize + col + 1];

                        const dtl = defaultPoints[row * gridSize + col];
                        const dtr = defaultPoints[row * gridSize + col + 1];
                        const dbl = defaultPoints[(row + 1) * gridSize + col];
                        const dbr = defaultPoints[(row + 1) * gridSize + col + 1];

                        for (let sv = 0; sv < subDiv; sv++) {
                            for (let su = 0; su < subDiv; su++) {
                                const u0 = su / subDiv;
                                const v0 = sv / subDiv;
                                const u1 = (su + 1) / subDiv;
                                const v1 = (sv + 1) / subDiv;

                                // Source (unwarped) quad corners
                                const s0 = bilinearInterp(dtl.x, dtl.y, dtr.x, dtr.y, dbl.x, dbl.y, dbr.x, dbr.y, u0, v0);
                                const s1 = bilinearInterp(dtl.x, dtl.y, dtr.x, dtr.y, dbl.x, dbl.y, dbr.x, dbr.y, u1, v0);
                                const s2 = bilinearInterp(dtl.x, dtl.y, dtr.x, dtr.y, dbl.x, dbl.y, dbr.x, dbr.y, u0, v1);
                                const s3 = bilinearInterp(dtl.x, dtl.y, dtr.x, dtr.y, dbl.x, dbl.y, dbr.x, dbr.y, u1, v1);

                                // Destination (warped) quad corners
                                const d0 = bilinearInterp(tl.x, tl.y, tr.x, tr.y, bl.x, bl.y, br.x, br.y, u0, v0);
                                const d1 = bilinearInterp(tl.x, tl.y, tr.x, tr.y, bl.x, bl.y, br.x, br.y, u1, v0);
                                const d2 = bilinearInterp(tl.x, tl.y, tr.x, tr.y, bl.x, bl.y, br.x, br.y, u0, v1);
                                const d3 = bilinearInterp(tl.x, tl.y, tr.x, tr.y, bl.x, bl.y, br.x, br.y, u1, v1);

                                // Draw two triangles mapping source texture to destination
                                drawTexturedTriangle(
                                    source,
                                    s0.x, s0.y, s1.x, s1.y, s2.x, s2.y,
                                    d0.x, d0.y, d1.x, d1.y, d2.x, d2.y,
                                    opacity
                                );
                                drawTexturedTriangle(
                                    source,
                                    s1.x, s1.y, s3.x, s3.y, s2.x, s2.y,
                                    d1.x, d1.y, d3.x, d3.y, d2.x, d2.y,
                                    opacity
                                );
                            }
                        }
                    }
                }
            }

            // Draw warped mesh lines
            ctx.strokeStyle = 'rgba(167, 139, 250, 0.5)';
            ctx.lineWidth = 1.5;
            // Horizontal lines
            for (let row = 0; row < gridSize; row++) {
                ctx.beginPath();
                for (let col = 0; col < gridSize; col++) {
                    const p = controlPoints[row * gridSize + col];
                    if (col === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }
            // Vertical lines
            for (let col = 0; col < gridSize; col++) {
                ctx.beginPath();
                for (let row = 0; row < gridSize; row++) {
                    const p = controlPoints[row * gridSize + col];
                    if (row === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            // Draw control points
            for (let i = 0; i < controlPoints.length; i++) {
                const p = controlPoints[i];
                const isHover = (i === hoverIndex);
                const isDrag = (i === dragIndex);
                const r = isDrag ? 8 : isHover ? 7 : 5;

                // Glow
                if (isHover || isDrag) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(107, 37, 221, 0.3)';
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = isDrag ? '#a78bfa' : isHover ? '#8b5cf6' : '#6B25DD';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = isDrag ? 2.5 : 1.5;
                ctx.stroke();
            }
        }

        // Affine texture mapping via canvas drawImage with transform
        function drawTexturedTriangle(img, sx0, sy0, sx1, sy1, sx2, sy2, dx0, dy0, dx1, dy1, dx2, dy2, alpha = 1.0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(dx0, dy0);
            ctx.lineTo(dx1, dy1);
            ctx.lineTo(dx2, dy2);
            ctx.closePath();
            ctx.clip();

            // Compute affine transform from source to destination triangle
            // Source triangle: (sx0,sy0), (sx1,sy1), (sx2,sy2)
            // Dest triangle:   (dx0,dy0), (dx1,dy1), (dx2,dy2)

            const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
            if (Math.abs(denom) < 0.001) { ctx.restore(); return; }

            const m11 = (dx0 * (sy1 - sy2) + dx1 * (sy2 - sy0) + dx2 * (sy0 - sy1)) / denom;
            const m12 = -(dx0 * (sx1 - sx2) + dx1 * (sx2 - sx0) + dx2 * (sx0 - sx1)) / denom;
            const m13 = (dx0 * (sx1 * sy2 - sx2 * sy1) + dx1 * (sx2 * sy0 - sx0 * sy2) + dx2 * (sx0 * sy1 - sx1 * sy0)) / denom;
            const m21 = (dy0 * (sy1 - sy2) + dy1 * (sy2 - sy0) + dy2 * (sy0 - sy1)) / denom;
            const m22 = -(dy0 * (sx1 - sx2) + dy1 * (sx2 - sx0) + dy2 * (sx0 - sx1)) / denom;
            const m23 = (dy0 * (sx1 * sy2 - sx2 * sy1) + dy1 * (sx2 * sy0 - sx0 * sy2) + dy2 * (sx0 * sy1 - sx1 * sy0)) / denom;

            ctx.setTransform(m11, m21, m12, m22, m13, m23);
            ctx.globalAlpha = alpha;
            // Draw image. For patternCanvas we draw 1:1. For imageTexture we might need to scale if dimensions differ?
            // The logic assumes source coordinates (s*) are in 0..W, 0..H space. 
            // If image is different size, we should scale drawImage? 
            // For simplicity, let's assume we map the entire source image to the 0..W, 0..H coords.
            // But texture mapping relies on source coords matching the image pixels.
            // If we use 0..W/H for s* points, we need to draw image at that size.
            ctx.drawImage(img, 0, 0, W, H);
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        // --- Interaction ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function findClosestPoint(mx, my, threshold) {
            let closest = -1;
            let minDist = threshold * threshold;
            for (let i = 0; i < controlPoints.length; i++) {
                const dx = controlPoints[i].x - mx;
                const dy = controlPoints[i].y - my;
                const d2 = dx * dx + dy * dy;
                if (d2 < minDist) {
                    minDist = d2;
                    closest = i;
                }
            }
            return closest;
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            dragIndex = findClosestPoint(x, y, 20);
            if (dragIndex >= 0) {
                canvas.setPointerCapture(e.pointerId);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            const { x, y } = getCanvasCoords(e);
            if (dragIndex >= 0) {
                controlPoints[dragIndex].x = Math.max(5, Math.min(W - 5, x));
                controlPoints[dragIndex].y = Math.max(5, Math.min(H - 5, y));
                draw();
            } else {
                const prev = hoverIndex;
                hoverIndex = findClosestPoint(x, y, 20);
                if (hoverIndex !== prev) draw();
                canvas.style.cursor = hoverIndex >= 0 ? 'grab' : 'crosshair';
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            if (dragIndex >= 0) {
                canvas.releasePointerCapture(e.pointerId);
            }
            dragIndex = -1;
            canvas.style.cursor = 'crosshair';
        });

        canvas.addEventListener('pointerleave', () => {
            if (dragIndex < 0) {
                hoverIndex = -1;
                draw();
            }
        });

        // --- Controls ---
        textureSelect.addEventListener('change', () => {
            useImage = (textureSelect.value === 'image');
            if (useImage) loadImage();
            draw();
        });

        gridSelect.addEventListener('change', () => {
            initGrid(parseInt(gridSelect.value));
            draw();
        });

        btnReset.addEventListener('click', () => {
            resetGrid();
            draw();
        });

        btnBarrel.addEventListener('click', () => {
            applyBarrel(0.25);
            draw();
        });

        btnPincushion.addEventListener('click', () => {
            applyPincushion(0.25);
            draw();
        });

        btnKeystone.addEventListener('click', () => {
            applyKeystone(0.4);
            draw();
        });

        // --- Init ---
        createTestPattern();
        initGrid(gridSize);
        draw();
    })();
</script>
