<div class="interactive-widget" id="linear-wipe-controls-widget">
    <style>
        #linear-wipe-controls-widget {
            width: 100%;
        }

        #linear-wipe-controls-widget .lw-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #linear-wipe-controls-widget .lw-canvas-wrap {
            flex: 1;
            min-width: 0;
        }

        #linear-wipe-controls-widget canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        #linear-wipe-controls-widget .lw-info {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(107, 37, 221, 0.06);
            border-left: 3px solid var(--accent-primary, #6B25DD);
            font-size: 0.8rem;
            line-height: 1.45;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        #linear-wipe-controls-widget .lw-controls {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #linear-wipe-controls-widget .lw-control {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle, rgba(255,255,255,0.06));
            background: rgba(255, 255, 255, 0.02);
            transition: border-color 0.2s, background 0.2s;
        }

        #linear-wipe-controls-widget .lw-control:hover {
            border-color: var(--accent-primary, #6B25DD);
            background: rgba(107, 37, 221, 0.07);
        }

        #linear-wipe-controls-widget .lw-control[data-param="angle"]:hover {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.07);
        }

        #linear-wipe-controls-widget .lw-control[data-param="location"]:hover {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.07);
        }

        #linear-wipe-controls-widget .lw-control[data-param="feather"]:hover {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.07);
        }

        #linear-wipe-controls-widget .lw-control[data-param="completion"]:hover {
            border-color: #c084fc;
            background: rgba(192, 132, 252, 0.07);
        }

        #linear-wipe-controls-widget .lw-control label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary, #f8fafc);
            pointer-events: none;
        }

        #linear-wipe-controls-widget .lw-control[data-param="angle"] label    { color: #f87171; }
        #linear-wipe-controls-widget .lw-control[data-param="location"] label  { color: #60a5fa; }
        #linear-wipe-controls-widget .lw-control[data-param="feather"] label   { color: #4ade80; }
        #linear-wipe-controls-widget .lw-control[data-param="completion"] label { color: #c084fc; }

        #linear-wipe-controls-widget .lw-control input[type=range] {
            width: 100%;
            height: 5px;
            cursor: pointer;
        }

        #linear-wipe-controls-widget .lw-control[data-param="angle"]      input[type=range] { accent-color: #f87171; }
        #linear-wipe-controls-widget .lw-control[data-param="location"]   input[type=range] { accent-color: #60a5fa; }
        #linear-wipe-controls-widget .lw-control[data-param="feather"]    input[type=range] { accent-color: #4ade80; }
        #linear-wipe-controls-widget .lw-control[data-param="completion"] input[type=range] { accent-color: #c084fc; }

        #linear-wipe-controls-widget .lw-val {
            font-size: 0.7rem;
            color: var(--text-muted, #8494a7);
            font-variant-numeric: tabular-nums;
        }

        #linear-wipe-controls-widget .lw-reset-btn {
            margin-top: 4px;
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            background: var(--bg-tertiary, #1a1a25);
            color: var(--text-secondary, #94a3b8);
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        #linear-wipe-controls-widget .lw-reset-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #linear-wipe-controls-widget .lw-legend {
            display: flex;
            gap: 14px;
            margin-top: 8px;
            flex-wrap: wrap;
            font-size: 0.72rem;
            color: var(--text-muted, #8494a7);
        }

        #linear-wipe-controls-widget .lw-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #linear-wipe-controls-widget .lw-legend .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        @media (max-width: 680px) {
            #linear-wipe-controls-widget .lw-layout {
                flex-direction: column;
            }

            #linear-wipe-controls-widget .lw-controls {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }

            #linear-wipe-controls-widget .lw-control {
                flex: 1 1 45%;
                min-width: 130px;
            }
        }
    </style>

    <div class="lw-layout">
        <div class="lw-canvas-wrap">
            <canvas id="lw-canvas" width="800" height="500"></canvas>
            <div class="lw-info" id="lw-info">
                Adjust the sliders to see how each parameter shapes the wipe transition.
            </div>
        </div>

        <div class="lw-controls">
            <div class="lw-control" data-param="angle">
                <label>Angle</label>
                <input type="range" id="lw-angle" min="-180" max="180" value="0" step="1">
                <span class="lw-val" id="lw-angle-val">0&deg;</span>
            </div>
            <div class="lw-control" data-param="location">
                <label>Location</label>
                <input type="range" id="lw-location" min="0" max="100" value="50" step="1">
                <span class="lw-val" id="lw-location-val">50%</span>
            </div>
            <div class="lw-control" data-param="feather">
                <label>Feather</label>
                <input type="range" id="lw-feather" min="0" max="100" value="10" step="1">
                <span class="lw-val" id="lw-feather-val">10%</span>
            </div>
            <div class="lw-control" data-param="completion">
                <label>Completion</label>
                <input type="range" id="lw-completion" min="0" max="100" value="50" step="1">
                <span class="lw-val" id="lw-completion-val">50%</span>
            </div>
            <button class="lw-reset-btn" id="lw-reset">Reset</button>
        </div>
    </div>

    <div class="lw-legend">
        <span><span class="dot" style="background:#f87171;"></span> Angle — edge rotation</span>
        <span><span class="dot" style="background:#60a5fa;"></span> Location — edge offset</span>
        <span><span class="dot" style="background:#4ade80;"></span> Feather — edge softness</span>
        <span><span class="dot" style="background:#c084fc;"></span> Completion — wipe progress</span>
    </div>
</div>

<script>
(function () {
    var canvas = document.getElementById('lw-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    var sliderAngle      = document.getElementById('lw-angle');
    var sliderLocation   = document.getElementById('lw-location');
    var sliderFeather    = document.getElementById('lw-feather');
    var sliderCompletion = document.getElementById('lw-completion');

    var valAngle      = document.getElementById('lw-angle-val');
    var valLocation   = document.getElementById('lw-location-val');
    var valFeather    = document.getElementById('lw-feather-val');
    var valCompletion = document.getElementById('lw-completion-val');

    var infoEl = document.getElementById('lw-info');

    // -------------------------------------------------------------------
    // Off-screen canvases (created once, reused)
    // -------------------------------------------------------------------
    var checkerCanvas = null;
    var contentCanvas = null;

    function buildCheckerCanvas() {
        checkerCanvas = document.createElement('canvas');
        checkerCanvas.width  = W;
        checkerCanvas.height = H;
        var c = checkerCanvas.getContext('2d');
        var sz = 10;
        for (var row = 0; row < Math.ceil(H / sz); row++) {
            for (var col = 0; col < Math.ceil(W / sz); col++) {
                c.fillStyle = (row + col) % 2 === 0 ? '#444' : '#555';
                c.fillRect(col * sz, row * sz, sz, sz);
            }
        }
    }

    function buildContentCanvas() {
        contentCanvas = document.createElement('canvas');
        contentCanvas.width  = W;
        contentCanvas.height = H;
        var c = contentCanvas.getContext('2d');

        // Base gradient — dark blue to purple, matching wiki aesthetic
        var grad = c.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0,   '#1e3a5f');
        grad.addColorStop(0.4, '#2d1b69');
        grad.addColorStop(0.7, '#1a1a40');
        grad.addColorStop(1,   '#0d1a2e');
        c.fillStyle = grad;
        c.fillRect(0, 0, W, H);

        // Subtle horizontal scan lines
        c.strokeStyle = 'rgba(255,255,255,0.04)';
        c.lineWidth = 1;
        for (var y = 0; y < H; y += 20) {
            c.beginPath();
            c.moveTo(0, y);
            c.lineTo(W, y);
            c.stroke();
        }

        // Grid overlay
        var cols = 10, rows = 6;
        var cw = W / cols, ch = H / rows;
        c.strokeStyle = 'rgba(99, 102, 241, 0.18)';
        c.lineWidth = 1;
        for (var i = 1; i < cols; i++) {
            c.beginPath();
            c.moveTo(i * cw, 0);
            c.lineTo(i * cw, H);
            c.stroke();
        }
        for (var j = 1; j < rows; j++) {
            c.beginPath();
            c.moveTo(0, j * ch);
            c.lineTo(W, j * ch);
            c.stroke();
        }

        // Diagonal accent lines
        c.strokeStyle = 'rgba(192, 132, 252, 0.12)';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(0, 0);    c.lineTo(W, H);
        c.moveTo(W, 0);    c.lineTo(0, H);
        c.stroke();

        // Centre crosshair
        c.strokeStyle = 'rgba(139, 92, 246, 0.3)';
        c.lineWidth = 1;
        c.setLineDash([6, 6]);
        c.beginPath();
        c.moveTo(W / 2, 0);  c.lineTo(W / 2, H);
        c.moveTo(0, H / 2);  c.lineTo(W, H / 2);
        c.stroke();
        c.setLineDash([]);

        // "CUE CONTENT" watermark label
        c.font = 'bold 52px "Futura Now Headline", Futura, system-ui, sans-serif';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillStyle = 'rgba(255,255,255,0.10)';
        c.fillText('CUE CONTENT', W / 2, H / 2);

        // Sub-label
        c.font = '18px "Futura Now Headline", Futura, system-ui, sans-serif';
        c.fillStyle = 'rgba(192, 132, 252, 0.35)';
        c.fillText('WATCHOUT · Linear Wipe', W / 2, H / 2 + 44);
    }

    // -------------------------------------------------------------------
    // Wipe geometry helpers
    // -------------------------------------------------------------------
    // 'angle' in WATCHOUT: 0° = vertical edge (perpendicular = horizontal).
    // So the edge normal direction (across which the wipe travels) is:
    //   nx = cos(angle_rad), ny = sin(angle_rad)
    // The edge itself runs perpendicular to that.
    //
    // 'location' (0–100) shifts the edge's zero-completion position along
    // the normal axis, as a percentage of the full projected span.
    //
    // 'completion' (0–100) positions the current edge along the normal axis:
    //   0  → fully hidden (edge at the "before start" end)
    //   100 → fully visible (edge at the "past end" end)
    //
    // 'feather' (0–100) expands a soft gradient zone on either side of the edge,
    // as a percentage of the shorter canvas dimension.
    //
    // The gradient is drawn destination-out so it erases the content layer,
    // leaving the checkerboard visible (= "transparent" / "hidden" region).
    // -------------------------------------------------------------------

    function getParams() {
        return {
            angle:      parseFloat(sliderAngle.value),
            location:   parseFloat(sliderLocation.value),
            feather:    parseFloat(sliderFeather.value),
            completion: parseFloat(sliderCompletion.value)
        };
    }

    // Project all 4 canvas corners onto the normal vector, return [min, max].
    function cornerProjections(nx, ny) {
        var corners = [[0,0],[W,0],[W,H],[0,H]];
        var vals = corners.map(function(p) { return p[0]*nx + p[1]*ny; });
        return [Math.min.apply(null, vals), Math.max.apply(null, vals)];
    }

    function draw() {
        var p = getParams();

        // Update displayed values
        valAngle.textContent      = p.angle + '\u00B0';
        valLocation.textContent   = p.location + '%';
        valFeather.textContent    = p.feather + '%';
        valCompletion.textContent = p.completion + '%';

        // Wipe normal direction (perpendicular to edge, direction of travel)
        // 0° → vertical edge → normal is horizontal → nx=1, ny=0
        var angleRad = p.angle * Math.PI / 180;
        var nx = Math.cos(angleRad);
        var ny = Math.sin(angleRad);

        // Projected extent of canvas along normal
        var extent = cornerProjections(nx, ny);
        var projMin = extent[0];
        var projMax = extent[1];
        var projSpan = projMax - projMin;

        // The "zero" position of the edge is set by Location.
        // Location = 50 means the edge origin is at the midpoint of the span.
        // Completion then moves the edge: 0 = fully hidden, 100 = fully visible.
        // We map [0..100] completion onto [projMin - margin .. projMax + margin]
        // so the fully-hidden state is beyond one edge and fully-visible is beyond the other.

        // At completion=0: edge is at projMin (entire cue is on the "hidden" side)
        // At completion=100: edge is at projMax (entire cue is on the "visible" side)
        // Location offsets the range: it shifts which part of the span is covered.
        var locationOffset = (p.location / 100 - 0.5) * projSpan;
        var edgeCenter = projMin + (p.completion / 100) * projSpan + locationOffset;

        // Feather half-width in pixels (as % of short dimension)
        var featherPx = (p.feather / 100) * Math.min(W, H) * 0.5;
        // Minimum 1px so gradient constructor doesn't error at feather=0
        var halfFeather = Math.max(0.5, featherPx);

        // Gradient goes from (hidden side = destination-out fully applied)
        // to (visible side = destination-out not applied).
        // Hidden side: edgeCenter - halfFeather (and below in projection)
        // Visible side: edgeCenter + halfFeather (and above in projection)

        var gStartProj = edgeCenter - halfFeather;
        var gEndProj   = edgeCenter + halfFeather;

        // Convert projected positions back to canvas coordinates:
        // A projected value 't' along normal (nx,ny) maps to the canvas point
        // closest to the origin with that projection.
        // We use the canvas center as origin offset to avoid choosing a specific
        // point — instead we build the gradient endpoints as:
        //   point = (t - centerProj) * (nx, ny) + (W/2, H/2)
        // where centerProj = (W/2)*nx + (H/2)*ny
        var centerProj = (W / 2) * nx + (H / 2) * ny;
        function projToCanvas(t) {
            var d = t - centerProj;
            return { x: W / 2 + d * nx, y: H / 2 + d * ny };
        }

        var gStart = projToCanvas(gStartProj);
        var gEnd   = projToCanvas(gEndProj);

        // -------------------------------------------------------------------
        // Render
        // -------------------------------------------------------------------
        ctx.clearRect(0, 0, W, H);

        // 1. Checkerboard background (transparency indicator)
        ctx.drawImage(checkerCanvas, 0, 0);

        // 2. Cue content layer on an intermediate canvas so we can apply
        //    destination-out masking without destroying the checkerboard.
        var offscreen = document.createElement('canvas');
        offscreen.width  = W;
        offscreen.height = H;
        var oc = offscreen.getContext('2d');

        // Draw content
        oc.drawImage(contentCanvas, 0, 0);

        // Apply wipe mask via destination-out — this erases the hidden region.
        // The gradient runs from opaque black (full erase) → transparent (no erase).
        oc.globalCompositeOperation = 'destination-out';

        var grad = oc.createLinearGradient(gStart.x, gStart.y, gEnd.x, gEnd.y);
        // hidden side (before edge) → fully erased
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        // visible side (after edge) → not erased
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        // Fill entire canvas with the gradient
        oc.fillStyle = grad;
        oc.fillRect(0, 0, W, H);
        oc.globalCompositeOperation = 'source-over';

        // Composite the masked content onto the main canvas
        ctx.drawImage(offscreen, 0, 0);

        // -------------------------------------------------------------------
        // 3. Edge indicator — dashed line along the wipe edge + arrow
        // -------------------------------------------------------------------
        // Edge direction vector (perpendicular to normal)
        var ex = -ny, ey = nx;

        // Edge midpoint (on the edgeCenter projected position)
        var edgeMid = projToCanvas(edgeCenter);

        // Extend edge line across the full canvas diagonal
        var diagLen = Math.sqrt(W * W + H * H);

        // Clamp edge line to canvas using a simple parametric clip
        var x0 = edgeMid.x - ex * diagLen;
        var y0 = edgeMid.y - ey * diagLen;
        var x1 = edgeMid.x + ex * diagLen;
        var y1 = edgeMid.y + ey * diagLen;

        // Draw main edge line — dashed, bright accent colour
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.setLineDash([]);

        // Feather zone band (semi-transparent band straddling the edge)
        if (halfFeather > 1) {
            var bandGrad = ctx.createLinearGradient(gStart.x, gStart.y, gEnd.x, gEnd.y);
            bandGrad.addColorStop(0,    'rgba(74, 222, 128, 0)');
            bandGrad.addColorStop(0.3,  'rgba(74, 222, 128, 0.08)');
            bandGrad.addColorStop(0.5,  'rgba(74, 222, 128, 0.18)');
            bandGrad.addColorStop(0.7,  'rgba(74, 222, 128, 0.08)');
            bandGrad.addColorStop(1,    'rgba(74, 222, 128, 0)');
            ctx.fillStyle = bandGrad;
            ctx.fillRect(0, 0, W, H);
        }

        // Arrow showing the direction of travel (normal direction)
        // Draw arrow from edge midpoint pointing in the normal direction
        var arrowLen = 32;
        var arrowHeadLen = 9;
        var ax = edgeMid.x + nx * arrowLen;
        var ay = edgeMid.y + ny * arrowLen;

        // Arrow shaft
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(edgeMid.x, edgeMid.y);
        ctx.lineTo(ax, ay);
        ctx.stroke();

        // Arrow head
        var ux = nx, uy = ny;
        ctx.fillStyle = '#c084fc';
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - ux * arrowHeadLen - uy * arrowHeadLen * 0.45,
                   ay - uy * arrowHeadLen + ux * arrowHeadLen * 0.45);
        ctx.lineTo(ax - ux * arrowHeadLen + uy * arrowHeadLen * 0.45,
                   ay - uy * arrowHeadLen - ux * arrowHeadLen * 0.45);
        ctx.closePath();
        ctx.fill();

        // Small dot at edge midpoint
        ctx.beginPath();
        ctx.arc(edgeMid.x, edgeMid.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fill();

        ctx.restore();

        // -------------------------------------------------------------------
        // 4. Info strip
        // -------------------------------------------------------------------
        var edgeDesc = p.angle === 0   ? 'vertical edge' :
                       p.angle === 90  ? 'horizontal edge' :
                       p.angle === -90 ? 'horizontal edge' :
                       p.angle + '\u00B0 edge';

        var featherDesc = p.feather === 0 ? 'hard edge' :
                          p.feather < 15  ? 'soft feather' :
                          'wide feather';

        var completionDesc = p.completion === 0   ? 'fully hidden' :
                             p.completion === 100  ? 'fully visible' :
                             p.completion + '% revealed';

        infoEl.innerHTML =
            '<strong>' + edgeDesc + '</strong> &nbsp;&middot;&nbsp; ' +
            'location <strong>' + p.location + '%</strong> &nbsp;&middot;&nbsp; ' +
            featherDesc + ' <strong>' + p.feather + '%</strong> &nbsp;&middot;&nbsp; ' +
            completionDesc;
    }

    // -------------------------------------------------------------------
    // Events
    // -------------------------------------------------------------------
    sliderAngle.addEventListener('input', draw);
    sliderLocation.addEventListener('input', draw);
    sliderFeather.addEventListener('input', draw);
    sliderCompletion.addEventListener('input', draw);

    document.getElementById('lw-reset').addEventListener('click', function () {
        sliderAngle.value      = 0;
        sliderLocation.value   = 50;
        sliderFeather.value    = 10;
        sliderCompletion.value = 50;
        draw();
    });

    // -------------------------------------------------------------------
    // Init
    // -------------------------------------------------------------------
    buildCheckerCanvas();
    buildContentCanvas();
    draw();
})();
</script>
