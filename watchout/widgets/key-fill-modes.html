<div class="interactive-widget" id="key-fill-widget">
    <div class="widget-controls" style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
        <div class="control-group">
            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Key Mode</label>
            <select id="kf-mode-select"
                style="width: 100%; padding: 8px; border-radius: 4px; background: var(--input-bg); border: 1px solid var(--border-subtle); color: var(--text-primary);">
                <option value="luma">Luma</option>
                <option value="luma-inv">Luma Inverted</option>
                <option value="alpha">Alpha</option>
                <option value="alpha-inv">Alpha Inverted</option>
            </select>
        </div>
        <div class="control-group" style="display: flex; align-items: center; gap: 8px; padding-top: 22px;">
            <input type="checkbox" id="kf-show-mask" style="cursor: pointer;">
            <label for="kf-show-mask" style="cursor: pointer; user-select: none;">Show Alpha Mask Only</label>
        </div>
    </div>

    <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
        <!-- Key Layer -->
        <div style="text-align: center;">
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Key Layer</div>
            <canvas id="kf-key-canvas" width="200" height="200"
                style="border-radius: 6px; border: 1px solid var(--border-subtle); max-width: 100%; height: auto;"></canvas>
        </div>

        <div style="display: flex; align-items: center; font-size: 1.4rem; color: var(--text-muted); padding-top: 20px;">+</div>

        <!-- Fill Layer -->
        <div style="text-align: center;">
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Fill Layer</div>
            <canvas id="kf-fill-canvas" width="200" height="200"
                style="border-radius: 6px; border: 1px solid var(--border-subtle); max-width: 100%; height: auto;"></canvas>
        </div>

        <div style="display: flex; align-items: center; font-size: 1.4rem; color: var(--text-muted); padding-top: 20px;">=</div>

        <!-- Result -->
        <div style="text-align: center;">
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;">Result</div>
            <canvas id="kf-result-canvas" width="200" height="200"
                style="border-radius: 6px; border: 2px solid var(--accent-primary); max-width: 100%; height: auto;"></canvas>
        </div>
    </div>

    <div id="kf-explainer"
        style="background: var(--code-bg); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent-primary); color: var(--text-primary); margin-top: 20px; line-height: 1.6; font-size: 0.9rem;">
    </div>
</div>

<script>
    (function () {
        var keyCanvas = document.getElementById('kf-key-canvas');
        var fillCanvas = document.getElementById('kf-fill-canvas');
        var resultCanvas = document.getElementById('kf-result-canvas');
        var modeSelect = document.getElementById('kf-mode-select');
        var showMask = document.getElementById('kf-show-mask');
        var explainer = document.getElementById('kf-explainer');

        if (!keyCanvas || !fillCanvas || !resultCanvas) return;

        var ctxKey = keyCanvas.getContext('2d');
        var ctxFill = fillCanvas.getContext('2d');
        var ctxResult = resultCanvas.getContext('2d');

        var W = 200;
        var H = 200;

        // Pre-generate fill layer image data (colorful test pattern)
        var fillImageData = ctxFill.createImageData(W, H);
        (function generateFillPattern() {
            var data = fillImageData.data;
            for (var y = 0; y < H; y++) {
                for (var x = 0; x < W; x++) {
                    var idx = (y * W + x) * 4;
                    // Six vertical color bars
                    var barWidth = W / 6;
                    var barIndex = Math.floor(x / barWidth);
                    var colors = [
                        [220, 50, 50],   // Red
                        [50, 180, 50],   // Green
                        [50, 100, 220],  // Blue
                        [220, 200, 50],  // Yellow
                        [200, 50, 200],  // Magenta
                        [50, 200, 200]   // Cyan
                    ];
                    var c = colors[Math.min(barIndex, 5)];
                    // Add a subtle horizontal gradient for visual interest
                    var brightness = 0.7 + 0.3 * (y / H);
                    data[idx]     = Math.round(c[0] * brightness);
                    data[idx + 1] = Math.round(c[1] * brightness);
                    data[idx + 2] = Math.round(c[2] * brightness);
                    data[idx + 3] = 255;
                }
            }
        })();

        // Draw checkerboard background on a canvas context
        function drawCheckerboard(ctx, w, h) {
            var size = 10;
            for (var y = 0; y < h; y += size) {
                for (var x = 0; x < w; x += size) {
                    var isLight = ((Math.floor(x / size) + Math.floor(y / size)) % 2 === 0);
                    ctx.fillStyle = isLight ? '#cccccc' : '#999999';
                    ctx.fillRect(x, y, size, size);
                }
            }
        }

        function update() {
            var mode = modeSelect.value;
            var maskOnly = showMask.checked;

            // --- Draw Key Layer ---
            var keyImageData = ctxKey.createImageData(W, H);
            var kd = keyImageData.data;

            var isAlphaMode = (mode === 'alpha' || mode === 'alpha-inv');

            for (var y = 0; y < H; y++) {
                for (var x = 0; x < W; x++) {
                    var idx = (y * W + x) * 4;
                    // Horizontal gradient left (0) to right (1)
                    var t = x / (W - 1);

                    if (isAlphaMode) {
                        // For alpha modes: show a solid midtone gray with varying alpha
                        kd[idx]     = 140;
                        kd[idx + 1] = 140;
                        kd[idx + 2] = 140;
                        kd[idx + 3] = Math.round(t * 255);
                    } else {
                        // For luma modes: black-to-white luminance ramp, fully opaque
                        var v = Math.round(t * 255);
                        kd[idx]     = v;
                        kd[idx + 1] = v;
                        kd[idx + 2] = v;
                        kd[idx + 3] = 255;
                    }
                }
            }

            // Draw key layer with checkerboard behind (visible for alpha modes)
            drawCheckerboard(ctxKey, W, H);
            // Put key image on top using a temp canvas to preserve alpha compositing
            var tmpCanvas = document.createElement('canvas');
            tmpCanvas.width = W;
            tmpCanvas.height = H;
            var tmpCtx = tmpCanvas.getContext('2d');
            tmpCtx.putImageData(keyImageData, 0, 0);
            ctxKey.drawImage(tmpCanvas, 0, 0);

            // --- Draw Fill Layer ---
            ctxFill.putImageData(fillImageData, 0, 0);

            // --- Compute Result ---
            var fd = fillImageData.data;

            // Compute alpha for each pixel based on mode
            var resultImageData = ctxResult.createImageData(W, H);
            var rd = resultImageData.data;

            for (var y = 0; y < H; y++) {
                for (var x = 0; x < W; x++) {
                    var idx = (y * W + x) * 4;
                    var t = x / (W - 1);

                    // Determine the alpha value from the key layer
                    var keyAlpha;
                    if (mode === 'luma') {
                        // Luminance of key pixel (it's grayscale so r=g=b=t*255)
                        keyAlpha = t;
                    } else if (mode === 'luma-inv') {
                        keyAlpha = 1.0 - t;
                    } else if (mode === 'alpha') {
                        keyAlpha = t;
                    } else if (mode === 'alpha-inv') {
                        keyAlpha = 1.0 - t;
                    }

                    if (maskOnly) {
                        // Show alpha mask as white-on-black
                        var mv = Math.round(keyAlpha * 255);
                        rd[idx]     = mv;
                        rd[idx + 1] = mv;
                        rd[idx + 2] = mv;
                        rd[idx + 3] = 255;
                    } else {
                        // Composite fill with computed alpha
                        rd[idx]     = fd[idx];
                        rd[idx + 1] = fd[idx + 1];
                        rd[idx + 2] = fd[idx + 2];
                        rd[idx + 3] = Math.round(keyAlpha * 255);
                    }
                }
            }

            // Draw result with checkerboard
            if (maskOnly) {
                ctxResult.putImageData(resultImageData, 0, 0);
            } else {
                drawCheckerboard(ctxResult, W, H);
                var tmpResult = document.createElement('canvas');
                tmpResult.width = W;
                tmpResult.height = H;
                var tmpResultCtx = tmpResult.getContext('2d');
                tmpResultCtx.putImageData(resultImageData, 0, 0);
                ctxResult.drawImage(tmpResult, 0, 0);
            }

            // --- Update Explainer ---
            var descriptions = {
                'luma': '<strong>Luma</strong> — The brightness (luminance) of each pixel in the key layer controls the opacity of the corresponding pixel in the fill layer. Bright areas of the key become opaque; dark areas become transparent. The left side of the key is black (zero luminance) so the fill is fully transparent there. The right side is white (full luminance) so the fill is fully visible.',
                'luma-inv': '<strong>Luma Inverted</strong> — The inverse of the key layer\'s luminance controls opacity. Dark areas of the key become opaque; bright areas become transparent. This is the opposite of standard Luma mode — the fill is fully visible on the left (where the key is dark) and transparent on the right (where the key is bright).',
                'alpha': '<strong>Alpha</strong> — The alpha channel of the key layer directly controls the opacity of the fill layer. The key layer\'s RGB color does not matter — only its transparency value. Where the key is fully opaque (right side), the fill is visible. Where the key is fully transparent (left side), the fill is hidden.',
                'alpha-inv': '<strong>Alpha Inverted</strong> — The inverse of the key layer\'s alpha channel controls opacity. Where the key is transparent (left side), the fill becomes visible. Where the key is opaque (right side), the fill is hidden. This reverses the standard Alpha behavior.'
            };
            explainer.innerHTML = descriptions[mode];
        }

        modeSelect.addEventListener('change', update);
        showMask.addEventListener('change', update);

        update();
    })();
</script>
