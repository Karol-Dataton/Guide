<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WATCHOUT Tools</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10151d;
            --panel: #19212d;
            --text: #e7edf8;
            --muted: #8f9cb0;
            --active: #3c8af7;
            --border: #2a3546;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        .app {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100%;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .label {
            font-size: 12px;
            color: var(--muted);
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .tool {
            border: 1px solid var(--border);
            background: #222d3d;
            color: var(--text);
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .tool:hover {
            border-color: #4a5d77;
        }

        .tool.active {
            border-color: var(--active);
            background: #223d66;
        }

        .hint {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
        }

        #tool-frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #0d1016;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="topbar" id="topbar">
            <span class="label">Tools</span>
            <button class="tool" data-key="1" data-path="/wiki/index.html">Wiki</button>
            <button class="tool" data-key="2" data-path="/dashboard/index.html">Dashboard</button>
            <button class="tool" data-key="3" data-path="/planner/index.html">Planner</button>
            <button class="tool" data-key="4" data-path="/shortcuts/index.html">Shortcuts</button>
            <button class="tool" data-key="5" data-path="/test-patterns/index.html">Test Patterns</button>
            <span class="hint">Ctrl+1..5</span>
        </div>
        <iframe id="tool-frame" title="WATCHOUT tools"></iframe>
    </div>

    <script>
        const frame = document.getElementById('tool-frame');
        const buttons = [...document.querySelectorAll('.tool')];

        function normalizeToolPath(path) {
            if (!path || typeof path !== 'string') return '/wiki/index.html';
            if (!path.startsWith('/')) return '/wiki/index.html';
            return path;
        }

        function setActive(path) {
            buttons.forEach((button) => {
                const btnPath = button.dataset.path;
                button.classList.toggle('active', path.startsWith(btnPath.replace('/index.html', '/')) || path === btnPath);
            });
        }

        function navigate(path) {
            const targetPath = normalizeToolPath(path);
            frame.src = targetPath;
            setActive(targetPath);
            history.replaceState(null, '', `#${targetPath}`);
        }

        buttons.forEach((button) => {
            button.addEventListener('click', () => navigate(button.dataset.path));
        });

        document.addEventListener('keydown', (event) => {
            if (!event.ctrlKey && !event.metaKey) return;
            const match = buttons.find((button) => button.dataset.key === event.key);
            if (!match) return;
            event.preventDefault();
            navigate(match.dataset.path);
        });

        const initialPath = normalizeToolPath(window.location.hash.slice(1));
        navigate(initialPath);
    </script>
</body>

</html>
