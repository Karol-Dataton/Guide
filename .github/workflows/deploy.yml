name: Deploy Watchout Guide

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Grant permissions for both Releases and Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent multiple deployments from overlapping
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci
        working-directory: wiki

      - name: Build Documentation
        run: npm run build
        working-directory: wiki

      - name: Create Artifact Zip (Tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r watchout-docs-${{ github.ref_name }}.zip . -x ".git/*" ".github/*" "wiki/node_modules/*" "node_modules/*"

      - name: Create Release (Tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: watchout-docs-${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Deploy the root to include test-patterns, planner, etc.

  deploy:
    # This job handles the actual deployment move
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4